<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Solar Proposal | Solar Review</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --cream:#F3EDE3; --cream2:#EDE5D8; --lime:#8DC63F; --dark:#1A1A1A;
  --muted:#7A746C; --line:#DDD6C8; --white:#FDFAF6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--white); color:var(--dark); font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.6; padding-bottom:92px;
}
header{padding:22px 28px;border-bottom:1px solid var(--line);}
.wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;letter-spacing:0.01em;}
.wordmark em{color:var(--lime);font-style:normal;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
.state{padding:140px 0;text-align:center;color:var(--muted);font-size:0.9rem;}

/* ── Tesla-style configurator layout: big stage left, config panel right ── */
.configurator-grid{display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:start;padding:36px 0 48px;}
@media(max-width:900px){.configurator-grid{grid-template-columns:1fr;gap:28px;}}

.stage{background:var(--cream);border-radius:20px;padding:48px 32px;position:relative;min-height:380px;display:flex;align-items:center;justify-content:center;}
.stage img{max-width:78%;max-height:340px;object-fit:contain;}
.callout{position:absolute;font-size:0.76rem;color:var(--dark);display:flex;align-items:center;gap:6px;}
.callout .dot{width:16px;height:16px;border:1.5px solid var(--dark);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.6rem;flex-shrink:0;}
.callout .line{position:absolute;background:var(--muted);width:1px;}

.panel .kicker{font-size:0.66rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
.panel h1{font-family:'Playfair Display',serif;font-weight:700;font-size:1.8rem;margin:4px 0 4px;line-height:1.15;}
.panel .addr{font-size:0.84rem;color:var(--muted);margin-bottom:20px;}

.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tab{flex:1;text-align:center;padding:12px 4px;background:none;border:none;border-bottom:2px solid transparent;font-family:'Inter',sans-serif;font-size:0.86rem;font-weight:500;color:var(--muted);cursor:pointer;}
.tab.active{border-bottom-color:var(--dark);color:var(--dark);font-weight:700;}

.fin-sub{display:flex;gap:6px;margin-bottom:14px;}
.fin-sub-btn{flex:1;padding:8px 4px;background:var(--cream2);border:1px solid transparent;border-radius:8px;color:var(--muted);cursor:pointer;font-size:0.64rem;font-weight:600;font-family:'Inter',sans-serif;position:relative;}
.fin-sub-btn.active{background:var(--dark);color:var(--cream);font-weight:700;}

/* ── Aurora-style itemized comparison card ── */
.compare-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--white);}
.compare-row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid var(--line);}
.compare-row .lbl{font-size:0.78rem;color:#4a463f;}
.compare-row .lbl .sub{display:block;font-size:0.66rem;color:var(--muted);margin-top:1px;}
.compare-row .amt{font-size:0.86rem;font-weight:600;font-family:'Inter',sans-serif;white-space:nowrap;}
.compare-row .amt.neg{color:#3f6b16;}
.compare-total{padding:14px 16px;background:var(--cream);}
.compare-total .lbl{font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
.compare-total .big{font-family:'Inter',sans-serif;font-weight:300;font-size:2.2rem;line-height:1.05;letter-spacing:-0.01em;margin-top:2px;}
.compare-total .big small{font-weight:400;font-size:0.95rem;color:var(--muted);}
.compare-total .delta{font-size:0.76rem;color:#3f6b16;font-weight:600;margin-top:4px;}
.compare-foot{display:flex;justify-content:space-between;padding:9px 16px;background:#EFE9DC;font-size:0.68rem;color:var(--muted);}
.compare-foot strong{color:var(--dark);}

.applied-badge{display:inline-flex;align-items:center;gap:4px;font-size:0.62rem;font-weight:700;letter-spacing:0.03em;color:#fff;background:#3f6b16;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle;}

.fin-note{font-size:0.76rem;color:#4a463f;line-height:1.65;margin:2px 0 16px;}
.fin-note strong{color:var(--dark);}
.fine-print{font-size:0.66rem;color:var(--muted);line-height:1.6;margin:0 0 18px;padding-top:10px;border-top:1px solid var(--line);}

.opt-list{margin-bottom:18px;}
.opt-row{display:flex;justify-content:space-between;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color 0.15s;}
.opt-row:hover{border-color:#bcb6a8;}
.opt-row.active{border-color:var(--dark);border-width:2px;padding:15px;}
.opt-row .ot{font-size:0.88rem;font-weight:600;}
.opt-row .os{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.opt-row .op{font-size:0.86rem;font-weight:700;white-space:nowrap;margin-left:12px;}

.link-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);font-size:0.86rem;cursor:pointer;}
.link-row .chev{color:var(--muted);}
.rebate-note{font-size:0.8rem;color:var(--lime);margin:4px 0 18px;}
.rebate-note a{color:var(--lime);}

details.spec{border-top:1px solid var(--line);padding:14px 0;}
details.spec summary{cursor:pointer;font-size:0.86rem;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;}
details.spec summary::-webkit-details-marker{display:none;}
details.spec summary:after{content:'+';font-size:1.1rem;font-weight:400;color:var(--muted);}
details.spec[open] summary:after{content:'\2212';}
details.spec .body{font-size:0.82rem;color:#4a463f;line-height:1.75;padding-top:12px;}
details.spec .body h3{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:1.05rem;margin:0 0 8px;color:var(--dark);}
.pw-video-wrap{margin-top:14px;border-radius:10px;overflow:hidden;aspect-ratio:16/9;width:100%;background:#0d0d0d;}
.pw-video-wrap iframe{width:100%;height:100%;border:0;display:block;}
.pw-video-caption{font-size:0.66rem;color:var(--muted);margin-top:6px;text-align:right;}
.li-table{width:100%;border-collapse:collapse;}
.li-table tr{border-bottom:1px solid var(--line);}
.li-table tr:last-child{border-bottom:none;}
.li-table td{padding:8px 0;font-size:0.82rem;vertical-align:top;}
.li-table td.li-name{color:var(--dark);font-weight:500;}
.li-table td.li-price{text-align:right;white-space:nowrap;color:var(--muted);font-family:'Inter',sans-serif;}

.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,0.04);}
.bottombar-in{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.bb-left .ot{font-weight:700;font-size:0.92rem;}
.bb-left .os{font-size:0.74rem;color:var(--muted);}
.bb-price{font-size:1.15rem;font-weight:800;white-space:nowrap;}
.bb-price small{font-size:0.7rem;color:var(--muted);font-weight:500;}
.cta-btn{padding:15px 28px;background:var(--dark);color:var(--cream);border:none;border-radius:100px;font-family:'Inter',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer;white-space:nowrap;}
.cta-btn:disabled{opacity:0.5;cursor:default;}
.status-msg{width:100%;text-align:center;font-size:0.8rem;padding-bottom:8px;}
.status-msg.ok{color:#3f6b16;}
.status-msg.err{color:#a13c2a;}
</style>
</head>
<body>
  <header><div class="wordmark">solar<em>review</em></div></header>
  <div class="wrap"><div id="app"><div class="state">Loading your proposal&hellip;</div></div></div>

<script>
  var SUPA_URL = 'https://kbtobyoumvbcxfbugsid.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtidG9ieW91bXZiY3hmYnVnc2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NjY5MDcsImV4cCI6MjA5MDE0MjkwN30.nLE0TlMu43E4dNRxxjoc6P1OQMjfwXgonbA2MrCCrhk';
  var WHEELHOUSE_APR = 0.0824, WHEELHOUSE_TERM_YEARS = 15;
  // Official Tesla-channel video ("Building Powerwall 3 | Tesla") — verified via search as
  // real, currently-published Tesla content before embedding. Never guess a video id.
  var POWERWALL3_VIDEO_ID = 'sFagRON6uZ8';
  var qs = new URLSearchParams(location.search);
  var custId = qs.get('id');
  var client = supabase.createClient(SUPA_URL, SUPA_KEY);
  var CUST = null, PROP = null, OPTS = [];
  var selIdx = 0, payMode = null, finSub = null; // payMode: 'cash'|'finance'; finSub: 'sdcp'|'standard'|'consolidate'
  var INSIGHT_LOADED = false, INSIGHT_TEXT = null; // cached once, reused across every renderPanel() re-render

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function money(n){ return '$'+(parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2}); }
  function moneyRound(n){ return '$'+Math.round(parseFloat(n)||0).toLocaleString('en-US'); }
  function wheelhouseMonthly(principal){
    var p = parseFloat(principal)||0;
    if (p<=0) return 0;
    var r = WHEELHOUSE_APR/12, n = WHEELHOUSE_TERM_YEARS*12;
    return Math.round(p*r/(1-Math.pow(1+r,-n)));
  }

  function serviceTypeFor(opt){
    var s = ((opt.id||'')+' '+(opt.title||'')).toLowerCase();
    if (s.indexOf('pw3')!==-1 || s.indexOf('powerwall')!==-1) return 'battery_retrofit';
    if (s.indexOf('inverter')!==-1) return 'inverter_swap';
    if (s.indexOf('panel')!==-1) return 'panel_add';
    return 'new_solar';
  }
  function imageFor(opt){
    var s = ((opt.id||'')+' '+(opt.title||'')).toLowerCase();
    return (s.indexOf('pw3')!==-1 || s.indexOf('powerwall')!==-1) ? '/assets/tesla-powerwall3.webp' : '/assets/tesla-inverter.webp';
  }
  function financeScenarios(opt){
    var hasSdcp = (opt.sdcp_rebate||0) > 0;
    return {
      sdcp: hasSdcp ? {
        label: 'With SDCP',
        principal: Math.max(0, (opt.participate_price||opt.price) - opt.sdcp_rebate),
        note: 'Assumes your ' + moneyRound(opt.sdcp_rebate) + ' SDCP battery incentive is approved and applied directly to this loan. <strong>You must qualify</strong> — not guaranteed until confirmed after evaluation.'
      } : null,
      standard: {
        label: 'Standard',
        principal: opt.participate_price || opt.price,
        note: 'Financed on your Participate price (30% off), no incentives assumed.'
      },
      consolidate: {
        label: 'Debt Consolidation',
        principal: opt.price,
        note: 'Finances the full price without the Participate discount. If you carry higher-interest debt elsewhere, rolling it in here at ' + (WHEELHOUSE_APR*100).toFixed(2) + '% APR could still save you money overall.'
      }
    };
  }

  function hasPowerwall(opt){
    var s = ((opt.id||'')+' '+(opt.title||'')).toLowerCase();
    return s.indexOf('pw3')!==-1 || s.indexOf('powerwall')!==-1;
  }
  // Builds the whole "The Situation" body — Quoya's insight (once loaded) plus the
  // Powerwall video when the CURRENTLY SELECTED option includes one. Called fresh from
  // renderPanel() on every option switch so it never gets stuck showing stale content
  // for a different option, or a permanent "Loading…" spinner after the insight has
  // already arrived (renderPanel used to hardcode the loading string every re-render).
  function problemBodyHtml(opt){
    var html;
    if (!INSIGHT_LOADED) {
      html = '<span style="color:var(--muted);font-style:italic;">Loading Quoya&rsquo;s read on this deal&hellip;</span>';
    } else if (!INSIGHT_TEXT) {
      html = '<span style="color:var(--muted);">Ask your rep what this evaluation found — the automated summary isn&rsquo;t available right now.</span>';
    } else {
      var lead = INSIGHT_TEXT.match(/^Problem:\s*(.+?)(?:\.\s|\.$)/i);
      if (lead) {
        var rest = INSIGHT_TEXT.slice(lead[0].length).trim();
        html = '<h3>&ldquo;'+esc(lead[1].trim())+'.&rdquo;</h3>'+(rest?'<div>'+esc(rest)+'</div>':'');
      } else {
        html = '<div>'+esc(INSIGHT_TEXT)+'</div>';
      }
    }
    if (hasPowerwall(opt)) {
      html += '<div class="pw-video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/'+POWERWALL3_VIDEO_ID+'" title="Tesla Powerwall 3" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'+
        '<div class="pw-video-caption">Official Tesla Powerwall 3 video</div>';
    }
    return html;
  }

  function sizeLabelFor(opt){
    var pd = opt.prod_data || {};
    if (pd.sysKw > 0) return pd.sysKw + ' kW system';
    if (pd.storageKwh > 0) return pd.storageKwh + ' kWh storage';
    return null;
  }
  function paybackFor(opt){
    var mod = opt.savings && opt.savings.moderate;
    return (opt.price > 0 && mod && mod.annual > 0) ? (Math.round(opt.price/mod.annual*10)/10 + '-yr payback') : null;
  }

  // Aurora-style "Compare pre and post-solar" itemized card, built only from figures
  // already computed elsewhere (CUST.monthly_bill, opt.savings.moderate) — never a fabricated number.
  function compareCardHtml(opt, hasParticipate, financeMode, financeMonthly, sdcpApplied){
    var billToday = parseFloat(CUST.monthly_bill) || 0;
    var mod = opt.savings && opt.savings.moderate;
    var monthlySavings = (mod && mod.monthly > 0) ? mod.monthly : 0;
    var rows = '', totalLbl, totalAmt, totalSuffix = '', deltaHtml = '', footHtml = '';

    if (financeMode) {
      var estGridBill = billToday > 0 ? Math.max(0, Math.round(billToday - monthlySavings)) : null;
      if (billToday > 0) {
        rows += '<div class="compare-row"><div class="lbl">Your bill today<span class="sub">before any upgrade</span></div><div class="amt">'+moneyRound(billToday)+'/mo</div></div>';
      }
      rows += '<div class="compare-row"><div class="lbl">Solar payment'+(sdcpApplied?'<span class="applied-badge">&#10003; SDCP</span>':'')+'</div><div class="amt">'+moneyRound(financeMonthly)+'/mo</div></div>';
      if (estGridBill !== null) {
        rows += '<div class="compare-row"><div class="lbl">Est. remaining grid use<span class="sub">what solar doesn&rsquo;t offset</span></div><div class="amt">'+moneyRound(estGridBill)+'/mo</div></div>';
      }
      totalLbl = 'Your new average monthly cost';
      var newTotal = financeMonthly + (estGridBill||0);
      totalAmt = moneyRound(newTotal);
      totalSuffix = '<small>/mo</small>';
      if (billToday > 0 && newTotal < billToday) {
        deltaHtml = '<div class="delta">&darr; '+moneyRound(billToday-newTotal)+'/mo vs. your bill today</div>';
      }
    } else {
      if (billToday > 0) {
        rows += '<div class="compare-row"><div class="lbl">Your bill today</div><div class="amt">'+moneyRound(billToday)+'/mo</div></div>';
        var afterBill = Math.max(0, Math.round(billToday - monthlySavings));
        rows += '<div class="compare-row"><div class="lbl">Your bill after solar<span class="sub">estimated</span></div><div class="amt amt neg">'+moneyRound(afterBill)+'/mo</div></div>';
      }
      totalLbl = 'Price due today';
      totalAmt = money(opt.price);
    }

    var footParts = [];
    var sz = sizeLabelFor(opt); if (sz) footParts.push(sz);
    var pb = financeMode ? null : paybackFor(opt); if (pb) footParts.push(pb);
    if (mod && mod.annual > 0) footParts.push('~'+moneyRound(mod.annual*25)+' est. over 25 yrs');
    if (footParts.length) {
      footHtml = '<div class="compare-foot"><span>'+footParts.map(esc).join(' &middot; ')+'</span></div>';
    }

    return '<div class="compare-card">'+rows+
      '<div class="compare-total"><div class="lbl">'+totalLbl+'</div><div class="big">'+totalAmt+totalSuffix+'</div>'+deltaHtml+'</div>'+
      footHtml+
    '</div>';
  }

  function callouts(opt){
    var s = ((opt.id||'')+' '+(opt.title||'')).toLowerCase();
    var out = [];
    if (s.indexOf('pw3')!==-1||s.indexOf('powerwall')!==-1) out.push('13.5 kWh Storage','10-Year Warranty','Backup Power');
    if (s.indexOf('panel')!==-1) out.push('420W Panels','25-Year Warranty');
    if (s.indexOf('inverter')!==-1) out.push('New Inverter','10-Year Warranty');
    if (!out.length) out.push('1-Year Workmanship');
    return out.slice(0,4);
  }

  function setPayMode(mode){
    payMode = mode;
    if (mode === 'finance' && !finSub) {
      var scen = financeScenarios(OPTS[selIdx]);
      finSub = scen.sdcp ? 'sdcp' : 'standard';
    }
    renderPanel();
    renderBottomBar();
  }
  function setFinSub(mode){ finSub = mode; renderPanel(); renderBottomBar(); }
  function selectOption(i){
    selIdx = i;
    var opt = OPTS[i];
    var hasParticipate = !!(opt.participate && opt.participate_price);
    payMode = hasParticipate ? 'finance' : 'cash';
    if (payMode === 'finance') {
      var scen = financeScenarios(opt);
      finSub = scen.sdcp ? 'sdcp' : 'standard';
    } else { finSub = null; }
    renderStage();
    renderPanel();
    renderBottomBar();
  }
  window.setPayMode = setPayMode;
  window.setFinSub = setFinSub;
  window.selectOption = selectOption;

  function renderStage(){
    var opt = OPTS[selIdx];
    var stage = document.getElementById('stage');
    if (!stage) return;
    var co = callouts(opt);
    var positions = [
      {top:'12%',left:'2%'}, {top:'12%',right:'2%'},
      {bottom:'14%',left:'2%'}, {bottom:'14%',right:'2%'}
    ];
    stage.innerHTML =
      '<img src="'+imageFor(opt)+'" alt="'+esc(opt.title)+'" onerror="this.style.display=\'none\'"/>'+
      co.map(function(c,i){
        var p = positions[i] || positions[0];
        var style = Object.keys(p).map(function(k){ return k+':'+p[k]; }).join(';');
        return '<div class="callout" style="'+style+'"><span class="dot">+</span>'+esc(c)+'</div>';
      }).join('');
  }

  function renderPanel(){
    var opt = OPTS[selIdx];
    var hasParticipate = !!(opt.participate && opt.participate_price);

    var financeBlock = '';
    if (payMode === 'finance' && hasParticipate) {
      var scen = financeScenarios(opt);
      var keys = ['sdcp','standard','consolidate'].filter(function(k){ return scen[k]; });
      var s = scen[finSub] || scen.standard;
      var monthly = wheelhouseMonthly(s.principal);
      financeBlock =
        '<div class="fin-sub">'+keys.map(function(k){
          return '<button class="fin-sub-btn'+(k===finSub?' active':'')+'" onclick="setFinSub(\''+k+'\')">'+scen[k].label+'</button>';
        }).join('')+'</div>'+
        compareCardHtml(opt, hasParticipate, true, monthly, finSub==='sdcp')+
        '<div class="fin-note">'+s.note+'</div>'+
        '<div class="fine-print">Financed through Wheelhouse Credit Union &middot; '+(WHEELHOUSE_APR*100).toFixed(2)+'% APR &middot; '+WHEELHOUSE_TERM_YEARS+'-year term. Payment example is an estimate based on the figures above and is not an approval or offer of credit — final terms are set directly by Wheelhouse CU after application. Rebates and incentives referenced here are not guaranteed and are subject to program qualification.</div>';
    } else {
      financeBlock = compareCardHtml(opt, hasParticipate, false)+
        '<div class="fine-print">This estimate is preliminary and for illustration only — final pricing is confirmed after a full site evaluation. Not a bid for work or a binding agreement.</div>';
    }

    var optListHtml = OPTS.map(function(o,i){
      var disp = (o.participate && o.participate_price) ? o.participate_price : o.price;
      return '<div class="opt-row'+(i===selIdx?' active':'')+'" onclick="selectOption('+i+')">'+
        '<div><div class="ot">'+esc(o.title)+'</div><div class="os">Option '+(i+1)+'</div></div>'+
        '<div class="op">'+money(disp)+'</div>'+
      '</div>';
    }).join('');

    var rebateHtml = (opt.sdcp_rebate && !(payMode==='finance' && finSub==='sdcp')) ? '<div class="rebate-note">Up to '+moneyRound(opt.sdcp_rebate)+' potential SDCP savings after qualification</div>' : '';

    var includedHtml = (opt.line_items||[]).map(function(li){
      return '<tr><td class="li-name">'+esc(li.name)+'</td><td class="li-price">'+(li.price>0?money(li.price):'')+'</td></tr>';
    }).join('');
    var warranty = [];
    var sId = ((opt.id||'')+' '+(opt.title||'')).toLowerCase();
    if (sId.indexOf('panel')!==-1) warranty.push('Panels 25yr');
    if (sId.indexOf('pw3')!==-1) warranty.push('Powerwall 10yr');
    if (sId.indexOf('inverter')!==-1) warranty.push('Inverter 10yr');
    warranty.push('Installation 1yr workmanship');

    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<div class="kicker">Solar Review Proposal</div>'+
      '<h1>A plan for '+esc(CUST.first_name||'your')+(CUST.first_name?'’s':'')+' home</h1>'+
      (CUST.address ? '<div class="addr">'+esc(CUST.address)+'</div>' : '')+
      '<div class="tabs">'+
        (hasParticipate ? '<button class="tab'+(payMode==='finance'?' active':'')+'" onclick="setPayMode(\'finance\')">Finance</button>' : '')+
        '<button class="tab'+(payMode==='cash'?' active':'')+'" onclick="setPayMode(\'cash\')">Cash</button>'+
      '</div>'+
      financeBlock+
      '<div class="opt-list">'+optListHtml+'</div>'+
      rebateHtml+
      '<details class="spec" id="problemDetails" open><summary>The Situation</summary><div class="body" id="problemBody">'+problemBodyHtml(opt)+'</div></details>'+
      '<details class="spec"><summary>Your System Summary</summary><div class="body"><table class="li-table">'+(includedHtml||'<tr><td class="li-name">&mdash;</td></tr>')+'</table></div></details>'+
      '<details class="spec"><summary>Warranties</summary><div class="body">'+warranty.join(' &middot; ')+'</div></details>';
  }

  function renderBottomBar(){
    var opt = OPTS[selIdx];
    var bar = document.getElementById('bottombar');
    var hasParticipate = !!(opt.participate && opt.participate_price);
    var priceHtml;
    if (payMode === 'finance' && hasParticipate) {
      var scen = financeScenarios(opt);
      var s = scen[finSub] || scen.standard;
      priceHtml = '~$'+wheelhouseMonthly(s.principal).toLocaleString('en-US')+'<small>/mo</small>';
    } else {
      priceHtml = money(opt.price);
    }
    bar.innerHTML =
      '<div class="bottombar-in">'+
        '<div class="bb-left"><div class="ot">'+esc(opt.title)+'</div><div class="os">Option '+(selIdx+1)+' &middot; '+(payMode==='finance'?'Financed':'Cash')+'</div></div>'+
        '<div class="bb-price">'+priceHtml+'</div>'+
        '<button id="sendBtn" class="cta-btn" onclick="send()">Send to Customer &mdash; Start Paperwork</button>'+
      '</div>'+
      '<div id="sendStatus" class="status-msg"></div>';
  }

  async function ensureInsight(){
    if (PROP.insight) return PROP.insight;
    try {
      var topOpt = OPTS[0] || {};
      var r = await fetch('/.netlify/functions/generate-proposal-insight', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          service_type: serviceTypeFor(topOpt),
          first_name: CUST.first_name || '',
          monthly_bill: CUST.monthly_bill || 0,
          nem_status: CUST.nem_status || '',
          system_size: CUST.system_size || '',
          calculated_monthly_savings: (topOpt.savings && topOpt.savings.moderate && topOpt.savings.moderate.monthly) || null,
          calculated_annual_savings: (topOpt.savings && topOpt.savings.moderate && topOpt.savings.moderate.annual) || null,
          has_battery: /pw3/i.test(topOpt.id||'')
        })
      });
      var data = await r.json();
      return data.insight || null;
    } catch(e) { return null; }
  }
  // Caches the fetched insight once and re-renders the whole panel so "The Situation"
  // (and the Powerwall video that rides inside it) reflects whichever option is
  // currently selected, not just whichever was selected at boot time.
  function applyInsight(text){
    INSIGHT_LOADED = true;
    INSIGHT_TEXT = text || null;
    renderPanel();
  }

  async function send(){
    var btn = document.getElementById('sendBtn');
    var status = document.getElementById('sendStatus');
    btn.disabled = true; btn.textContent = 'Sending…';
    status.className = 'status-msg'; status.textContent = '';
    try {
      var newProp = Object.assign({}, PROP, { status: 'sent' });
      var { error } = await client.from('customers').update({ proposal: newProp }).eq('id', custId);
      if (error) throw error;
      var magicLink = CUST.email ? ('https://fixmy.energy/portal?email='+encodeURIComponent(CUST.email)+'&code='+encodeURIComponent(CUST.access_code||(CUST.phone||'').replace(/\D/g,''))) : null;
      var topOpt = OPTS[0] || {};
      fetch('/.netlify/functions/ghl-webhook-relay', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ dest: 'proposal', payload: {
          type: 'proposal_sent',
          email: CUST.email || '', phone: CUST.phone || '',
          first_name: CUST.first_name || '', last_name: CUST.last_name || '',
          full_name: (CUST.first_name||'')+' '+(CUST.last_name||''),
          customer_id: custId, rep_name: 'Rep',
          magic_link: magicLink, option_count: OPTS.length,
          top_option_title: topOpt.title || '', top_option_price: topOpt.participate_price || topOpt.price || 0
        }})
      }).catch(function(){});
      status.className = 'status-msg ok';
      status.textContent = '✓ Sent — ' + (CUST.first_name||'your customer') + ' can now open their portal to review and start paperwork.';
      btn.textContent = 'Sent ✓';
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Send to Customer — Start Paperwork';
      status.className = 'status-msg err';
      status.textContent = 'Could not send: ' + e.message;
    }
  }
  window.send = send;

  async function boot(){
    var app = document.getElementById('app');
    if (!custId) { app.innerHTML = '<div class="state">No customer specified. Open this page from a lead’s Proposal Tools.</div>'; return; }
    var { data, error } = await client.from('customers').select('*').eq('id', custId).limit(1);
    if (error || !data || !data[0]) { app.innerHTML = '<div class="state">Could not load this customer.</div>'; return; }
    CUST = data[0];
    PROP = CUST.proposal ? (typeof CUST.proposal === 'string' ? JSON.parse(CUST.proposal) : CUST.proposal) : null;
    if (!PROP || !PROP.options || !PROP.options.length) {
      app.innerHTML = '<div class="state">No proposal has been built for this lead yet.</div>'; return;
    }
    OPTS = PROP.options.slice().sort(function(a,b){ return (b.price||0)-(a.price||0); });

    app.innerHTML =
      '<div class="configurator-grid">'+
        '<div class="stage" id="stage"></div>'+
        '<div class="panel" id="panel"></div>'+
      '</div>';
    document.body.insertAdjacentHTML('beforeend', '<div class="bottombar" id="bottombar"></div>');

    selectOption(0);
    var insight = await ensureInsight();
    applyInsight(insight);
  }
  boot();
</script>
</body>
</html>
