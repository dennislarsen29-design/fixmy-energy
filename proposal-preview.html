<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Solar Proposal | Solar Review</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --cream:#F3EDE3; --cream2:#EDE5D8; --lime:#8DC63F; --dark:#1A1A1A;
  --muted:#7A746C; --line:#DDD6C8; --white:#FDFAF6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream); color:var(--dark); font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.6;
}
.wrap{max-width:640px;margin:0 auto;padding:0 24px 80px;}
.top{padding:36px 0 0;}
.wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;letter-spacing:0.01em;color:var(--dark);}
.wordmark em{color:var(--lime);font-style:normal;}
.hero{padding:44px 0 36px;border-bottom:1px solid var(--line);}
.hero .kicker{font-size:0.68rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.hero h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.2;margin:0 0 10px;}
.hero .addr{font-size:0.92rem;color:var(--muted);}
.section{padding:40px 0;border-bottom:1px solid var(--line);}
.section:last-child{border-bottom:none;}
.section-label{font-size:0.68rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--lime);margin-bottom:14px;}
.problem h2{font-family:'Playfair Display',serif;font-weight:500;font-style:italic;font-size:1.3rem;line-height:1.55;color:var(--dark);margin:0;}
.problem .sub{font-size:0.92rem;color:#4a463f;line-height:1.75;margin-top:16px;}
.problem .skel{color:var(--muted);font-style:italic;font-size:0.9rem;}
.opt-label{font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--lime);margin-bottom:10px;}
.opt-title{font-family:'Playfair Display',serif;font-weight:700;font-size:1.4rem;margin:0 0 6px;}
.opt-desc{font-size:0.88rem;color:var(--muted);line-height:1.7;margin-bottom:20px;}
.included{margin-bottom:22px;}
.included-item{display:flex;align-items:center;gap:10px;font-size:0.9rem;padding:4px 0;color:#333;}
.included-item .ck{color:var(--lime);}
.warranty{font-size:0.76rem;color:var(--muted);margin-bottom:24px;}
.fin-toggles{display:flex;gap:8px;margin-bottom:18px;}
.fin-tog{flex:1;padding:11px 6px;background:transparent;border:1.5px solid var(--line);border-radius:100px;color:var(--muted);cursor:pointer;font-size:0.72rem;font-weight:600;font-family:'Inter',sans-serif;transition:all 0.15s;}
.fin-tog.active{background:var(--dark);border-color:var(--dark);color:var(--cream);font-weight:700;}
.fin-display{text-align:center;padding:8px 0 4px;}
.fin-label{font-size:0.66rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.fin-amt{font-family:'Playfair Display',serif;font-weight:700;font-size:3.2rem;line-height:1;color:var(--dark);}
.fin-amt small{font-family:'Inter',sans-serif;font-weight:500;font-size:1.1rem;color:var(--muted);}
.fin-terms{font-size:0.76rem;color:var(--muted);margin-top:10px;}
.fin-note{font-size:0.84rem;color:#4a463f;line-height:1.7;margin-top:20px;padding-top:20px;border-top:1px solid var(--line);text-align:left;}
.fin-note strong{color:var(--dark);}
.cash-line{text-align:center;font-size:0.82rem;color:var(--muted);margin-top:20px;}
.cash-line .amt{color:var(--dark);font-weight:600;}
.cash-line .strike{text-decoration:line-through;opacity:0.6;margin-right:6px;}
.rebate-box{margin-top:24px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.rebate-box .rlabel{font-size:0.62rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--lime);margin-bottom:10px;}
.rebate-row{display:flex;justify-content:space-between;font-size:0.82rem;padding:2px 0;}
.rebate-row .neg{color:var(--lime);font-weight:600;}
.cta-btn{width:100%;padding:18px;background:var(--dark);color:var(--cream);border:none;border-radius:100px;font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;letter-spacing:0.01em;transition:opacity 0.15s;}
.cta-btn:hover{opacity:0.88;}
.cta-btn:disabled{opacity:0.5;cursor:default;}
.cta-sub{text-align:center;font-size:0.78rem;color:var(--muted);margin-top:14px;line-height:1.6;}
.status-msg{text-align:center;font-size:0.84rem;margin-top:16px;min-height:20px;}
.status-msg.ok{color:#3f6b16;}
.status-msg.err{color:#a13c2a;}
.state{padding:120px 0;text-align:center;color:var(--muted);font-size:0.9rem;}
.opt-card{margin-bottom:6px;}
.opt-card + .opt-card{padding-top:40px;border-top:1px solid var(--line);margin-top:34px;}
@media(max-width:520px){
  .fin-amt{font-size:2.5rem;}
  .fin-toggles{flex-wrap:wrap;}
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top"><div class="wordmark">solar<em>review</em></div></div>
    <div id="app"><div class="state">Loading your proposal&hellip;</div></div>
  </div>

<script>
  var SUPA_URL = 'https://kbtobyoumvbcxfbugsid.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtidG9ieW91bXZiY3hmYnVnc2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NjY5MDcsImV4cCI6MjA5MDE0MjkwN30.nLE0TlMu43E4dNRxxjoc6P1OQMjfwXgonbA2MrCCrhk';
  var WHEELHOUSE_APR = 0.0824, WHEELHOUSE_TERM_YEARS = 15;
  var qs = new URLSearchParams(location.search);
  var custId = qs.get('id');
  var client = supabase.createClient(SUPA_URL, SUPA_KEY);
  var CUST = null, PROP = null;
  var FIN_SCEN = {}; // per-option-index financing scenarios, filled at render time

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function money(n){ return '$'+(parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2}); }
  function wheelhouseMonthly(principal){
    var p = parseFloat(principal)||0;
    if (p<=0) return 0;
    var r = WHEELHOUSE_APR/12, n = WHEELHOUSE_TERM_YEARS*12;
    return Math.round(p*r/(1-Math.pow(1+r,-n)));
  }

  function serviceTypeFor(opt){
    var s = ((opt.id||'')+' '+(opt.title||'')).toLowerCase();
    if (s.indexOf('pw3')!==-1 || s.indexOf('powerwall')!==-1) return 'battery_retrofit';
    if (s.indexOf('inverter')!==-1) return 'inverter_swap';
    if (s.indexOf('panel')!==-1) return 'panel_add';
    return 'new_solar';
  }

  function financeScenarios(opt){
    var hasSdcp = (opt.sdcp_rebate||0) > 0;
    var scen = {
      sdcp: hasSdcp ? {
        label: 'With SDCP Rebate',
        principal: Math.max(0, (opt.participate_price||opt.price) - opt.sdcp_rebate),
        note: 'Assumes your ' + money(opt.sdcp_rebate) + ' SDCP battery incentive is approved and applied directly to reduce this loan balance. <strong>You must qualify for SDCP</strong> — this is not guaranteed until confirmed after your evaluation.'
      } : null,
      standard: {
        label: 'Standard Financing',
        principal: opt.participate_price || opt.price,
        note: 'Financed on your Participate price (30% off), no incentives assumed.'
      },
      consolidate: {
        label: 'Debt Consolidation',
        principal: opt.price,
        note: 'Finances the full system price without the Participate discount. If you’re carrying higher-interest debt elsewhere, rolling it into this loan at ' + (WHEELHOUSE_APR*100).toFixed(2) + '% APR could still save you money overall — ask about this if it fits your situation.'
      }
    };
    return scen;
  }

  window.finToggle = function(i, mode){
    var scen = FIN_SCEN[i] && FIN_SCEN[i][mode];
    if (!scen) return;
    var monthly = wheelhouseMonthly(scen.principal);
    var disp = document.getElementById('finDisplay_'+i);
    if (disp) {
      disp.innerHTML =
        '<div class="fin-label">Est. Payment</div>'+
        '<div class="fin-amt">~$'+monthly.toLocaleString('en-US')+'<small>/mo</small></div>'+
        '<div class="fin-terms">Wheelhouse CU &middot; '+(WHEELHOUSE_APR*100).toFixed(2)+'% APR &middot; '+WHEELHOUSE_TERM_YEARS+'-yr term</div>'+
        '<div class="fin-note">'+scen.note+'</div>';
    }
    ['sdcp','standard','consolidate'].forEach(function(k){
      var btn = document.getElementById('finBtn_'+i+'_'+k);
      if (btn) btn.className = 'fin-tog' + (k===mode ? ' active' : '');
    });
  };

  function optionHtml(opt, i){
    var hp = !!(opt.participate && opt.participate_price);
    var disp = hp ? opt.participate_price : opt.price;
    var included = (opt.line_items||[]).map(function(li){
      return '<div class="included-item"><span class="ck">&#10003;</span><span>'+esc(li.name)+'</span></div>';
    }).join('');

    var finHtml = '';
    if (hp) {
      var scen = financeScenarios(opt);
      FIN_SCEN[i] = scen;
      var hasSdcp = !!scen.sdcp;
      var defMode = hasSdcp ? 'sdcp' : 'standard';
      var defScen = scen[defMode];
      var defMonthly = wheelhouseMonthly(defScen.principal);
      var keys = ['sdcp','standard','consolidate'].filter(function(k){ return scen[k]; });
      finHtml =
        '<div class="fin-toggles">'+
          keys.map(function(k){
            return '<button class="fin-tog'+(k===defMode?' active':'')+'" id="finBtn_'+i+'_'+k+'" onclick="finToggle('+i+',\''+k+'\')">'+scen[k].label+'</button>';
          }).join('')+
        '</div>'+
        '<div class="fin-display" id="finDisplay_'+i+'">'+
          '<div class="fin-label">Est. Payment</div>'+
          '<div class="fin-amt">~$'+defMonthly.toLocaleString('en-US')+'<small>/mo</small></div>'+
          '<div class="fin-terms">Wheelhouse CU &middot; '+(WHEELHOUSE_APR*100).toFixed(2)+'% APR &middot; '+WHEELHOUSE_TERM_YEARS+'-yr term</div>'+
          '<div class="fin-note">'+defScen.note+'</div>'+
        '</div>'+
        '<div class="cash-line">'+(hp?'<span class="strike">'+money(opt.price)+'</span>':'')+'<span class="amt">'+money(disp)+'</span> cash / Participate price</div>';
    } else {
      finHtml = '<div class="fin-display"><div class="fin-amt" style="font-size:2.2rem;">'+money(disp)+'</div></div>';
    }

    var rebateHtml = '';
    if (opt.sdcp_rebate) {
      var rp = Math.round(((opt.participate_price||opt.price) - opt.sdcp_rebate)*100)/100;
      rebateHtml = '<div class="rebate-box"><div class="rlabel">Available Rebates &amp; Incentives</div>'+
        '<div class="rebate-row"><span>SDCP Rebate (pending qualification)</span><span class="neg">&minus;'+money(opt.sdcp_rebate)+'</span></div>'+
        '<div class="rebate-row"><span>After SDCP</span><span>'+money(rp)+'</span></div></div>';
    }

    var warranty = [];
    var s = ((opt.id||'')+' '+(opt.title||'')).toLowerCase();
    if (s.indexOf('panel')!==-1) warranty.push('Panels 25yr');
    if (s.indexOf('pw3')!==-1) warranty.push('Powerwall 10yr');
    if (s.indexOf('inverter')!==-1) warranty.push('Inverter 10yr');
    warranty.push('Installation 1yr workmanship');

    return '<div class="opt-card">'+
      '<div class="opt-label">Option '+(i+1)+'</div>'+
      '<h2 class="opt-title">'+esc(opt.title)+'</h2>'+
      (opt.description ? '<div class="opt-desc">'+esc(opt.description)+'</div>' : '')+
      (included ? '<div class="included">'+included+'</div>' : '')+
      '<div class="warranty">&#9989; '+warranty.join(' &middot; ')+'</div>'+
      finHtml+
      rebateHtml+
    '</div>';
  }

  async function ensureInsight() {
    if (PROP.insight) return PROP.insight;
    var box = document.getElementById('problemBox');
    if (box) box.innerHTML = '<div class="skel">Quoya is reading this deal&hellip;</div>';
    try {
      var topOpt = (PROP.options||[])[0] || {};
      var svcType = serviceTypeFor(topOpt);
      var r = await fetch('/.netlify/functions/generate-proposal-insight', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          service_type: svcType,
          first_name: CUST.first_name || '',
          monthly_bill: CUST.monthly_bill || 0,
          nem_status: CUST.nem_status || '',
          system_size: CUST.system_size || '',
          calculated_monthly_savings: (topOpt.savings && topOpt.savings.moderate && topOpt.savings.moderate.monthly) || null,
          calculated_annual_savings: (topOpt.savings && topOpt.savings.moderate && topOpt.savings.moderate.annual) || null,
          has_battery: !!(topOpt.id||'').match(/pw3/i)
        })
      });
      var data = await r.json();
      return data.insight || null;
    } catch(e) { return null; }
  }

  function renderProblem(text) {
    var box = document.getElementById('problemBox');
    if (!box) return;
    if (!text) { box.innerHTML = '<div class="skel">Talk to your rep about what this evaluation found — the automated summary isn’t available right now.</div>'; return; }
    var lead = text.match(/^Problem:\s*(.+?)(?:\.\s|\.$)/i);
    if (lead) {
      var rest = text.slice(lead[0].length).trim();
      box.innerHTML = '<h2>“'+esc(lead[1].trim())+'.”</h2>'+(rest?'<div class="sub">'+esc(rest)+'</div>':'');
    } else {
      box.innerHTML = '<div class="sub">'+esc(text)+'</div>';
    }
  }

  async function send() {
    var btn = document.getElementById('sendBtn');
    var status = document.getElementById('sendStatus');
    btn.disabled = true; btn.textContent = 'Sending…';
    status.className = 'status-msg'; status.textContent = '';
    try {
      var newProp = Object.assign({}, PROP, { status: 'sent' });
      var { error } = await client.from('customers').update({ proposal: newProp }).eq('id', custId);
      if (error) throw error;
      var magicLink = CUST.email ? ('https://fixmy.energy/portal?email='+encodeURIComponent(CUST.email)+'&code='+encodeURIComponent(CUST.access_code||(CUST.phone||'').replace(/\D/g,''))) : null;
      var topOpt = (PROP.options||[])[0] || {};
      fetch('/.netlify/functions/ghl-webhook-relay', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ dest: 'proposal', payload: {
          type: 'proposal_sent',
          email: CUST.email || '', phone: CUST.phone || '',
          first_name: CUST.first_name || '', last_name: CUST.last_name || '',
          full_name: (CUST.first_name||'')+' '+(CUST.last_name||''),
          customer_id: custId, rep_name: 'Rep',
          magic_link: magicLink, option_count: (PROP.options||[]).length,
          top_option_title: topOpt.title || '', top_option_price: topOpt.participate_price || topOpt.price || 0
        }})
      }).catch(function(){});
      status.className = 'status-msg ok';
      status.textContent = '✓ Sent — ' + (CUST.first_name||'your customer') + ' can now open their portal to review this and start paperwork.';
      btn.textContent = 'Sent ✓';
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Send to Customer — Start Paperwork';
      status.className = 'status-msg err';
      status.textContent = 'Could not send: ' + e.message;
    }
  }
  window.send = send;

  async function boot() {
    var app = document.getElementById('app');
    if (!custId) { app.innerHTML = '<div class="state">No customer specified. Open this page from a lead’s Proposal Tools.</div>'; return; }
    var { data, error } = await client.from('customers').select('*').eq('id', custId).limit(1);
    if (error || !data || !data[0]) { app.innerHTML = '<div class="state">Could not load this customer.</div>'; return; }
    CUST = data[0];
    PROP = CUST.proposal ? (typeof CUST.proposal === 'string' ? JSON.parse(CUST.proposal) : CUST.proposal) : null;
    if (!PROP || !PROP.options || !PROP.options.length) {
      app.innerHTML = '<div class="state">No proposal has been built for this lead yet.</div>'; return;
    }
    var sorted = PROP.options.slice().sort(function(a,b){ return (b.price||0)-(a.price||0); });

    app.innerHTML =
      '<div class="hero">'+
        '<div class="kicker">Solar Review Proposal</div>'+
        '<h1>A plan for '+esc(CUST.first_name||'your')+(CUST.first_name?'’s':'')+' home</h1>'+
        (CUST.address ? '<div class="addr">'+esc(CUST.address)+'</div>' : '')+
      '</div>'+
      '<div class="section problem"><div class="section-label">The Situation</div><div id="problemBox"><div class="skel">Loading&hellip;</div></div></div>'+
      '<div class="section">'+sorted.map(optionHtml).join('')+'</div>'+
      '<div class="section">'+
        '<button id="sendBtn" class="cta-btn" onclick="send()">Send to Customer — Start Paperwork</button>'+
        '<div class="cta-sub">Texts and emails '+esc(CUST.first_name||'the customer')+' a link to their own portal, where they review this proposal, choose a payment option, and sign their paperwork — no appointment required.</div>'+
        '<div id="sendStatus" class="status-msg"></div>'+
      '</div>';

    var insight = await ensureInsight();
    renderProblem(insight);
  }
  boot();
</script>
</body>
</html>
