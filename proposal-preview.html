<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Solar Proposal | Solar Review</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --cream:#F3EDE3; --cream2:#EDE5D8; --lime:#8DC63F; --dark:#1A1A1A;
  --muted:#7A746C; --line:#DDD6C8; --white:#FDFAF6;
  --video-opacity:0.18; /* "watermark" strength behind The Situation — tune here */
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  background:var(--white); color:var(--dark); font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.6; padding-bottom:92px;
}
header{padding:0 28px;border-bottom:1px solid var(--line);}
.logo-img{height:88px;width:88px;display:block;}
.wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;letter-spacing:0.01em;}
.wordmark em{color:var(--lime);font-style:normal;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
.state{padding:140px 0;text-align:center;color:var(--muted);font-size:0.9rem;}

/* ── Tesla-style configurator layout: tall hero column left, config panel right ── */
.configurator-grid{display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:start;padding:36px 0 48px;}
@media(max-width:900px){.configurator-grid{grid-template-columns:1fr;gap:28px;}}

.hero-col{display:flex;flex-direction:column;gap:28px;}

.stage{background:var(--cream);border-radius:20px;padding:44px 32px 36px;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.img-wrap{position:relative;width:100%;display:flex;align-items:center;justify-content:center;}
.stage img{max-width:66%;max-height:320px;object-fit:contain;}
.callout{position:absolute;font-size:0.76rem;color:var(--dark);display:flex;align-items:center;gap:6px;}
.callout .dot{width:16px;height:16px;border:1.5px solid var(--dark);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.6rem;flex-shrink:0;}
.callout .line{position:absolute;background:var(--muted);width:1px;}

.component-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;}
.component-chip{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:100px;padding:5px 14px 5px 5px;font-size:0.72rem;font-weight:600;color:var(--dark);}
.component-chip .thumb{width:30px;height:30px;border-radius:50%;background:var(--cream2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.component-chip .thumb img{width:100%;height:100%;object-fit:contain;}

/* ── "The Situation" hero block — Quoya's narrative with a translucent watermark video ── */
.situation-block{position:relative;overflow:hidden;border-radius:20px;background:var(--white);border:1px solid var(--line);padding:40px 36px;}
.situation-video-bg{position:absolute;inset:0;overflow:hidden;z-index:0;}
.situation-video-bg iframe{position:absolute;top:50%;left:50%;width:150%;height:150%;transform:translate(-50%,-50%);border:0;opacity:var(--video-opacity);pointer-events:none;}
.situation-content{position:relative;z-index:1;}
.situation-content h2{font-family:'Playfair Display',serif;font-weight:700;font-size:1.3rem;margin:0 0 16px;}
.situation-content h3{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:1.15rem;margin:0 0 10px;color:var(--dark);}
.situation-content .body-text{font-size:0.92rem;line-height:1.85;color:#3a362f;}
.situation-video-caption{position:relative;z-index:1;font-size:0.64rem;color:var(--muted);margin-top:18px;text-align:right;}
.rep-note{position:relative;z-index:1;background:#FBF2DC;border:1px solid #E8D9A8;border-radius:10px;padding:10px 14px;font-size:0.74rem;color:#6b5a1f;margin-bottom:18px;}
.rep-note strong{color:#4a3d10;}

.panel .kicker{font-size:0.66rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
.panel h1{font-family:'Playfair Display',serif;font-weight:700;font-size:1.8rem;margin:4px 0 4px;line-height:1.15;}
.panel .addr{font-size:0.84rem;color:var(--muted);margin-bottom:20px;}

.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tab{flex:1;text-align:center;padding:12px 4px;background:none;border:none;border-bottom:2px solid transparent;font-family:'Inter',sans-serif;font-size:0.86rem;font-weight:500;color:var(--muted);cursor:pointer;}
.tab.active{border-bottom-color:var(--dark);color:var(--dark);font-weight:700;}

.fin-sub{display:flex;gap:6px;margin-bottom:14px;}
.fin-sub-btn{flex:1;padding:8px 4px;background:var(--cream2);border:1px solid transparent;border-radius:8px;color:var(--muted);cursor:pointer;font-size:0.64rem;font-weight:600;font-family:'Inter',sans-serif;position:relative;}
.fin-sub-btn.active{background:var(--dark);color:var(--cream);font-weight:700;}

/* ── Aurora-style itemized comparison card ── */
.compare-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--white);}
.compare-row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid rgba(221,214,200,0.7);}
.compare-row .lbl{font-size:0.78rem;color:#4a463f;}
.compare-row .lbl .sub{display:block;font-size:0.66rem;color:var(--muted);margin-top:1px;}
.compare-row .amt{font-size:0.86rem;font-weight:600;font-family:'Inter',sans-serif;white-space:nowrap;}
.compare-row .amt.neg{color:#3f6b16;}
.compare-total{padding:14px 16px;background:var(--cream);}
.compare-total .lbl{font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
.compare-total .big{font-family:'Inter',sans-serif;font-weight:300;font-size:2.2rem;line-height:1.05;letter-spacing:-0.01em;margin-top:2px;}
.compare-total .big small{font-weight:400;font-size:0.95rem;color:var(--muted);}
.compare-total .delta{font-size:0.76rem;color:#3f6b16;font-weight:600;margin-top:4px;}
.compare-total .starting{font-size:0.76rem;color:var(--muted);margin-top:5px;}
.compare-total .starting strong{color:var(--dark);font-weight:700;}
.compare-foot{display:flex;justify-content:space-between;padding:9px 16px;background:#EFE9DC;font-size:0.68rem;color:var(--muted);}
.compare-foot strong{color:var(--dark);}

.applied-badge{display:inline-flex;align-items:center;gap:4px;font-size:0.62rem;font-weight:700;letter-spacing:0.03em;color:#fff;background:#3f6b16;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle;}

/* ── Ongoing Performance Value — SDCP/Tesla VPP incentive checkboxes ── */
.ov-section{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:var(--white);}
.ov-title{font-size:0.68rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.ov-check{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:0.82rem;cursor:pointer;border-top:1px solid rgba(221,214,200,0.5);}
.ov-check:first-of-type{border-top:none;}
.ov-check input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:var(--dark);cursor:pointer;}
.ov-check span{flex:1;color:var(--dark);}
.ov-check span small{display:block;color:var(--muted);font-size:0.68rem;font-weight:400;margin-top:1px;}
.ov-amt{font-weight:700;font-size:0.82rem;white-space:nowrap;color:#3f6b16;}
.ov-amt.muted{color:var(--muted);font-weight:500;font-style:italic;font-size:0.7rem;}
.ov-section>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.ov-section>summary::-webkit-details-marker{display:none;}
.ov-section>summary .ov-title{margin:0;}
.ov-section>summary .ov-chev{color:var(--muted);font-size:0.8rem;margin-left:6px;transition:transform .15s;display:inline-block;}
.ov-section[open]>summary .ov-chev{transform:rotate(90deg);}
.ov-section[open]>summary{margin-bottom:10px;}
.ov-note{font-size:0.66rem;color:var(--muted);line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}

.fin-note{font-size:0.76rem;color:#4a463f;line-height:1.65;margin:2px 0 16px;}
.fin-note strong{color:var(--dark);}
.fine-print{font-size:0.66rem;color:var(--muted);line-height:1.6;margin:0 0 18px;padding-top:10px;border-top:1px solid var(--line);}

.opt-list{margin-bottom:18px;}
.opt-row{display:flex;justify-content:space-between;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color 0.15s;}
.opt-row:hover{border-color:#bcb6a8;}
.opt-row.active{border-color:var(--dark);border-width:2px;padding:15px;}
.opt-row .ot{font-size:0.88rem;font-weight:600;}
.opt-row .os{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.opt-row .op{font-size:0.86rem;font-weight:700;white-space:nowrap;margin-left:12px;}

.link-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);font-size:0.86rem;cursor:pointer;}
.link-row .chev{color:var(--muted);}
.rebate-note{font-size:0.8rem;color:var(--lime);margin:4px 0 18px;}
.rebate-note a{color:var(--lime);}

details.spec{border-top:1px solid var(--line);padding:14px 0;}
details.spec summary{cursor:pointer;font-size:0.86rem;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;}
details.spec summary::-webkit-details-marker{display:none;}
details.spec summary:after{content:'+';font-size:1.1rem;font-weight:400;color:var(--muted);}
details.spec[open] summary:after{content:'\2212';}
details.spec .body{font-size:0.82rem;color:#4a463f;line-height:1.75;padding-top:12px;}
.li-table{width:100%;border-collapse:collapse;}
.li-table tr{border-bottom:1px solid var(--line);}
.li-table tr:last-child{border-bottom:none;}
.li-table td{padding:8px 0;font-size:0.82rem;vertical-align:top;}
.li-table td.li-name{color:var(--dark);font-weight:500;}

.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,0.04);}
.bottombar-in{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.bb-left .ot{font-weight:700;font-size:0.92rem;}
.bb-left .os{font-size:0.74rem;color:var(--muted);}
.bb-price{font-size:1.15rem;font-weight:800;white-space:nowrap;}
.bb-price small{font-size:0.7rem;color:var(--muted);font-weight:500;}
.cta-btn{padding:15px 28px;background:var(--dark);color:var(--cream);border:none;border-radius:100px;font-family:'Inter',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer;white-space:nowrap;}
.cta-btn:disabled{opacity:0.5;cursor:default;}
.status-msg{width:100%;text-align:center;font-size:0.8rem;padding-bottom:8px;}
.status-msg.ok{color:#3f6b16;}
.status-msg.err{color:#a13c2a;}

/* Diagnostic Report — leads the page once the tech's write-up exists */
.report{max-width:1180px;margin:0 auto 28px;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:28px 32px;}
.report .r-kicker{font-size:0.66rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#3f6b16;margin-bottom:6px;}
.report h2{font-family:'Playfair Display',serif;font-weight:500;font-size:1.7rem;margin:0 0 4px;}
.report .r-meta{font-size:0.78rem;color:var(--muted);margin-bottom:18px;}
.report .r-body{font-size:0.92rem;line-height:1.85;color:#2c2925;white-space:pre-wrap;}
.report .r-jump{margin-top:18px;display:inline-block;padding:12px 24px;background:var(--dark);color:var(--cream);border-radius:100px;font-weight:700;font-size:0.84rem;text-decoration:none;}
.top-link{float:right;font-size:0.78rem;color:var(--muted);text-decoration:none;margin-top:4px;}
.accepted-banner{max-width:1180px;margin:0 auto 20px;background:rgba(141,198,63,0.14);border:1px solid rgba(141,198,63,0.5);border-radius:12px;padding:16px 22px;font-size:0.9rem;}
@media(max-width:700px){.report{padding:20px 18px;margin:0 0 20px;border-radius:0;}}

/* ── Option toggle — compact, colour-coded by option ── */
.opt-toggle{display:flex;gap:10px;padding:16px 0 4px;position:sticky;top:0;z-index:40;background:var(--white);}
.opt-tab{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--white);text-align:left;font-family:'Inter',sans-serif;color:var(--dark);}
.opt-tab .ot-n{font-size:0.82rem;font-weight:700;}
.opt-tab .ot-t{font-size:0.72rem;margin-top:2px;line-height:1.35;opacity:0.75;}
.opt-tab.active{color:#fff;border-color:transparent;}
.opt-tab.active .ot-t{opacity:0.9;}
body.opt-0{--accent:#1A1A1A;--accent-soft:#EDE5D8;--accent-ink:#F3EDE3;}
body.opt-1{--accent:#8DC63F;--accent-soft:#EEF4E0;--accent-ink:#1A1A1A;}
.opt-tab.t0.active{background:#1A1A1A;color:#F3EDE3;}
.opt-tab.t1.active{background:#8DC63F;color:#1A1A1A;}
body.opt-0 .stage,body.opt-1 .stage{background:var(--accent-soft);}
body.opt-0 .cta-btn,body.opt-1 .cta-btn{background:var(--accent);color:var(--accent-ink);}
body.opt-0 .opt-row.active,body.opt-1 .opt-row.active{border-color:var(--accent);}

.r-photos{margin-top:22px;}
.r-photos h3{font-family:'Playfair Display',serif;font-size:1.05rem;margin:0 0 10px;}
.r-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.r-photo{display:block;border-radius:10px;overflow:hidden;background:var(--cream2);text-decoration:none;color:var(--dark);}
.r-photo img{width:100%;height:100px;object-fit:cover;display:block;}
.r-photo span{display:block;font-size:0.66rem;font-weight:600;padding:5px 8px;color:var(--muted);}
.credit-card{border:1.5px solid var(--lime);background:#F4F9EA;border-radius:14px;padding:16px 18px;margin-bottom:16px;}
.credit-card .cc-title{font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:#4a6b1a;margin-bottom:8px;}
.credit-card .cc-row{display:flex;justify-content:space-between;font-size:0.88rem;padding:4px 0;}
.credit-card .cc-row.credit{color:#3d6b12;font-weight:700;}
.credit-card .cc-row.total{border-top:1px solid #cfe0a8;margin-top:6px;padding-top:8px;font-weight:800;font-size:0.98rem;}
.credit-card .cc-note{font-size:0.72rem;color:var(--muted);margin-top:6px;}

.improve-card{border:1.5px solid var(--line);background:var(--white);border-radius:14px;padding:16px 18px;margin-bottom:16px;}
.improve-card .im-title{font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:10px;}
.im-row{padding:10px 0;border-top:1px solid var(--line);}
.im-row:first-of-type{border-top:none;padding-top:0;}
.im-row .im-h{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:0.9rem;}
.im-row .im-h .im-amt{color:#3d6b12;white-space:nowrap;}
.im-row .im-d{font-size:0.78rem;color:var(--muted);margin-top:3px;line-height:1.55;}
.im-total{display:flex;justify-content:space-between;border-top:2px solid var(--dark);margin-top:8px;padding-top:10px;font-weight:800;}
.im-assume{font-size:0.7rem;color:var(--muted);margin-top:8px;}
.im-assume input[type=number]{width:70px;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:3px 6px;}

.cmp-btn{display:block;margin:10px 0 0;background:none;border:none;color:var(--dark);font-family:'Inter',sans-serif;font-weight:700;font-size:0.8rem;text-decoration:underline;cursor:pointer;padding:0;}
.cmp-overlay{position:fixed;inset:0;background:rgba(26,26,26,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.cmp-box{background:var(--white);border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px 22px 18px;position:relative;}
.cmp-box h3{font-family:'Playfair Display',serif;margin:0 0 4px;font-size:1.2rem;}
.cmp-box .cmp-sub{font-size:0.76rem;color:var(--muted);margin-bottom:14px;}
.cmp-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);}
.cmp-table{width:100%;border-collapse:collapse;font-size:0.84rem;}
.cmp-table th{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);text-align:right;padding:6px 8px;}
.cmp-table th:first-child,.cmp-table td:first-child{text-align:left;}
.cmp-table td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;}
.cmp-table tr.tot td{font-weight:800;border-top:2px solid var(--dark);}
.cmp-table td.neg{color:#3d6b12;}
.cmp-note{font-size:0.7rem;color:var(--muted);margin-top:12px;line-height:1.5;}
</style>
</head>
<body>
  <header><img src="/assets/logo-solar-review.png" alt="Solar Review" class="logo-img"/></header>
  <div class="wrap"><div id="app"><div class="state">Loading your proposal&hellip;</div></div></div>

<script>
  var SUPA_URL = 'https://kbtobyoumvbcxfbugsid.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtidG9ieW91bXZiY3hmYnVnc2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NjY5MDcsImV4cCI6MjA5MDE0MjkwN30.nLE0TlMu43E4dNRxxjoc6P1OQMjfwXgonbA2MrCCrhk';
  var WHEELHOUSE_APR = 0.0824, WHEELHOUSE_TERM_YEARS = 15;
  // Official Tesla-channel video ("Building Powerwall 3 | Tesla") — verified via search as
  // real, currently-published Tesla content before embedding. Never guess a video id.
  var POWERWALL3_VIDEO_ID = 'sFagRON6uZ8';
  // Real background-removed cutouts (see assets/tesla-*-cutout.webp) — replaced the flat
  // white-background stock photos, which read as "2000s clip art" sitting on the cream stage.
  var CUTOUT = {
    pw3: '/assets/tesla-powerwall3-cutout.webp',
    panel: '/assets/tesla-panel-cutout.webp',
    inverter: '/assets/tesla-inverter-cutout.webp'
  };
  var qs = new URLSearchParams(location.search);
  var custId = qs.get('id');
  var CUSTOMER_MODE = qs.get('view') === 'customer'; // customer-facing: no rep actions, Accept instead of Send
  var REPORT_PATH = '';
  var client = supabase.createClient(SUPA_URL, SUPA_KEY);
  var CUST = null, PROP = null, OPTS = [];
  var selIdx = 0, payMode = null, finSub = null; // payMode: 'cash'|'finance'; finSub: 'sdcp'|'standard'|'consolidate'
  var INSIGHT_LOADED = false, INSIGHT_TEXT = null; // cached once, reused across every render

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function money(n){ return '$'+(parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2}); }
  function moneyRound(n){ return '$'+Math.round(parseFloat(n)||0).toLocaleString('en-US'); }
  function wheelhouseMonthly(principal){
    var p = parseFloat(principal)||0;
    if (p<=0) return 0;
    var r = WHEELHOUSE_APR/12, n = WHEELHOUSE_TERM_YEARS*12;
    return Math.round(p*r/(1-Math.pow(1+r,-n)));
  }

  // ── Real component list, from opt.line_items (the authoritative structured data) ──
  // opt.title truncates to e.g. "Tesla Powerwall 3 ×1 + 1 more" the moment an option has
  // more than one line item — every function that used to string-match opt.id+opt.title
  // was therefore blind to anything past the first component (a real reported bug: 3
  // added solar panels were invisible everywhere except a collapsed accordion). Every
  // detection now reads the real line items, falling back to the title only for old
  // stored proposals that predate line_items.
  function componentNames(opt){
    if (opt.line_items && opt.line_items.length) return opt.line_items.map(function(li){ return li.name||''; });
    return [opt.title||''];
  }
  function componentText(opt){ return componentNames(opt).join(' ').toLowerCase(); }

  function serviceTypeFor(opt){
    var s = componentText(opt);
    if (/powerwall|pw3/.test(s)) return 'battery_retrofit';
    if (/inverter/.test(s)) return 'inverter_swap';
    if (/panel/.test(s)) return 'panel_add';
    return 'new_solar';
  }
  function hasPowerwall(opt){ return /powerwall|pw3/.test(componentText(opt)); }
  function heroImageFor(opt){
    var s = componentText(opt);
    if (/powerwall|pw3/.test(s)) return CUTOUT.pw3;
    if (/inverter/.test(s)) return CUTOUT.inverter;
    if (/panel/.test(s)) return CUTOUT.panel;
    return CUTOUT.pw3;
  }
  // Short, clean heading name (drops a redundant "×1" from a single-unit primary item)
  // plus, when an option bundles more than one real component, a full parts line — this
  // is what actually fixes "3 panels added, not clear": every consumer below shows the
  // complete bundle instead of the DB's own truncated "+N more" summary string.
  function optDisplayName(opt){
    var items = opt.line_items || [];
    if (!items.length) return opt.title || 'This option';
    return (items[0].name||'').replace(/\s*×1\s*$/,'').trim() || opt.title || 'This option';
  }
  function optPartsLine(opt){
    var items = opt.line_items || [];
    if (items.length <= 1) return null;
    return items.map(function(li){ return li.name; }).join(' + ');
  }
  function componentChipsHtml(opt){
    var items = opt.line_items || [];
    if (items.length <= 1) return '';
    return '<div class="component-chips">'+items.map(function(li){
      var n = (li.name||'').toLowerCase();
      var img = /powerwall|pw3/.test(n) ? CUTOUT.pw3 : /inverter/.test(n) ? CUTOUT.inverter : /panel/.test(n) ? CUTOUT.panel : null;
      return '<div class="component-chip">'+(img?'<span class="thumb"><img src="'+img+'" alt=""/></span>':'')+esc(li.name)+'</div>';
    }).join('')+'</div>';
  }

  // Financing must never depend on the rep having remembered to toggle "Participate" on
  // or entered a bill — found live on Patricia's draft: opt.participate was false and
  // opt.participate_price was null (never set in the builder), which made the whole
  // Finance tab disappear even though nothing about the option actually disqualifies it
  // from financing. 30% off is the same Participate rate already quoted everywhere else
  // on this page (fin-note copy, etc.) — applying it here as a real, named fallback is
  // categorically different from guessing an unknown number; it's the documented rate.
  var PARTICIPATE_DISCOUNT = 0.70;
  function participatePriceFor(opt){
    // Plain service/labor options (no redline — e.g. an RMA swap) are never Participate-discounted;
    // they were being shown at 70% of their real price on the Cash tab and in the option list.
    if (!financingAvailable(opt)) return opt.price || 0;
    return opt.participate_price != null ? opt.participate_price : Math.round((opt.price||0) * PARTICIPATE_DISCOUNT);
  }
  function participateIsEstimate(opt){ return opt.participate_price == null; }
  // 2026-09-30, per Dennis reviewing Becky Phan's two-option proposal — the Patricia
  // fix above (price>0 alone) is still correct for a real product sale, but this
  // pipeline can now ALSO carry a plain service-labor option (e.g. an RMA swap alone,
  // no battery/panel/inverter product, no dealer-cost basis) sitting right next to a
  // real one in the SAME proposal. Lease-to-own financing on a bare labor invoice
  // makes no business sense — opt.redline is the same signal sendProposal() itself
  // already uses to decide "is this option a real commissioned sale" (it's the ONLY
  // thing rep_commission/gross_commission are ever computed from), so reusing it here
  // costs nothing new and can't drift from that decision.
  function financingAvailable(opt){ return (opt.price||0) > 0 && opt.redline != null; }

  function financeScenarios(opt){
    var hasSdcp = (opt.sdcp_rebate||0) > 0;
    var partPrice = participatePriceFor(opt);
    return {
      sdcp: hasSdcp ? {
        label: 'SDCP Enhanced',
        principal: Math.max(0, partPrice - opt.sdcp_rebate),
        note: 'Assumes your ' + moneyRound(opt.sdcp_rebate) + ' SDCP battery incentive is approved and applied directly to this loan. <strong>You must qualify</strong> — not guaranteed until confirmed after evaluation.'
      } : null,
      standard: {
        label: 'Standard',
        principal: partPrice,
        note: 'Financed on your Participate price (30% off), no incentives assumed.'
      },
      consolidate: {
        label: 'ReAllocation',
        principal: opt.price,
        note: 'Finances the full price without the Participate discount. If you carry higher-interest debt elsewhere, rolling it in here at ' + (WHEELHOUSE_APR*100).toFixed(2) + '% APR could still save you money overall.'
      }
    };
  }

  // A leading bracketed system note (e.g. "[Quoya could not read the uploaded photos
  // this time...]") is a real, previously-shipped rep-facing warning that was leaking
  // straight into the customer-facing narrative verbatim — found live on Lowell's draft.
  // Pulled out here so it never renders as if it were part of the sales copy, and only
  // re-surfaced, separately labeled, while the proposal is still a draft — a customer is
  // never handed this link before status flips to 'sent', so draft-only is rep-only.
  function stripRepNote(text){
    if (!text) return { note: null, rest: text };
    var m = text.match(/^\s*\[([^\]]+)\]\s*/);
    if (!m) return { note: null, rest: text };
    return { note: m[1].trim(), rest: text.slice(m[0].length).trim() };
  }

  function sizeLabelFor(opt){
    var pd = opt.prod_data || {};
    if (pd.sysKw > 0) return pd.sysKw + ' kW system';
    if (pd.storageKwh > 0) return pd.storageKwh + ' kWh storage';
    return null;
  }
  function paybackFor(opt, priceOverride){
    var mod = opt.savings && opt.savings.moderate;
    var price = priceOverride != null ? priceOverride : opt.price;
    return (price > 0 && mod && mod.annual > 0) ? (Math.round(price/mod.annual*10)/10 + '-yr payback') : null;
  }

  // Real annual battery TOU-arbitrage throughput, already computed server-side (portal.html's
  // _propCalcBaseProduction, capped at 60% of the home's real daily usage) — the ONLY honest
  // basis for a performance-incentive $/yr estimate. Never falls back to an uncapped
  // theoretical max (13.5kWh x 1.5 cycles/day x 365 ≈ 7,391 kWh/yr) when real usage is
  // unknown — that overstates the real, usage-capped figure by as much as 13x on a light-use
  // home (confirmed against Lowell Jennings' real record: capped to 548 of a 7,391 theoretical
  // max). Missing data means an honest "can't estimate yet" message, never an inflated guess.
  // Solar the inverter swap brings back (kWh/yr) — 0 unless the inverter is marked down and the
  // system size is known. The battery does NOT produce anything; it only shifts energy, so its
  // shifted kWh are capped against the grid use LEFT after this (below).
  var SOLAR_KWH_PER_KW_YR = 1600;
  function solarRecoveredKwh(opt){
    var use = PROP && PROP.usage_kwh > 0 ? PROP.usage_kwh : 0;
    var kw = PROP && parseFloat(PROP.system_kw) > 0 ? parseFloat(PROP.system_kw) : 0;
    if (!(PROP && PROP.inverter_down) || !(kw > 0) || !(use > 0) || !/inverter/.test(componentText(opt))) return 0;
    return Math.round(Math.min(kw * SOLAR_KWH_PER_KW_YR, use * 0.9));
  }
  function annualBatteryKwhFor(opt){
    var pd = opt.prod_data;
    var base = null;
    if (pd && pd.batteryArbitrageKwh > 0) base = pd.batteryArbitrageKwh;
    else base = annualBatteryKwhRaw(opt);
    if (base == null) return null;
    // A battery only moves energy, so it can't shift more than 60% of the grid use that is
    // left once the restored solar has covered its share.
    var sol = solarRecoveredKwh(opt);
    var use = PROP && PROP.usage_kwh > 0 ? PROP.usage_kwh : 0;
    if (sol > 0 && use > 0) base = Math.min(base, Math.round(0.6 * Math.max(0, use - sol)));
    return base;
  }
  function annualBatteryKwhRaw(opt){
    var pd = opt.prod_data;
    // No saved production data: fall back to a rep-entered annual usage (PROP.usage_kwh), capped
    // at 60% of usage exactly like the builder's own math — never an uncapped theoretical max.
    var units = powerwallUnitCountFor(opt);
    if (PROP && PROP.usage_kwh > 0 && units != null) {
      return Math.round(Math.min(units * 13.5 * 1.5 * 365, 0.6 * PROP.usage_kwh));
    }
    return null;
  }

  // Powerwall-equivalent unit count, derived from prod_data.storageKwh (already-trusted
  // structured data — see the componentNames() comment above on why line_items/prod_data
  // beat string-parsing a name) rather than regex-parsing "×N" out of a line-item name.
  // 13.5 kWh is one Powerwall 3's usable capacity, the same constant battery-arbitrage math
  // elsewhere in this codebase already uses.
  var POWERWALL_UNIT_KWH = 13.5;
  function powerwallUnitCountFor(opt){
    var pd = opt.prod_data;
    if (pd && pd.storageKwh > 0) return Math.max(1, Math.round(pd.storageKwh / POWERWALL_UNIT_KWH));
    // Older/partial proposals carry no prod_data — count Powerwall line items instead.
    var n = 0;
    (opt.line_items || []).forEach(function(li){
      var nm = String(li.name||'').toLowerCase();
      if (/powerwall|pw3/.test(nm) && !/expansion/.test(nm)) n += Math.max(1, parseInt(li.qty||li.quantity||1,10)||1);
    });
    return n > 0 ? n : (hasPowerwall(opt) ? 1 : null);
  }

  // "Ongoing Performance Value" — layers 3/4 of Dennis's 4-layer model (2026-09-22, revised
  // same day per Dennis's follow-up): each financing tab now offers exactly ONE of the two
  // programs, never a choice between them — SDCP Performance Incentive on the "SDCP
  // Enhanced" tab, Tesla VPP (DSGS) on every other tab ("Standard", "ReAllocation", and
  // cash mode with no SDCP tab active). requiredPerfKindFor() is the one place that
  // decision is made, so the checkbox shown, its auto-checked default, and the monthly-math
  // fold-in below can never disagree about which program applies to the tab you're on.
  //
  // Tesla VPP figure sourced from https://www.tesla.com/support/energy/virtual-power-plant/dsgs
  // (confirmed 2026-09-22, per Dennis) — California's Demand Side Grid Support program (run by
  // the CEC via Olivine Inc.), the statewide fallback VPP a Powerwall enrolls in when SDCP's own
  // program isn't available. DSGS does NOT pay a clean $/kWh-discharged rate — it pays monthly
  // capacity payments ($/kW, varying by month, roughly $7-$15/kW across a 2024 season) settled
  // annually, netting to Tesla's own stated ceiling of "up to $350 a year per Powerwall." That is
  // why this is modeled as a flat per-Powerwall annual figure (never forced into the same $/kWh
  // shape as the SDCP line below it — that would misrepresent how DSGS actually pays out) and
  // labeled "up to", matching Tesla's own framing, not a guaranteed number.
  //
  // NOTE: the same research also surfaced a DIFFERENT, more specific Tesla+SDCP joint VPP page
  // (tesla.com/support/energy/virtual-power-plant/sdcp) quoting $0.10/kWh during events PLUS a
  // separate $4,725/Powerwall upfront enrollment incentive — the $0.10/kWh matches
  // SDCP_PERF_RATE_PER_KWH exactly, but the $4,725 figure does not match the $3,375 sdcp_rebate
  // already used elsewhere in this codebase for the upfront SDCP incentive. Deliberately NOT
  // applied here — Dennis gave SDCP_PERF_RATE_PER_KWH and sdcp_rebate directly, and silently
  // swapping in a web-sourced number for either risks overriding a figure he already confirmed.
  // Flagged for Dennis to confirm whether $4,725 is the same upfront incentive under a different
  // (possibly updated, possibly enrollment-bonus-only) name, or a genuinely separate program.
  var TESLA_VPP_ANNUAL_PER_POWERWALL = 350;

  // The ONE decision point for which of the two programs a given financing tab offers.
  // 'sdcp' only on the SDCP Enhanced tab (finSub==='sdcp'); Tesla VPP everywhere else,
  // including Standard, ReAllocation, and cash mode when no SDCP tab is active (finSub null).
  function requiredPerfKindFor(finSubVal){
    return finSubVal === 'sdcp' ? 'sdcp' : 'tesla';
  }

  // The dollar/yr value of whichever incentive is CURRENTLY CHECKED (perfIncentive) — null
  // when unchecked, or when the underlying data (usage kWh / battery size) isn't known yet.
  // One shared calc so the Ongoing Performance Value display and the monthly-cost fold-in
  // below can never compute two different numbers for the same checked box.
  function perfIncentiveAnnualFor(opt){
    if (perfIncentive === 'sdcp') {
      var kwh = annualBatteryKwhFor(opt);
      return kwh != null ? kwh * SDCP_PERF_RATE_PER_KWH : null;
    }
    if (perfIncentive === 'tesla') {
      var units = powerwallUnitCountFor(opt);
      return units != null ? units * TESLA_VPP_ANNUAL_PER_POWERWALL : null;
    }
    return null;
  }
  function perfIncentiveLabel(){
    return perfIncentive === 'sdcp' ? 'SDCP Performance Incentive'
      : perfIncentive === 'tesla' ? 'Tesla VPP Performance Incentive'
      : '';
  }

  window._ovOpen = window._ovOpen || {tou:false, vpp:false};
  function ongoingValueHtml(opt){
    if (!hasPowerwall(opt) && !((opt.sdcp_rebate||0) > 0)) return ''; // no battery and not SDCP-eligible -> nothing to offer
    var kind = requiredPerfKindFor(finSub);
    var checked = perfIncentive === kind;
    var row;
    if (kind === 'sdcp') {
      var kwh = annualBatteryKwhFor(opt);
      var sdcpAmt = kwh != null
        ? '<span class="ov-amt">~'+moneyRound(kwh * SDCP_PERF_RATE_PER_KWH)+'/yr</span>'
        : '<span class="ov-amt muted">Needs usage data to estimate</span>';
      row = '<label class="ov-check"><input type="checkbox" '+(checked?'checked':'')+' onchange="togglePerfIncentive(\'sdcp\', this.checked)"/>'+
        '<span>SDCP Performance Incentive<small>$'+SDCP_PERF_RATE_PER_KWH.toFixed(2)+'/kWh on battery TOU arbitrage</small></span>'+sdcpAmt+
      '</label>';
    } else {
      var units = powerwallUnitCountFor(opt);
      var teslaAmt = units != null
        ? '<span class="ov-amt">up to ~'+moneyRound(units * TESLA_VPP_ANNUAL_PER_POWERWALL)+'/yr</span>'
        : '<span class="ov-amt muted">Needs battery size to estimate</span>';
      row = '<label class="ov-check"><input type="checkbox" '+(checked?'checked':'')+' onchange="togglePerfIncentive(\'tesla\', this.checked)"/>'+
        '<span>Tesla VPP Performance Incentive (DSGS)<small>CEC statewide program &mdash; alternative if SDCP isn&rsquo;t available</small></span>'+teslaAmt+
      '</label>';
    }
    // Only actually reflected in the monthly total in Finance mode (compareCardHtml's
    // finance branch) — a one-time cash price has no recurring figure for it to reduce.
    var noteTail = (payMode === 'finance')
      ? ' When checked, it&rsquo;s already reflected as a credit in your monthly cost above.'
      : '';
    var vppSum = (kind === 'sdcp') ? sdcpAmt : teslaAmt;
    return '<details class="ov-section"'+(window._ovOpen.vpp?' open':'')+' ontoggle="window._ovOpen.vpp=this.open">'+
      '<summary><span class="ov-title">Ongoing Performance Value</span><span>'+vppSum+'<span class="ov-chev">&rsaquo;</span></span></summary>'+
      row+
      '<div class="ov-note">Paid periodically for battery grid participation &mdash; not a purchase-price discount, and not guaranteed until program enrollment is confirmed.'+noteTail+'</div>'+
    '</details>';
  }

  // Aurora-style "Compare pre and post-solar" itemized card, built only from figures
  // already computed elsewhere (CUST.monthly_bill, opt.savings.moderate) — never a fabricated number.
  // sdcpApplied now also applies in CASH mode (financeMode=false): the SDCP rebate is a
  // purchase-price incentive, not exclusively a financing feature, so a cash buyer can
  // get the same dollar credit taken directly off the cash price.
  //
  // perfCreditMonthly/perfLabel (per Dennis, 2026-09-22) — the checked Ongoing Performance
  // Value program's dollar/mo value, folded into "Your new average monthly cost" as its own
  // explicit credit line (never baked silently into "Battery Optimized Payment", which is
  // the real Wheelhouse loan payment and has nothing to do with either incentive program).
  // Finance mode only — a one-time cash price has no recurring figure for a periodic
  // incentive to reduce, so cash mode ignores both params (still passed for one consistent
  // call shape).
  function compareCardHtml(opt, hasParticipate, financeMode, financeMonthly, sdcpApplied, perfCreditMonthly, perfLabel, touDeltaMonthly){
    perfCreditMonthly = perfCreditMonthly || 0;
    touDeltaMonthly = touDeltaMonthly || 0;
    var billToday = PROP && PROP.hide_bill ? 0 : (parseFloat(CUST.monthly_bill) || 0);
    var mod = opt.savings && opt.savings.moderate;
    var monthlySavings = (mod && mod.monthly > 0) ? mod.monthly : 0;
    // No saved savings scenario (older proposal): use the improvements model (restored solar +
    // battery load shifting) so the bill comparison reflects what the upgrade actually changes.
    if (!(monthlySavings > 0)) monthlySavings = improvementsFor(opt).totalMonthly;
    var rows = '', totalLbl, totalAmt, totalSuffix = '', deltaHtml = '', footHtml = '';
    var cashPriceForFoot = opt.price;

    if (financeMode) {
      var estGridBill = billToday > 0 ? Math.max(monthlySavings > 0 ? MIN_MONTHLY_CHARGE : 0, Math.round(billToday - monthlySavings)) : null;
      if (billToday > 0) {
        rows += '<div class="compare-row"><div class="lbl">Your bill today<span class="sub">before any upgrade</span></div><div class="amt">'+moneyRound(billToday)+'/mo</div></div>';
      }
      rows += '<div class="compare-row"><div class="lbl">Battery Optimized Payment'+(sdcpApplied?'<span class="applied-badge">&#10003; SDCP</span>':'')+'</div><div class="amt">'+moneyRound(financeMonthly)+'/mo</div></div>';
      if (estGridBill !== null) {
        rows += '<div class="compare-row"><div class="lbl">Est. remaining grid use<span class="sub">what solar doesn&rsquo;t offset</span></div><div class="amt">'+moneyRound(estGridBill)+'/mo</div></div>';
      }
      if (perfCreditMonthly > 0) {
        rows += '<div class="compare-row"><div class="lbl">'+esc(perfLabel||'Performance Incentive')+'<span class="sub">applied as a monthly credit</span></div><div class="amt neg">&minus;'+moneyRound(perfCreditMonthly)+'/mo</div></div>';
      }
      // touDeltaMonthly is the difference the rep's LIVE TOU-rate adjustment makes vs. the
      // $0.31/kWh default already baked into financeMonthly's underlying savings figure —
      // zero (no row shown) until the rep actually touches the rate in the Time-of-Use
      // Savings card below. A positive delta means the adjusted rate implies MORE savings
      // than assumed, so it reduces the total; a negative delta means less, so it raises it.
      if (touDeltaMonthly) {
        rows += '<div class="compare-row"><div class="lbl">Time-of-Use rate adjustment<span class="sub">vs. the standard $0.31/kWh assumption</span></div><div class="amt'+(touDeltaMonthly>0?' neg':'')+'">'+(touDeltaMonthly>=0?'&minus;':'+')+moneyRound(Math.abs(touDeltaMonthly))+'/mo</div></div>';
      }
      totalLbl = (PROP && PROP.hide_bill) ? 'Your monthly payment' : 'Your new average monthly cost';
      var newTotal = Math.max(0, financeMonthly + (estGridBill||0) - perfCreditMonthly - touDeltaMonthly);
      totalAmt = moneyRound(newTotal);
      totalSuffix = '<small>/mo</small>';
      if (billToday > 0 && newTotal < billToday) {
        deltaHtml = '<div class="delta">&darr; '+moneyRound(billToday-newTotal)+'/mo vs. your bill today</div>';
      }
    } else {
      // 2026-09-28, per Dennis — on the Cash tab, broadcast Participate's discounted price
      // as the headline number (the same 30%-off figure Finance already leads with), never
      // the raw un-discounted price. The raw cash price is never hidden — it still renders
      // right under the headline, in smaller print, as "Starting cash price". SDCP nets off
      // whichever price is being shown, using the exact same math financeScenarios().sdcp
      // already applies on the Finance tab, so a customer switching tabs never sees the SDCP
      // incentive computed two different ways for "the same" price.
      var cashSdcp = sdcpApplied && (opt.sdcp_rebate||0) > 0;
      var partPriceCash = participatePriceFor(opt);
      var broadcastPrice = cashSdcp ? Math.max(0, partPriceCash - opt.sdcp_rebate) : partPriceCash;
      var rawCashPrice = cashSdcp ? Math.max(0, opt.price - opt.sdcp_rebate) : opt.price;
      cashPriceForFoot = broadcastPrice;
      if (billToday > 0) {
        rows += '<div class="compare-row"><div class="lbl">Your bill today</div><div class="amt">'+moneyRound(billToday)+'/mo</div></div>';
        var afterBill = Math.max(monthlySavings > 0 ? MIN_MONTHLY_CHARGE : 0, Math.round(billToday - monthlySavings));
        rows += '<div class="compare-row"><div class="lbl">Your bill after solar<span class="sub">estimated</span></div><div class="amt amt neg">'+moneyRound(afterBill)+'/mo</div></div>';
      }
      if (cashSdcp) {
        rows += '<div class="compare-row"><div class="lbl">SDCP incentive<span class="sub">applied to price below</span></div><div class="amt neg">&minus;'+moneyRound(opt.sdcp_rebate)+'</div></div>';
      }
      // ⚠️ 2026-09-30, found reviewing Becky Phan's 2-option proposal — this branch took
      // a hasParticipate PARAMETER but never actually checked it: it unconditionally
      // broadcast the 30%-off Participate price as "Price With Participate" even for an
      // option where Participate doesn't apply at all (e.g. a plain RMA-swap service
      // invoice, no dealer-cost basis to finance). That would have shown a fake
      // "discounted" price with a misleading strikethrough on a real labor bill. Now
      // shows the real price, plainly labeled, with no discount framing when
      // hasParticipate is false — same cashSdcp math either way, since SDCP is a real
      // incentive independent of Participate.
      if (hasParticipate) {
        totalLbl = 'Price With Participate'+(cashSdcp?'<span class="applied-badge">&#10003; SDCP</span>':'');
        totalAmt = money(broadcastPrice);
        deltaHtml = '<div class="starting">Starting cash price: <strong>'+money(rawCashPrice)+'</strong> without Participate</div>';
      } else {
        totalLbl = 'Price'+(cashSdcp?'<span class="applied-badge">&#10003; SDCP</span>':'');
        totalAmt = money(rawCashPrice);
        cashPriceForFoot = rawCashPrice;
      }
    }

    var footParts = [];
    var sz = sizeLabelFor(opt); if (sz) footParts.push(sz);
    var pb = financeMode ? null : paybackFor(opt, cashPriceForFoot); if (pb) footParts.push(pb);
    if (mod && mod.annual > 0) footParts.push('~'+moneyRound(mod.annual*25)+' est. over 25 yrs');
    if (footParts.length) {
      footHtml = '<div class="compare-foot"><span>'+footParts.map(esc).join(' &middot; ')+'</span></div>';
    }

    return '<div class="compare-card">'+rows+
      '<div class="compare-total"><div class="lbl">'+totalLbl+'</div><div class="big">'+totalAmt+totalSuffix+'</div>'+deltaHtml+'</div>'+
      footHtml+
    '</div>';
  }

  function callouts(opt){
    var s = componentText(opt);
    var out = [];
    if (/powerwall|pw3/.test(s)) out.push('13.5 kWh Storage','10-Year Warranty','Backup Power');
    if (/panel/.test(s)) out.push('420W Panels','25-Year Warranty');
    if (/inverter/.test(s)) out.push('New Inverter','10-Year Warranty');
    if (!out.length) out.push('10-Year Workmanship');
    return out.slice(0,4);
  }

  // SDCP is an "assumed first" default whenever it's available, in EITHER pay mode — the
  // rebate is a purchase-price incentive, not something exclusive to financing. 'consolidate'
  // is finance-only and is never a default; a tab switch always resets to this mode's own
  // sensible default rather than trying to carry a stale finSub across modes (e.g. a
  // finance-only 'consolidate' leaking into cash, which has no such concept).
  function defaultFinSubFor(mode, opt){
    var hasSdcp = (opt.sdcp_rebate||0) > 0;
    if (mode === 'finance') return hasSdcp ? 'sdcp' : 'standard';
    return hasSdcp ? 'sdcp' : null;
  }

  // Ongoing Performance Value (per Dennis, 2026-09-22, revised same day) — SDCP Performance
  // Incentive ($0.10/kWh, paid on real battery TOU-arbitrage throughput) vs. Tesla VPP
  // Performance Incentive (DSGS, up to $350/Powerwall/yr — see TESLA_VPP_ANNUAL_PER_POWERWALL
  // above). Mutually exclusive (a system is enrolled in one VPP program, not both at once),
  // and — per Dennis's revision — no longer offered as a choice on the same tab: each
  // financing tab now shows and auto-checks exactly ONE of the two (requiredPerfKindFor
  // above decides which). perfIncentive itself stays a real, single tri-state value ('sdcp'
  // | 'tesla' | null — null only ever means "the rep unchecked the one box this tab offers").
  var perfIncentive = null; // 'sdcp' | 'tesla' | null
  var perfIncentiveTouched = false; // true only within the current tab's own checkbox interaction
  var SDCP_PERF_RATE_PER_KWH = 0.10; // per Dennis, 2026-09-22
  // Always resets to the CURRENT tab's own required kind, auto-checked. Since each tab now
  // offers only one program, there is nothing to "remember" across a tab switch the way the
  // old two-checkbox version needed to — switching tabs is switching which program applies,
  // not re-asking the same question, so a rep's uncheck on one tab never suppresses the
  // auto-check on a DIFFERENT tab.
  function syncPerfIncentiveDefault(){
    perfIncentive = requiredPerfKindFor(finSub);
    perfIncentiveTouched = false;
  }
  function togglePerfIncentive(which, isChecked){
    perfIncentiveTouched = true;
    perfIncentive = isChecked ? which : null;
    renderPanel();
  }

  // Time-of-Use arbitrage savings (2026-09-28, per Dennis — "not seeing any TOU savings

  // override of that rate, right here on the page — no trip back into the builder needed.
  var BATTERY_TOU_RATE_DEFAULT = 0.31;

        amtHtml+

  // ── What the upgrade actually changes: restored solar production + battery upgrade ──
  // 2026-09-30, per Dennis (Becky Phan): a downed inverter means the array produces ~nothing, so
  // replacing it brings production — and a large cut in grid use — back; and replacing a dead 5 kWh
  // battery with a 13.5 kWh Powerwall lets her shift on-peak use to solar/super-off-peak. Both must
  // be calculated, not just narrated. Every input is explicit and editable on the page (system kW,
  // inverter down?, current working battery kWh) and saved on the proposal; nothing is invented —
  // a missing input hides that line rather than guessing.
  function nemVersion(){ var v = parseInt(PROP && PROP.nem_version, 10); return (v === 1 || v === 2 || v === 3) ? v : 2; }
  function postfixBillFor(){ var v = parseFloat(PROP && PROP.postfix_monthly_bill); return v > 0 ? v : 15; }
  function effectiveRate(){
    var bill = parseFloat(CUST.monthly_bill) || 0;
    var use = PROP && PROP.usage_kwh > 0 ? PROP.usage_kwh : 0;
    return (bill > 0 && use > 0) ? (bill * 12) / use : 0;
  }
  function improvementsFor(opt){
    var out = { solarKwh:0, solarMonthly:0, touKwh:0, touMonthly:0, totalMonthly:0, rate:effectiveRate(), kw:0, from:0, to:0, units:0 };
    var use = PROP && PROP.usage_kwh > 0 ? PROP.usage_kwh : 0;
    var kw = PROP && parseFloat(PROP.system_kw) > 0 ? parseFloat(PROP.system_kw) : 0;
    out.kw = kw;
    var sk = solarRecoveredKwh(opt);
    if (sk > 0 && out.rate > 0) { out.solarKwh = sk; out.solarMonthly = Math.round(sk * out.rate / 12); }
    if (hasPowerwall(opt)) {
      var units = powerwallUnitCountFor(opt) || 1;
      out.units = units;
      out.to = units * POWERWALL_UNIT_KWH;
      out.from = PROP && parseFloat(PROP.current_battery_kwh) > 0 ? parseFloat(PROP.current_battery_kwh) : 0;
      var k = annualBatteryKwhFor(opt);
      if (k != null) { out.touKwh = k; out.touMonthly = Math.round(k * BATTERY_TOU_RATE_DEFAULT / 12); }
    }
    out.totalMonthly = out.solarMonthly + out.touMonthly;
    var billMo = parseFloat(CUST.monthly_bill) || 0;
    // Remaining bill once a down inverter is restored is NEM-version dependent (2026-09-30, per Dennis).
    // Under NEM 1.0/2.0 the restored array nets against usage, so the bill falls to roughly the
    // customer's own true-up history ($9-21/mo for Becky; default = midpoint, editable, saved on the
    // proposal). Battery shifting adds no bill value there (it is backup + VPP). NEM 3.0 has no anchor
    // (export credits are low), so it keeps the production x rate model below.
    out.nem = nemVersion();
    if (sk > 0 && billMo > 0 && out.nem !== 3) {
      // The saved post-fix bill ($9-21 from her true-up history) is the bill with the FULL system running,
      // battery shifting included. Without a battery (Option 2) she still buys the evening-peak energy a
      // Powerwall would have shifted, so that option's remaining bill = anchor + the shift value.
      var anchor = Math.max(MIN_MONTHLY_CHARGE, postfixBillFor());
      var useYr = PROP && PROP.usage_kwh > 0 ? PROP.usage_kwh : 0;
      var shiftKwh = out.touKwh;
      if (!(shiftKwh > 0) && useYr > 0) shiftKwh = Math.round(Math.min(1 * 13.5 * 1.5 * 365, 0.6 * Math.max(0, useYr - sk)));
      var shiftMo = Math.round((shiftKwh || 0) * BATTERY_TOU_RATE_DEFAULT / 12);
      var noBattRemaining = Math.min(Math.max(billMo - 1, anchor), anchor + shiftMo);
      out.solarMonthly = Math.max(0, Math.round(billMo - noBattRemaining));
      if (hasPowerwall(opt)) { out.touMonthly = Math.max(0, Math.round(noBattRemaining - anchor)); out.touKwh = shiftKwh; }
      else { out.touMonthly = 0; out.touKwh = 0; }
      out.remaining = hasPowerwall(opt) ? anchor : noBattRemaining;
      out.batteryCapped = false;
      out.totalMonthly = out.solarMonthly + out.touMonthly;
      return out;
    }
    // The upgrade can't remove more than the customer pays today.
    if (billMo > 0 && out.totalMonthly > billMo - MIN_MONTHLY_CHARGE) out.totalMonthly = Math.max(0, Math.round(billMo - MIN_MONTHLY_CHARGE));
    return out;
  }
  function improvementsHtml(opt){
    var im = improvementsFor(opt);
    var rows = '';
    if (im.solarMonthly > 0) {
      rows += '<div class="im-row"><div class="im-h"><span>Solar production restored</span><span class="im-amt">~'+moneyRound(im.solarMonthly)+'/mo</span></div>'+
        '<div class="im-d">Your '+im.kw+' kW system isn&rsquo;t producing while the inverter is down. Replacing it brings back roughly '+im.solarKwh.toLocaleString()+' kWh a year (~'+Math.round(im.solarKwh/12).toLocaleString()+' kWh/mo) that you&rsquo;re now buying from the grid at about '+('$'+im.rate.toFixed(2))+'/kWh.</div></div>';
    }
    if (im.touMonthly > 0) {

    }

      '<label><input type="checkbox" '+(PROP.inverter_down?'checked':'')+' onchange="setImpField(\'inverter_down\',this.checked)"/> inverter currently down</label> &middot; '+
      'current working battery <input type="number" step="0.5" min="0" value="'+(PROP.current_battery_kwh||'')+'" onchange="setImpField(\'current_battery_kwh\',this.value)"/> kWh &middot; '+
      'NEM <select onchange="setImpField(\'nem_version\',this.value)">'+[1,2,3].map(function(n){return '<option value="'+n+'"'+(nemVersion()===n?' selected':'')+'>'+n+'.0</option>';}).join('')+'</select> &middot; '+
      'bill with full system + battery (NEM 1/2) $<input type="number" step="1" min="0" value="'+postfixBillFor()+'" onchange="setImpField(\'postfix_monthly_bill\',this.value)"/>/mo</div>';
    return '<div class="improve-card"><div class="im-title">What this upgrade changes for you</div>'+rows+
      '<div class="im-total"><span>Estimated reduction in your monthly grid cost</span><span>~'+moneyRound(im.totalMonthly)+'/mo</span></div>'+
      '<div class="im-assume">Estimates from your bill and system size &mdash; confirmed in your usage review.</div>'+assume+'</div>';
  }

  // ── Side-by-side: Today vs each option (popup) ──
  function compareColumn(opt){
    var bill = parseFloat(CUST.monthly_bill) || 0;
    var use = PROP.usage_kwh > 0 ? PROP.usage_kwh : 0;
    var im = improvementsFor(opt);
    var solarKwhMo = Math.round(im.solarKwh/12), shiftKwhMo = Math.round(im.touKwh/12);
    var afterSolarBill = Math.max(MIN_MONTHLY_CHARGE, Math.round(bill - im.solarMonthly));
    var afterBill = (im.totalMonthly > 0) ? Math.max(MIN_MONTHLY_CHARGE, Math.round(bill - im.totalMonthly)) : Math.round(bill);
    var pay = financingAvailable(opt) ? wheelhouseMonthly(participatePriceFor(opt)) : 0;
    var units = hasPowerwall(opt) ? (powerwallUnitCountFor(opt)||1) : 0;
    var vpp = units ? Math.round(units * TESLA_VPP_ANNUAL_PER_POWERWALL / 12) : 0;
    return {
      gridKwh: use ? Math.round(use/12 - solarKwhMo) : null,
      afterSolarBill: afterSolarBill, afterBill: afterBill,
      hasSolar: im.solarMonthly > 0, hasBattery: im.touMonthly > 0,
      shiftKwhMo: shiftKwhMo, pay: pay, vpp: vpp,
      total: Math.max(0, afterBill + pay - vpp),
      price: participatePriceFor(opt)
    };
  }
  function compareAvailable(){

      videoHtml +
      repNoteHtml +
      '<div class="situation-content"><h2>The Situation</h2>'+bodyHtml+'</div>'+
      (isPw3 ? '<div class="situation-video-caption">Official Tesla Powerwall 3 video</div>' : '');
  }

  function renderPanel(){
    var opt = OPTS[selIdx];
    var hasParticipate = financingAvailable(opt);
    var partPrice = participatePriceFor(opt);
    var partIsEstimate = participateIsEstimate(opt);
    var hasSdcp = (opt.sdcp_rebate||0) > 0;
    var estimateNote = partIsEstimate ? (CUSTOMER_MODE ? ' <em>(estimated at the standard 30% Participate rate — your final price is confirmed in your agreement)</em>' : ' <em>(estimated at the standard 30% Participate rate — ask your rep to confirm the exact price)</em>') : '';

    // The checked Ongoing Performance Value program's dollar/mo value — computed once here
    // (from the CURRENT perfIncentive state, itself synced to this tab by syncPerfIncentiveDefault
    // whenever finSub/payMode change) and threaded into both the finance and cash compareCardHtml
    // calls below, so it can never be computed two different ways for the same rendered panel.
    var perfAnnual = perfIncentiveAnnualFor(opt);
    var perfMonthly = perfAnnual != null ? perfAnnual / 12 : 0;
    var perfLabel = perfIncentiveLabel();

    // Same "compute once, thread everywhere" rule as perfMonthly above — the delta the
    // rep's live touRate edit makes vs. the $0.31/kWh default already baked into
    // opt.savings, so the finance-mode headline total and the Time-of-Use Savings card
    // below can never disagree about the current rate.
    var touBaseAnnual = touSavingsAnnualFor(opt, BATTERY_TOU_RATE_DEFAULT);
    var touAdjustedAnnual = touSavingsAnnualFor(opt, touRate);
    var touDeltaMonthly = (touBaseAnnual != null && touAdjustedAnnual != null) ? (touAdjustedAnnual - touBaseAnnual) / 12 : 0;

    var financeBlock = '';
    if (payMode === 'finance' && hasParticipate) {
      var scen = financeScenarios(opt);
      var keys = ['sdcp','standard','consolidate'].filter(function(k){ return scen[k]; });
      var s = scen[finSub] || scen.standard;
      var monthly = wheelhouseMonthly(s.principal);
      financeBlock =
        '<div class="fin-sub">'+keys.map(function(k){
          return '<button class="fin-sub-btn'+(k===finSub?' active':'')+'" onclick="setFinSub(\''+k+'\')">'+scen[k].label+'</button>';
        }).join('')+'</div>'+
        compareCardHtml(opt, hasParticipate, true, monthly, finSub==='sdcp', perfMonthly, perfLabel, touDeltaMonthly)+
        '<div class="fin-note">'+s.note+estimateNote+'</div>'+
        '<div class="fine-print">Financed through Wheelhouse Credit Union &middot; '+(WHEELHOUSE_APR*100).toFixed(2)+'% APR &middot; '+WHEELHOUSE_TERM_YEARS+'-year term. Payment example is an estimate based on the figures above and is not an approval or offer of credit — final terms are set directly by Wheelhouse CU after application. Rebates and incentives referenced here are not guaranteed and are subject to program qualification.</div>';
    } else {
      // Cash mode gets its own Standard/With-SDCP toggle (SDCP is a purchase-price rebate,
      // not exclusive to financing) plus a cross-sell note surfacing the Participate price —
      // Dennis's report: paying cash showed a flat $18,759 with no way to see that Participate
      // financing brings the same option to $13,131 (or $9,756 with SDCP) without switching tabs.
      var cashKeys = hasSdcp ? ['standard','sdcp'] : [];
      var cashToggle = cashKeys.length ? ('<div class="fin-sub">'+
        '<button class="fin-sub-btn'+(finSub==='standard'?' active':'')+'" onclick="setFinSub(\'standard\')">Standard</button>'+
        '<button class="fin-sub-btn'+(finSub==='sdcp'?' active':'')+'" onclick="setFinSub(\'sdcp\')">SDCP Enhanced</button>'+
      '</div>') : '';
      // The price shown above already reflects Participate's discounted rate — this note no
      // longer repeats that dollar figure (it used to, before the headline itself broadcast
      // it), it just explains what the number is and offers the monthly-payment alternative.
      var participateInfoHtml = hasParticipate ? (
        '<div class="fin-note">This price reflects Participate&rsquo;s financing rate'+estimateNote+
        '. Want a monthly payment instead of paying it up front? <a href="javascript:void(0)" onclick="setPayMode(\'finance\')">Switch to Finance &rarr;</a></div>'
      ) : '';
      financeBlock = cashToggle +
        compareCardHtml(opt, hasParticipate, false, null, finSub==='sdcp', perfMonthly, perfLabel) +
        participateInfoHtml +
        '<div class="fine-print">This estimate is preliminary and for illustration only — final pricing is confirmed after a full site evaluation. Not a bid for work or a binding agreement.</div>';
    }
    financeBlock += touSavingsHtml(opt) + ongoingValueHtml(opt);
    financeBlock = billToggleHtml() + creditMathHtml(opt) + improvementsHtml(opt) + financeBlock;

    // Option list always reflects the price for the CURRENTLY ACTIVE pay mode — this was
    // the actual bug in the report: it showed the Participate price even while the Cash tab's
    // own compare-card showed the full price for the same option, two different numbers with
    // nothing explaining why they differed.
    var optListHtml = OPTS.map(function(o,i){
      var disp;
      if (payMode === 'finance') {
        disp = participatePriceFor(o);
      } else {
        // Cash mode: track the SDCP toggle per-row too, so a row's price always matches
        // what the main compare-card would show if that row were selected — this is the
        // exact mismatch from the report (list showed the Participate total while the
        // card showed the full cash price for the same option). As of 2026-09-28 the
        // card's own cash-mode headline broadcasts the Participate price too, so this has
        // to follow suit or the same mismatch reappears in the other direction.
        var oPart = participatePriceFor(o);
        disp = (finSub === 'sdcp' && (o.sdcp_rebate||0) > 0) ? Math.max(0, oPart - o.sdcp_rebate) : oPart;
      }
      var parts = optPartsLine(o);
      return '<div class="opt-row'+(i===selIdx?' active':'')+'" onclick="selectOption('+i+')">'+
        '<div><div class="ot">'+esc(optDisplayName(o))+'</div><div class="os">'+(parts?esc(parts):('Option '+(i+1)))+'</div></div>'+
        '<div class="op">'+money(disp)+'</div>'+
      '</div>';
    }).join('');

    var rebateHtml = (opt.sdcp_rebate && finSub !== 'sdcp') ? '<div class="rebate-note">Up to '+moneyRound(opt.sdcp_rebate)+' potential SDCP savings after qualification</div>' : '';

    // ⚠️ 2026-09-24, per Dennis — "The proposal is showing the redline cost of the TPW3.
    // We never want this reflecting on a customer viewable screen." Root cause: portal.html's
    // proposal builder ALWAYS pushes a catalog line item's price as the raw
    // proposal_catalog.default_price — the documented DEALER COST, meant only to feed the
    // System Price/redline math internally, never a real customer-facing figure. For a
    // single-item option (like this Powerwall 3 retrofit) that dealer cost IS the whole
    // option's redline, verbatim. No per-line-item price in this data model is ever
    // guaranteed to be a real retail markup — only the aggregate opt.price /
    // opt.participate_price totals are, and those are already shown prominently elsewhere
    // on this page (the compare-card total, the bottom bar). Fixed by never rendering a
    // per-line dollar figure here — names only, same convention portal.html's own Ops
    // Advice card (_opsProposalSpecs) already follows for this exact reason.
    var includedHtml = (opt.line_items||[]).map(function(li){
      return '<tr><td class="li-name">'+esc(li.name)+'</td></tr>';
    }).join('');
    var names = componentText(opt);
    var warranty = [];
    if (/panel/.test(names)) warranty.push('Panels 25yr');
    if (/powerwall|pw3/.test(names)) warranty.push('Powerwall 10yr');
    if (/inverter/.test(names)) warranty.push('Inverter 10yr');
    warranty.push('Installation 10yr workmanship');

    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<div class="kicker">Solar Review Proposal</div>'+
      '<h1>A plan for '+esc(CUST.first_name||'your')+(CUST.first_name?'’s':'')+' home</h1>'+
      (CUST.address ? '<div class="addr">'+esc(CUST.address)+'</div>' : '')+
      '<div class="tabs">'+
        (hasParticipate ? '<button class="tab'+(payMode==='finance'?' active':'')+'" onclick="setPayMode(\'finance\')">Finance</button>' : '')+
        '<button class="tab'+(payMode==='cash'?' active':'')+'" onclick="setPayMode(\'cash\')">Cash</button>'+
      '</div>'+
      financeBlock+
      (CUSTOMER_MODE ? '' : '<div class="opt-list">'+optListHtml+'</div>')+
      rebateHtml+
      '<details class="spec"><summary>Your System Summary</summary><div class="body"><table class="li-table">'+(includedHtml||'<tr><td class="li-name">&mdash;</td></tr>')+'</table></div></details>'+
      '<details class="spec"><summary>Warranties</summary><div class="body">'+warranty.join(' &middot; ')+'</div></details>';
  }

  function renderBottomBar(){
    var opt = OPTS[selIdx];
    var bar = document.getElementById('bottombar');
    var hasParticipate = financingAvailable(opt);
    var priceHtml;
    if (payMode === 'finance' && hasParticipate) {
      var scen = financeScenarios(opt);
      var s = scen[finSub] || scen.standard;
      priceHtml = '~$'+wheelhouseMonthly(s.principal).toLocaleString('en-US')+'<small>/mo</small>';
    } else {
      // Matches compareCardHtml's cash-mode headline: broadcast the Participate price, with
      // the true starting cash price still visible right alongside it (never hidden).
      var bbCashSdcp = finSub === 'sdcp' && (opt.sdcp_rebate||0) > 0;
      var bbPart = participatePriceFor(opt);
      var bbBroadcast = bbCashSdcp ? Math.max(0, bbPart - opt.sdcp_rebate) : bbPart;
      var bbRaw = bbCashSdcp ? Math.max(0, opt.price - opt.sdcp_rebate) : opt.price;
      priceHtml = money(bbBroadcast) + '<small> &middot; '+money(bbRaw)+' cash</small>';
    }
    var itemCount = (opt.line_items||[]).length;
    var bbSub = (itemCount > 1 ? (itemCount + ' items') : ('Option '+(selIdx+1))) + ' &middot; ' + (payMode==='finance'?'Financed':'Cash');
    bar.innerHTML =
      '<div class="bottombar-in">'+
        '<div class="bb-left"><div class="ot">'+esc(optDisplayName(opt))+'</div><div class="os">'+bbSub+'</div></div>'+
        '<div class="bb-price">'+priceHtml+'</div>'+
        (CUSTOMER_MODE
          ? (PROP.status === 'accepted'
              ? '<button class="cta-btn" disabled>Accepted &#10003;</button>'
              : '<button id="sendBtn" class="cta-btn" onclick="acceptSelected()">Accept this option</button>')
          : '<button id="sendBtn" class="cta-btn" onclick="send()">Send to Customer &mdash; Start Paperwork</button>')+
      '</div>'+
      '<div id="sendStatus" class="status-msg"></div>';
  }

  async function ensureInsight(){
    if (PROP.insight) return PROP.insight;
    if (CUSTOMER_MODE) return null; // never trigger an AI call from a customer's device
    try {
      var topOpt = OPTS[0] || {};
      var r = await fetch('/.netlify/functions/generate-proposal-insight', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          service_type: serviceTypeFor(topOpt),
          first_name: CUST.first_name || '',
          monthly_bill: CUST.monthly_bill || 0,
          nem_status: CUST.nem_status || '',
          system_size: CUST.system_size || '',
          calculated_monthly_savings: (topOpt.savings && topOpt.savings.moderate && topOpt.savings.moderate.monthly) || null,
          calculated_annual_savings: (topOpt.savings && topOpt.savings.moderate && topOpt.savings.moderate.annual) || null,
          has_battery: hasPowerwall(topOpt)
        })
      });
      var data = await r.json();
      return data.insight || null;
    } catch(e) { return null; }
  }
  // Caches the fetched insight once and re-renders just the Situation block, so it (and
  // the Powerwall video that rides inside it) reflects whichever option is currently
  // selected, not just whichever was selected at boot time.
  function applyInsight(text){
    INSIGHT_LOADED = true;
    INSIGHT_TEXT = text || null;
    renderSituation();
  }

  async function send(){
    var btn = document.getElementById('sendBtn');
    var status = document.getElementById('sendStatus');
    btn.disabled = true; btn.textContent = 'Sending…';
    status.className = 'status-msg'; status.textContent = '';
    try {
      var newProp = Object.assign({}, PROP, { status: 'sent' });
      var { error } = await client.from('customers').update({ proposal: newProp }).eq('id', custId);
      if (error) throw error;
      var res = await fetch('/.netlify/functions/notify-customer', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ type: 'proposal_sent', customerId: custId })
      }).then(function(r){ return r.json(); }).catch(function(){ return {ok:false, reason:'network'}; });
      var smsOk = res.sms && res.sms.ok, mailOk = res.email && res.email.ok;
      var who = CUST.first_name || 'your customer';
      if (smsOk || mailOk || res.reason === 'rate_limited') {
        status.className = 'status-msg ok';
        status.textContent = '✓ Saved. ' + who + ' was ' + [smsOk ? 'texted' : '', mailOk ? 'emailed' : ''].filter(Boolean).join(' and ') + '.' + (smsOk && mailOk ? '' : ' (The other channel did not go through.)');
        btn.textContent = 'Sent ✓';
      } else {
        status.className = 'status-msg err';
        status.textContent = 'Saved, but ' + who + ' was NOT notified (' + (res.reason === 'no_contact' ? 'no phone or email on file' : (res.reason || 'unknown')) + '). Copy their portal link and send it yourself.';
        btn.disabled = false; btn.textContent = 'Try sending again';
      }
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Send to Customer — Start Paperwork';
      status.className = 'status-msg err';
      status.textContent = 'Could not send: ' + e.message;
    }
  }
  window.send = send;

  // ── Customer acceptance — same record shape portal.html's acceptProposal writes, so the
  // portal's accepted view, the admin Jobs/lead cards and the GHL event all keep working.
  var FIN_CODE = { standard:'wheelhouse', sdcp:'wheelhouse_sdcp', consolidate:'wheelhouse_reallocation' };
  async function acceptSelected(){
    var opt = OPTS[selIdx];
    var fin = (payMode === 'finance' && financingAvailable(opt)) ? (FIN_CODE[finSub] || 'wheelhouse') : 'cash';
    var term = fin === 'cash' ? null : WHEELHOUSE_TERM_YEARS;
    var sdcpOn = finSub === 'sdcp' && (opt.sdcp_rebate||0) > 0;
    var part = participatePriceFor(opt);
    var shown = fin === 'cash' ? (sdcpOn ? Math.max(0, part - opt.sdcp_rebate) : part)
      : fin === 'wheelhouse_reallocation' ? opt.price
      : (sdcpOn ? Math.max(0, part - opt.sdcp_rebate) : part);
    var monthlyTxt = fin === 'cash' ? '' : ' (about '+moneyRound(wheelhouseMonthly(financeScenarios(opt)[finSub === 'sdcp' && sdcpOn ? 'sdcp' : finSub === 'consolidate' ? 'consolidate' : 'standard'].principal))+'/mo)';
    if (!confirm('Accept "'+optDisplayName(opt)+'"?\n\n'+(fin==='cash'?'Pay in full':'Finance through Wheelhouse CU, '+term+' years')+monthlyTxt+'\n\nOur team will contact you within 24 hours to confirm next steps. No payment is taken on this page.')) return;
    var btn = document.getElementById('sendBtn'), status = document.getElementById('sendStatus');
    btn.disabled = true; btn.textContent = 'Saving…'; status.className = 'status-msg'; status.textContent = '';
    try {
      var fresh = await client.from('customers').select('proposal,notes').eq('id', custId).limit(1);
      var row = fresh.data && fresh.data[0];
      var prop = row && row.proposal ? (typeof row.proposal === 'string' ? JSON.parse(row.proposal) : row.proposal) : null;
      if (!prop || prop.status === 'accepted') throw new Error(prop ? 'This proposal was already accepted.' : 'Proposal not found.');
      prop.status = 'accepted'; prop.accepted_option = opt.id; prop.financing = fin; prop.loan_term = term;
      prop.accepted_via = 'customer_self_service'; prop.accepted_at = new Date().toISOString();
      prop.accepted_pay_mode = payMode; prop.accepted_display_price = shown;
      var up = await client.from('customers').update({ proposal: prop }).eq('id', custId);
      if (up.error) throw up.error;
      // Activity note so the lead editor shows it (best-effort — the acceptance itself is already saved).
      try {
        var arr = []; try { arr = row.notes ? JSON.parse(row.notes) : []; } catch(e) { arr = []; }
        if (!Array.isArray(arr)) arr = [];
        arr.push({ ts: new Date().toISOString(), by: 'Customer (proposal page)', text: 'Accepted "'+optDisplayName(opt)+'" — '+(fin==='cash'?'cash':'Wheelhouse '+term+'-yr financing')+', displayed '+money(shown)+'.' });
        await client.from('customers').update({ notes: JSON.stringify(arr) }).eq('id', custId);
      } catch(e) {}
      fetch('/.netlify/functions/ghl-webhook-relay', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ dest:'proposal', payload:{ type:'proposal_accepted',
          email: CUST.email||'', phone: CUST.phone||'', first_name: CUST.first_name||'', last_name: CUST.last_name||'',
          full_name: ((CUST.first_name||'')+' '+(CUST.last_name||'')).trim(), proposal_option: opt.id, proposal_label: optDisplayName(opt),
          proposal_amount: shown, financing: fin, loan_term: term, accepted_via: 'customer_self_service' } }) }).catch(function(){});
      PROP = prop;
      renderBottomBar();
      var app = document.getElementById('app');
      app.insertAdjacentHTML('afterbegin', '<div class="accepted-banner"><strong>&#9989; Thank you, '+esc(CUST.first_name||'')+'!</strong> You accepted '+esc(optDisplayName(opt))+'. Our team will reach out within 24 hours to confirm next steps.</div>');
      window.scrollTo({top:0,behavior:'smooth'});
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Accept this option';
      status.className = 'status-msg err'; status.textContent = 'Could not save: ' + (e.message || e) + ' — please call (619) 777-6527.';
    }
  }
  window.acceptSelected = acceptSelected;

  var PHOTOS = [];
  function photosHtml(){
    if (!PHOTOS.length) return '';
    return '<div class="r-photos"><h3>Photos from your visit</h3><div class="r-photo-grid">'+
      PHOTOS.map(function(p){
        return '<a class="r-photo" href="'+esc(p.url)+'" target="_blank" rel="noopener"><img src="'+esc(p.url)+'" loading="lazy" alt="'+esc(p.label||'Photo')+'"/>'+
          '<span>'+esc(p.label||'Photo')+'</span></a>';
      }).join('')+'</div></div>';
  }
  async function loadPhotos(){
    try {
      var r = await client.from('job_photos').select('url,label,id').or('job_id.eq.'+custId+',customer_id.eq.'+custId);
      var seen = {};
      (r.data||[]).forEach(function(p){ if (p && p.url && !seen[p.url] && !/\.pdf(\?|$)/i.test(p.url)) { seen[p.url]=1; PHOTOS.push(p); } });
    } catch(e) { /* photos are a bonus — never block the proposal */ }
  }

  function reportHtml(){
    var txt = CUST.diagnostic_findings && String(CUST.diagnostic_findings).trim();
    if (!txt || ((parseInt(CUST.step)||1) < 3 && !CUST.sold_type)) return '';
    return '<div class="report" id="diagReport"><div class="r-kicker">Diagnostic Report</div>'+
      '<h2>What we found at your home</h2>'+
      '<div class="r-meta">'+esc(CUST.address||'')+'</div>'+
      '<div class="r-body">'+esc(txt).replace(/^(What we found|Why it happened|What we recommend|Warranty \/ coverage):[ \t]*$/gmi,'<strong style="display:block;margin-top:10px;">$1</strong>')+'</div>'+
      photosHtml()+
      '<a class="r-jump" href="#configurator">See your options &darr;</a></div>';
  }


  async function boot(){
    var app = document.getElementById('app');
    if (!custId) { app.innerHTML = '<div class="state">No customer specified. Open this page from a lead’s Proposal Tools.</div>'; return; }
    var { data, error } = await client.from('customers').select('*').eq('id', custId).limit(1);
    if (error || !data || !data[0]) { app.innerHTML = '<div class="state">Could not load this customer.</div>'; return; }
    CUST = data[0];
    PROP = CUST.proposal ? (typeof CUST.proposal === 'string' ? JSON.parse(CUST.proposal) : CUST.proposal) : null;
    if (!PROP || !PROP.options || !PROP.options.length) {
      app.innerHTML = '<div class="state">No proposal has been built for this lead yet.</div>'; return;
    }
    if (CUSTOMER_MODE) {
      // Customers only ever see a proposal that was actually sent, and must arrive with their
      // portal access code (their phone digits by default) — the same credential the portal uses.
      var code = (qs.get('code')||'').replace(/\s/g,'');
      var okCode = code && (code === String(CUST.access_code||'') || code === String(CUST.phone||'').replace(/\D/g,''));
      if (!okCode || (PROP.status !== 'sent' && PROP.status !== 'accepted')) {
        app.innerHTML = '<div class="state">This proposal link isn&rsquo;t valid. Please open it from your Solar Review portal, or call (619) 777-6527.</div>'; return;
      }
      var portalHref = CUST.email ? ('/portal?email='+encodeURIComponent(CUST.email)+'&code='+encodeURIComponent(code)) : '/portal';
      document.querySelector('header').insertAdjacentHTML('beforeend', '<a class="top-link" href="'+portalHref+'">&larr; Back to my portal</a>');
    }
    // Keep the options in the order the rep built them (Option 1, Option 2) — customer-facing
    // "Option 1 / Option 2" references in the write-up must line up. Preview keeps price order.
    OPTS = CUSTOMER_MODE ? PROP.options.slice() : PROP.options.slice().sort(function(a,b){ return (b.price||0)-(a.price||0); });

    await loadPhotos();
    app.innerHTML =
      (CUSTOMER_MODE && PROP.status === 'accepted' ? '<div class="accepted-banner"><strong>&#9989; Accepted.</strong> Our team will reach out within 24 hours to confirm next steps.</div>' : '')+
      reportHtml()+
      '<div id="configurator"></div>'+
      '<div class="opt-toggle" id="optToggle"></div>'+
      '<div id="cmpBtnWrap"></div>'+
      '<div class="configurator-grid">'+
        '<div class="hero-col"><div class="stage" id="stage"></div><div class="situation-block" id="situationBlock"></div></div>'+
        '<div class="panel" id="panel"></div>'+
      '</div>';
    document.body.insertAdjacentHTML('beforeend', '<div class="bottombar" id="bottombar"></div>');

    selectOption(0);
    var insight = await ensureInsight();
    applyInsight(insight);
  }
  boot();
</script>
</body>
</html>
