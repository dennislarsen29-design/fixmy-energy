name: Run Pipeline Manually

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual trigger'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify background pipeline
        run: |
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "https://fixmy.energy/.netlify/functions/bb-auto-pipeline-background" \
            -H "Content-Type: application/json" \
            -d '{}' --max-time 30)
          echo "HTTP status: $STATUS"
          cat /tmp/resp.txt || true
          if [ "$STATUS" = "202" ] || [ "$STATUS" = "200" ]; then
            echo "Pipeline triggered — running in background on Netlify (~15 min)"
          else
            echo "Trigger failed with HTTP $STATUS" && exit 1
          fi
