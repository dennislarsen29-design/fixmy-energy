name: Accela Permit Scraper

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Which portals to scrape"
        required: true
        default: all
        type: choice
        options:
          - all
          - sandiego
          - chulavista
          - oceanside
      installer:
        description: "Single installer name to search (leave blank for all 16)"
        required: false
        default: ""
        type: string

jobs:
  scrape:
    name: Scrape ${{ github.event.inputs.cities }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Accela scraper
        run: |
          ARGS="--city ${{ github.event.inputs.cities }}"
          if [ -n "${{ github.event.inputs.installer }}" ]; then
            ARGS="$ARGS --name \"${{ github.event.inputs.installer }}\""
          fi
          echo "Running: node scripts/accela-scraper.js $ARGS"
          eval node scripts/accela-scraper.js $ARGS
        continue-on-error: true

      - name: List output files
        run: |
          echo "=== CSV files produced ==="
          ls -lh scripts/accela-permits-*.csv 2>/dev/null || echo "No CSV files found"

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: accela-permits-${{ github.event.inputs.cities }}-${{ github.run_id }}
          path: scripts/accela-permits-*.csv
          if-no-files-found: warn
          retention-days: 90
