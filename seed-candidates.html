async function runSeed() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true;
  btn.textContent = 'Running...';
  log.innerHTML = '';

  let ok = 0, fail = 0;
  for (const c of CANDIDATES) {
    const res = await fetch(SUPA_URL + '/rest/v1/candidates', {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(c)
    });
    if (res.ok) {
      ok++;
      log.innerHTML += `<div class="ok">✓ ${c.first_name} ${c.last_name}</div>`;
    } else {
      fail++;
      const err = await res.text();
      log.innerHTML += `<div class="err">✗ ${c.first_name} ${c.last_name}: ${err}</div>`;
    }
  }
  log.innerHTML += `<div class="done">${ok} inserted, ${fail} failed. You can now delete seed-candidates.html from the repo.</div>`;
  btn.textContent = 'Done';
}
