const log = document.getElementById('log');
function print(msg, cls) {
  const line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = msg + '\n';
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

(async () => {
  const db = supabase.createClient(SUPA_URL, SUPA_KEY);

  print('Fetching existing candidates to check for duplicates…');
  const { data: existing, error: fetchErr } = await db.from('candidates').select('first_name, last_name');
  if (fetchErr) { print('ERROR fetching existing: ' + fetchErr.message, 'err'); return; }

  const existingKeys = new Set((existing || []).map(r => `${r.first_name}|${r.last_name}`.toLowerCase()));
  print(`Found ${existingKeys.size} existing candidates in table.\n`);

  let inserted = 0, skipped = 0;

  for (const c of candidates) {
    const key = `${c.first_name}|${c.last_name}`.toLowerCase();
    if (existingKeys.has(key)) {
      print(`  SKIP  ${c.first_name} ${c.last_name} (already exists)`);
      skipped++;
      continue;
    }
    const { error } = await db.from('candidates').insert(c);
    if (error) {
      print(`  ERROR ${c.first_name} ${c.last_name}: ${error.message}`, 'err');
    } else {
      print(`  ✓ INS  ${c.first_name} ${c.last_name}`);
      inserted++;
    }
  }

  log.className = 'log done';
  print(`\nDone. Inserted ${inserted} / skipped ${skipped} of ${candidates.length} candidates.`);
  print('You can close this tab and check the Hiring tab in the portal.');
})();
