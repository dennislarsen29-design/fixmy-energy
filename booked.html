<style>
:root{--cream:#F3EDE3;--cream2:#EDE5D8;--lime:#8DC63F;--dark:#1A1A1A;--muted:#7A746C;--line:#DDD6C8;--white:#FDFAF6;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased;}

.book-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 20px;border-bottom:1px solid var(--line);background:var(--white);}
.book-logo-img{height:68px;display:block;}
.book-nav-back{font-size:0.75rem;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;}

.book-page{max-width:520px;margin:0 auto;padding:16px 20px 48px;}
.book-hero{margin-bottom:14px;text-align:center;}
.book-hero h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;line-height:1.2;color:var(--dark);margin-bottom:12px;}

.confirmed-wrap{text-align:center;padding:40px 20px;}
.confirmed-icon{font-size:3rem;margin-bottom:16px;}
.confirmed-wrap h2{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--dark);margin-bottom:10px;}
.confirmed-slot{font-size:1rem;font-weight:600;color:var(--lime);margin-bottom:14px;}
.confirmed-sub{font-size:0.85rem;color:var(--muted);line-height:1.7;margin-bottom:6px;}
.portal-cta-block{margin:24px 0 16px;padding:20px;background:rgba(163,230,53,0.07);border:1px solid rgba(163,230,53,0.28);border-radius:14px;text-align:center;}
.redirect-countdown{font-size:16px;font-weight:600;color:var(--lime);padding:6px 0;}
.portal-manual{display:inline-block;margin-top:10px;font-size:0.8rem;color:var(--muted);text-decoration:underline;}

.fallback-actions{margin-top:22px;}
.fallback-actions a{display:inline-block;padding:13px 26px;background:var(--lime);color:#fff;border-radius:10px;font-size:0.95rem;font-weight:700;text-decoration:none;}

@media(max-width:520px){
  .book-hero h1{font-size:1.65rem;}
}
</style>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TSJVG2GT" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<!-- Nav -->
<nav class="book-nav">
  <a href="/"><img src="/assets/logo-solar-review.png" alt="Solar Review" class="book-logo-img"/></a>
  <a href="/" class="book-nav-back">← Back to site</a>
</nav>

<div class="book-page">
  <div class="book-hero">
    <h1>Book a Free 15 Point<br>Solar Inspection</h1>
  </div>

  <div class="confirmed-wrap">
    <div class="confirmed-icon" id="confirmedIcon">🎉</div>
    <h2 id="confirmedHeadline">Congratulations!</h2>
    <p class="confirmed-sub" id="confirmedSub1" style="font-size:1rem;color:#475569;margin-bottom:6px;">Your Solar Evaluation has been booked for:</p>
    <div class="confirmed-slot" id="confirmedSlotLabel"></div>
    <p class="confirmed-sub" id="confirmedSub2" style="margin-top:14px;margin-bottom:20px;">You'll be taken to your portal next to add a few details for your technician.</p>
    <div class="portal-cta-block" id="portalBlock">
      <div id="redirectCountdown" class="redirect-countdown">Loading your appointment…</div>
      <a href="#" id="portalManual" class="portal-manual" style="display:none;">Go to my portal now →</a>
    </div>
    <div class="fallback-actions" id="fallbackActions" style="display:none;">
      <a href="/book">Book your free inspection →</a>
    </div>
  </div>
</div>

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-XFKY7F95JR');
gtag('config', 'AW-18121666624');

function getAttribution() {
  try { return JSON.parse(sessionStorage.getItem('fmAttribution') || '{}'); } catch(e) { return {}; }
}
// Google sends gbraid/wbraid INSTEAD of gclid on iOS and other privacy-restricted
// paid clicks, so a gclid-only check silently drops those conversions.
function hasPaidClick() {
  var a = getAttribution();
  return !!(a.gclid || a.gbraid || a.wbraid);
}

(function() {
  var el = function(id) { return document.getElementById(id); };
  var booking = null;
  try { booking = JSON.parse(sessionStorage.getItem('fmBooking') || 'null'); } catch(e) {}

  // Landed here without a booking in this session — a refresh after the session
  // was cleared, a bookmark, or a shared link. Never render a fake confirmation,
  // and never fire a conversion.
  if (!booking || !booking.label) {
    el('confirmedIcon').textContent = '📅';
    el('confirmedHeadline').textContent = 'No booking found';
    el('confirmedSub1').textContent = "We couldn't find an appointment in this browser session.";
    el('confirmedSlotLabel').textContent = '';
    el('confirmedSub2').textContent = 'If you already booked, we\'ll text you a confirmation shortly — nothing else is needed. Otherwise you can book below.';
    el('portalBlock').style.display = 'none';
    el('fallbackActions').style.display = 'block';
    return;
  }

  // ── Render the confirmation ──────────────────────────────────────────────
  el('confirmedSlotLabel').textContent = booking.label;
  if (!booking.appointmentBooked) {
    el('confirmedHeadline').textContent = 'Request Received!';
    el('confirmedSub1').textContent = 'Thanks! We have your details for your requested time:';
    el('confirmedSub2').textContent = "Our team will call you shortly to lock in your evaluation. No need to book again — we'll be taking you to your portal to add a few details for your technician.";
  }

  // ── Conversion tracking ──────────────────────────────────────────────────
  // Fired once per booking. `fmBookingCounted` guards against a page refresh
  // re-firing it; the booking payload itself is cleared right after.
  var alreadyCounted = false;
  try { alreadyCounted = sessionStorage.getItem('fmBookingCounted') === booking.id; } catch(e) {}

  if (!alreadyCounted) {
    try { sessionStorage.setItem('fmBookingCounted', booking.id); } catch(e) {}

    // For GTM: trigger on this custom event if you'd rather manage the tag there.
    dataLayer.push({
      event: 'booking_confirmed',
      booking_appointment_confirmed: !!booking.appointmentBooked,
      booking_paid_click: hasPaidClick()
    });

    if (typeof gtag !== 'undefined') {
      gtag('event', 'schedule_appointment', { event_category: 'booked_page', value: 1.0, currency: 'USD' });
      // ⚠️ REMOVE THIS BLOCK if you create a URL-based conversion on /booked in
      // Google Ads — otherwise every booking is counted twice.
      // Gated on a real paid click so organic/direct bookings don't inflate the
      // campaign's own conversion count.
      if (hasPaidClick()) {
        gtag('event', 'conversion', { send_to: 'AW-18121666624/u8R7COLKt7AcEMDgisFD', value: 1.0, currency: 'USD' });
      }
    }
    if (typeof fbq !== 'undefined') {
      // eventID matches the server-side Conversions API call fired from
      // ghl-book.js (eventId: 'schedule_' + appointmentId) — booking.id IS
      // that appointmentId when the appointment actually booked, so Meta
      // dedupes the browser + server events into one instead of double-counting.
      fbq('track', 'Schedule', {}, { eventID: 'schedule_' + booking.id });
      fbq('track', 'CompleteRegistration', {}, { eventID: 'cr_' + booking.id });
    }
  }

  // ── Hand off to the customer portal ──────────────────────────────────────
  // The magic link is keyed on email; without one it errors, so only redirect
  // when we have an email. Otherwise the customer stays on this confirmation.
  var cd = el('redirectCountdown');
  if (booking.email && booking.email.indexOf('@') > -1) {
    var link = 'https://fixmy.energy/portal?email=' + encodeURIComponent(booking.email) +
               '&code=' + encodeURIComponent(booking.phone10 || '');
    var manual = el('portalManual');
    manual.href = link;
    manual.style.display = 'inline-block';
    var secs = 4;
    (function tick() {
      if (secs <= 0) { window.location.href = link; return; }
      cd.textContent = 'Opening your portal in ' + secs + '…';
      secs--;
      setTimeout(tick, 1000);
    })();
  } else {
    cd.textContent = booking.appointmentBooked
      ? "You're all set — we'll text you a confirmation shortly."
      : "We'll call you shortly to confirm.";
  }

  // The booking payload is deliberately NOT cleared: a customer who taps back
  // from the portal should see their confirmation again, not "no booking found".
  // `fmBookingCounted` above is what prevents the conversion double-counting.
})();
</script>
</body>
</html>
