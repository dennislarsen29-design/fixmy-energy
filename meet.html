<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Book a Free Solar Evaluation — FixMy.Energy</title>
  <meta name="description" content="Save Solar Review as a contact and book your free solar evaluation." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 48px;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #8DC63F; margin-bottom: 4px; }
    .tagline { font-size: 0.78rem; color: #555; margin-bottom: 32px; }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 28px 24px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 14px;
    }
    .rep-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .rep-sub { font-size: 0.78rem; color: #888; margin-bottom: 20px; }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      border: none;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #8DC63F; color: #1A1A1A; }
    .btn-secondary {
      background: rgba(255,255,255,0.07);
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .info-row { font-size: 0.72rem; color: #666; text-align: center; margin-top: 8px; }
    #bookingWrap { display: none; margin-top: 20px; }
    #bookingWrap iframe {
      width: 100%;
      min-height: 680px;
      border: none;
      border-radius: 12px;
      background: #fff;
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #8DC63F;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingMsg { font-size: 0.8rem; color: #555; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
  <div class="logo">⚡ FixMy.Energy</div>
  <div class="tagline">Solar Diagnostics &amp; Battery Installations and Retrofits</div>

  <div class="card" id="mainCard">
    <div class="section-title">Your Solar Rep</div>
    <div class="rep-name" id="repName">Loading…</div>
    <div class="rep-sub">Solar Review · FixMy.Energy</div>

    <a id="saveContactBtn" href="#" class="btn btn-primary" style="display:none;">
      💾 Save Solar Review Contact
    </a>

    <button class="btn btn-secondary" id="bookBtn" onclick="showBooking()">
      📅 Book Free Solar Evaluation
    </button>

    <div class="info-row">No cost, no obligation — just answers about your solar system.</div>
  </div>

  <div class="card" id="bookingWrap">
    <div class="section-title">Book Your Evaluation</div>
    <iframe id="bookingFrame" title="Book a free solar evaluation"></iframe>
  </div>

  <script>
    var GHL_BOOKING = 'https://api.leadconnectorhq.com/widget/booking/UjlvHxE8AlyhG5frBkqr';
    var repId = (new URLSearchParams(window.location.search)).get('r') || '';
    var repPhone = '';
    var repNameStr = 'Solar Review';

    // Load tech info
    (async function() {
      var nameEl = document.getElementById('repName');
      if (!repId) { nameEl.textContent = 'Solar Review'; buildVCard('Solar Review', ''); return; }
      try {
        var resp = await fetch('/.netlify/functions/meet-init?r=' + encodeURIComponent(repId));
        if (resp.ok) {
          var data = await resp.json();
          repNameStr = data.name || 'Solar Review';
          repPhone = data.phone || '';
          nameEl.textContent = repNameStr;
          buildVCard(repNameStr, repPhone);
        } else {
          nameEl.textContent = 'Solar Review';
          buildVCard('Solar Review', '');
        }
      } catch(e) {
        nameEl.textContent = 'Solar Review';
        buildVCard('Solar Review', '');
      }
    })();

    function buildVCard(name, phone) {
      var parts = name.split(' ');
      var fn = parts[0] || 'Solar';
      var ln = parts.slice(1).join(' ') || 'Review';
      var vcf = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:' + name + ' – Solar Review',
        'N:' + ln + ';' + fn + ';;;',
        'ORG:FixMy.Energy',
        'URL:https://fixmy.energy',
        'EMAIL:dennis@fixmy.energy',
        phone ? ('TEL;TYPE=CELL:' + phone) : '',
        'NOTE:Solar Diagnostics & Battery Installations and Retrofits – San Diego',
        'END:VCARD'
      ].filter(Boolean).join('\r\n');

      var btn = document.getElementById('saveContactBtn');
      btn.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcf);
      btn.download = 'solar-review.vcf';
      btn.style.display = 'block';
    }

    function showBooking() {
      var wrap = document.getElementById('bookingWrap');
      var frame = document.getElementById('bookingFrame');
      var noteParam = '&notes=QR+referral%3A+' + encodeURIComponent(repNameStr) + (repId ? '+%28'+encodeURIComponent(repId)+'%29' : '');
      frame.src = GHL_BOOKING + '?hideForm=0' + noteParam;
      wrap.style.display = 'block';
      wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Listen for GHL booking_confirmed event — fire qr-lead attribution
    window.addEventListener('message', function(evt) {
      if (!evt.data || typeof evt.data !== 'object') return;
      var type = evt.data.type || evt.data.event || '';
      if (type === 'booking_confirmed' || type === 'formSubmitted') {
        var d = evt.data.data || evt.data || {};
        if (!repId) return;
        fetch('/.netlify/functions/qr-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName: d.firstName || d.first_name || '',
            lastName: d.lastName || d.last_name || '',
            email: d.email || '',
            phone: d.phone || '',
            rep_id: repId
          })
        }).catch(function(){});
      }
    });
  </script>
</body>
</html>
