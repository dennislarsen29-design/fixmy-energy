<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="640" height="440" fill="#181818"/>
  <!-- Wall + meter for context -->
  <rect x="60" y="60" width="130" height="130" rx="10" fill="#3c3c3c" stroke="#222" stroke-width="2"/>
  <circle cx="125" cy="112" r="38" fill="#dfe4e8" stroke="#8b9298" stroke-width="3"/>
  <rect x="98" y="100" width="54" height="16" rx="3" fill="#2b3440"/>
  <text x="125" y="112.5" text-anchor="middle" fill="#9fd0ff" font-size="9">0 4 8 2 7</text>
  <text x="125" y="172" text-anchor="middle" fill="#9aa0a6" font-size="11">utility meter</text>
  <!-- Conduit -->
  <rect x="190" y="118" width="86" height="10" fill="#7d7a74"/>
  <!-- Disconnect box -->
  <rect x="276" y="52" width="220" height="260" rx="12" fill="#c9ced3" stroke="#8b9298" stroke-width="3"/>
  <rect x="292" y="68" width="188" height="52" rx="6" fill="#aeb5bb"/>
  <text x="386" y="90" text-anchor="middle" fill="#3d444b" font-size="12" font-weight="800">AC DISCONNECT</text>
  <text x="386" y="108" text-anchor="middle" fill="#5a626a" font-size="10">"disco" — gray box near meter or inverter</text>
  <!-- Pull handle -->
  <rect x="470" y="130" width="26" height="120" rx="8" fill="#4a4a4a" stroke="#111" stroke-width="2"/>
  <rect x="474" y="138" width="18" height="46" rx="6" fill="#d43c3c"/>
  <!-- Handle positions -->
  <text x="520" y="152" fill="#8DC63F" font-size="12" font-weight="800">UP = ON</text>
  <text x="520" y="242" fill="#f0b3b3" font-size="12" font-weight="800">DOWN = OFF</text>
  <line x1="510" y1="146" x2="498" y2="150" stroke="#8DC63F" stroke-width="2"/>
  <line x1="510" y1="238" x2="498" y2="234" stroke="#f0b3b3" stroke-width="2"/>
  <!-- Callout -->
  <rect x="60" y="330" width="520" height="82" rx="10" fill="#2a2109" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="358" text-anchor="middle" fill="#f5c168" font-size="13.5" font-weight="800">Pull the handle firmly to OFF — it clicks. Nothing to open, nothing to unscrew.</text>
  <text x="320" y="380" text-anchor="middle" fill="#e8d5ae" font-size="11.5">Some discos are a lever on the side instead of a pull handle — same idea: flip to OFF.</text>
  <text x="320" y="398" text-anchor="middle" fill="#e8d5ae" font-size="11.5">If it's padlocked or looks damaged, stop and photograph it.</text>
  <text x="320" y="30" text-anchor="middle" fill="#bdb9b1" font-size="14" font-weight="800">Quick Disconnect ("disco") — usually next to the meter</text>
</svg>
