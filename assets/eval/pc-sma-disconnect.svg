<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="640" height="440" fill="#181818"/>
  <!-- SMA body (rounded red top) -->
  <path d="M190 90 Q190 34 320 34 Q450 34 450 90 L450 250 Q450 264 436 264 L204 264 Q190 264 190 250 Z" fill="#e8e6e1" stroke="#9a9791" stroke-width="3"/>
  <path d="M196 88 Q200 44 320 44 Q440 44 444 88 L444 96 L196 96 Z" fill="#c8342b"/>
  <text x="320" y="76" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">SMA · Sunny Boy</text>
  <!-- Display -->
  <rect x="240" y="118" width="160" height="64" rx="8" fill="#16211a"/>
  <text x="320" y="145" text-anchor="middle" fill="#7fe0a0" font-size="12">display sleeps to save power</text>
  <text x="320" y="165" text-anchor="middle" fill="#4d6a58" font-size="10.5">knock/tap enclosure to wake it</text>
  <!-- Tap callout -->
  <line x1="240" y1="150" x2="130" y2="120" stroke="#8DC63F" stroke-width="2.5"/>
  <rect x="10" y="76" width="180" height="70" rx="10" fill="#20260f" stroke="#8DC63F" stroke-width="2"/>
  <text x="100" y="102" text-anchor="middle" fill="#8DC63F" font-size="13" font-weight="800">TAP the case twice</text>
  <text x="100" y="121" text-anchor="middle" fill="#cfe6a8" font-size="11">wakes the display; more</text>
  <text x="100" y="137" text-anchor="middle" fill="#cfe6a8" font-size="11">taps cycle the screens</text>
  <!-- Rotary DC disconnect below unit -->
  <rect x="272" y="264" width="96" height="86" rx="10" fill="#c9c6c0" stroke="#9a9791" stroke-width="2.5"/>
  <circle cx="320" cy="306" r="30" fill="#3a3a3a" stroke="#111" stroke-width="2"/>
  <rect x="313" y="282" width="14" height="48" rx="6" fill="#d43c3c"/>
  <!-- Rotary callout -->
  <line x1="352" y1="316" x2="470" y2="340" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="428" y="316" width="200" height="94" rx="10" fill="#2a2109" stroke="#f59e0b" stroke-width="2"/>
  <text x="528" y="342" text-anchor="middle" fill="#f5c168" font-size="13" font-weight="800">Rotary DC disconnect</text>
  <text x="528" y="362" text-anchor="middle" fill="#e8d5ae" font-size="11.5">under the inverter —</text>
  <text x="528" y="379" text-anchor="middle" fill="#e8d5ae" font-size="11.5">turn the red handle to</text>
  <text x="528" y="396" text-anchor="middle" fill="#e8d5ae" font-size="11.5">OFF (O) · ON (I)</text>
  <text x="320" y="22" text-anchor="middle" fill="#bdb9b1" font-size="14" font-weight="800">SMA Sunny Boy — disconnect &amp; display</text>
</svg>
