<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="640" height="440" fill="#181818"/>
  <!-- Inverter body -->
  <rect x="180" y="28" width="280" height="240" rx="14" fill="#e8e6e1" stroke="#9a9791" stroke-width="3"/>
  <rect x="205" y="52" width="230" height="70" rx="8" fill="#1f2a33"/>
  <text x="320" y="82" text-anchor="middle" fill="#7fd0ff" font-size="15" font-weight="700">SolarEdge</text>
  <text x="320" y="104" text-anchor="middle" fill="#5c7484" font-size="11">status display / LEDs</text>
  <circle cx="222" cy="140" r="6" fill="#39c26b"/>
  <text x="238" y="145" fill="#5b5852" font-size="11">green = producing</text>
  <!-- Underside connection unit -->
  <rect x="205" y="268" width="230" height="76" rx="10" fill="#c9c6c0" stroke="#9a9791" stroke-width="2.5"/>
  <!-- DC safety switch (rotary, on connection unit) -->
  <circle cx="262" cy="306" r="24" fill="#3a3a3a" stroke="#111" stroke-width="2"/>
  <rect x="256" y="288" width="12" height="36" rx="5" fill="#d43c3c" transform="rotate(90 262 306)"/>
  <text x="262" y="356" text-anchor="middle" fill="#8a8781" font-size="10">DC disconnect</text>
  <!-- Red ON/OFF/P toggle -->
  <rect x="352" y="284" width="46" height="44" rx="8" fill="#2c2c2c" stroke="#111" stroke-width="2"/>
  <rect x="366" y="290" width="18" height="30" rx="6" fill="#e03d3d"/>
  <circle cx="375" cy="298" r="4" fill="#7d1d1d"/>
  <!-- Callout for toggle -->
  <line x1="398" y1="306" x2="500" y2="240" stroke="#8DC63F" stroke-width="2.5"/>
  <rect x="470" y="150" width="160" height="96" rx="10" fill="#20260f" stroke="#8DC63F" stroke-width="2"/>
  <text x="550" y="174" text-anchor="middle" fill="#8DC63F" font-size="14" font-weight="800">Red toggle</text>
  <text x="550" y="196" text-anchor="middle" fill="#cfe6a8" font-size="12">1 = ON</text>
  <text x="550" y="214" text-anchor="middle" fill="#cfe6a8" font-size="12">0 = OFF</text>
  <text x="550" y="232" text-anchor="middle" fill="#f0b3b3" font-size="11">P = pairing (don't hold)</text>
  <!-- Callout for location -->
  <line x1="330" y1="306" x2="150" y2="360" stroke="#f59e0b" stroke-width="2"/>
  <rect x="14" y="344" width="230" height="66" rx="10" fill="#2a2109" stroke="#f59e0b" stroke-width="2"/>
  <text x="129" y="370" text-anchor="middle" fill="#f5c168" font-size="12.5" font-weight="700">Both switches live on the</text>
  <text x="129" y="390" text-anchor="middle" fill="#f5c168" font-size="12.5" font-weight="700">UNDERSIDE of the inverter</text>
  <text x="320" y="20" text-anchor="middle" fill="#bdb9b1" font-size="14" font-weight="800">SolarEdge — where the switches are</text>
</svg>
