<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="640" height="440" fill="#181818"/>
  <!-- Panel -->
  <rect x="170" y="34" width="300" height="360" rx="12" fill="#c9ced3" stroke="#8b9298" stroke-width="3"/>
  <rect x="196" y="58" width="248" height="312" rx="6" fill="#9aa1a8"/>
  <!-- Main breaker -->
  <rect x="266" y="70" width="108" height="40" rx="5" fill="#2f2f2f"/>
  <rect x="306" y="78" width="28" height="24" rx="4" fill="#666"/>
  <text x="320" y="126" text-anchor="middle" fill="#3d444b" font-size="10" font-weight="700">MAIN</text>
  <!-- Breaker rows -->
  <g fill="#2f2f2f">
    <rect x="222" y="146" width="90" height="26" rx="4"/><rect x="328" y="146" width="90" height="26" rx="4"/>
    <rect x="222" y="182" width="90" height="26" rx="4"/><rect x="328" y="182" width="90" height="26" rx="4"/>
    <rect x="222" y="218" width="90" height="26" rx="4"/><rect x="328" y="218" width="90" height="26" rx="4"/>
    <rect x="222" y="254" width="90" height="26" rx="4"/><rect x="328" y="254" width="90" height="26" rx="4"/>
    <rect x="222" y="290" width="90" height="26" rx="4"/>
  </g>
  <g fill="#777">
    <rect x="258" y="151" width="18" height="16" rx="3"/><rect x="364" y="151" width="18" height="16" rx="3"/>
    <rect x="258" y="187" width="18" height="16" rx="3"/><rect x="364" y="187" width="18" height="16" rx="3"/>
    <rect x="258" y="223" width="18" height="16" rx="3"/><rect x="364" y="223" width="18" height="16" rx="3"/>
    <rect x="258" y="259" width="18" height="16" rx="3"/><rect x="364" y="259" width="18" height="16" rx="3"/>
  </g>
  <!-- Solar breaker highlighted -->
  <rect x="328" y="290" width="90" height="26" rx="4" fill="#2f2f2f" stroke="#8DC63F" stroke-width="3"/>
  <rect x="364" y="295" width="18" height="16" rx="3" fill="#8DC63F"/>
  <text x="373" y="334" text-anchor="middle" fill="#20260f" font-size="9" font-weight="800"></text>
  <!-- Callout -->
  <line x1="418" y1="303" x2="510" y2="260" stroke="#8DC63F" stroke-width="2.5"/>
  <rect x="472" y="170" width="160" height="92" rx="10" fill="#20260f" stroke="#8DC63F" stroke-width="2"/>
  <text x="552" y="196" text-anchor="middle" fill="#8DC63F" font-size="13" font-weight="800">Find the breaker</text>
  <text x="552" y="215" text-anchor="middle" fill="#cfe6a8" font-size="11.5">labeled SOLAR, PV,</text>
  <text x="552" y="232" text-anchor="middle" fill="#cfe6a8" font-size="11.5">or INVERTER —</text>
  <text x="552" y="249" text-anchor="middle" fill="#cfe6a8" font-size="11.5">often bottom row</text>
  <!-- Safety note -->
  <rect x="14" y="330" width="150" height="80" rx="10" fill="#2c1212" stroke="#ef4444" stroke-width="2"/>
  <text x="89" y="356" text-anchor="middle" fill="#f0b3b3" font-size="11.5" font-weight="800">Flip breakers only.</text>
  <text x="89" y="375" text-anchor="middle" fill="#e0a5a5" font-size="10.5">Never remove the</text>
  <text x="89" y="391" text-anchor="middle" fill="#e0a5a5" font-size="10.5">panel's inner cover.</text>
  <text x="320" y="22" text-anchor="middle" fill="#bdb9b1" font-size="14" font-weight="800">Main panel — the solar breaker</text>
</svg>
