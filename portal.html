  window.generateProposalInsight = async function(id, serviceType) {
    var rec = adminCustomers.find(function(x){ return x.id === id; });
    if (!rec) return;
    if (!rec.monthly_bill) {
      alert('⚠ No utility bill on file.\n\nAdd the customer\'s monthly bill to their profile before generating the AI insight.');
      return;
    }
    var btn = document.getElementById('propInsightBtn');
    var ta  = document.getElementById('propInsightText');
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    var svcType = serviceType || 'inverter_swap';
    try {
      var sysKw       = parseFloat(rec.system_size) || 0;
      var bill        = parseFloat(rec.monthly_bill) || 0;
      var blendedRate = 0.453;
      var yield_kw    = 1600;
      var newPanelKw  = 4.2;
      // Build option totals from current _propBuilds for context
      var optionTotals = (_propBuilds||[]).map(function(b){ return b.price||0; }).filter(Boolean);
      // Inverter-specific calculations (used when service type is inverter_swap)
      var monthlyLossEst  = (svcType==='inverter_swap' && sysKw>0) ? Math.round(sysKw*yield_kw*0.75*blendedRate/12) : null;
      var newSysKw        = (svcType==='inverter_swap' && sysKw>0) ? Math.round((sysKw+newPanelKw)*10)/10 : null;
      var annualKwhBundle = newSysKw ? Math.round(newSysKw*yield_kw) : null;
      // Fix: calculate expected bill after fix instead of hardcoding 25
      var expectedBillWithFix = (svcType==='inverter_swap' && newSysKw && bill>0)
        ? Math.max(24, Math.round(bill - newSysKw*yield_kw/12*blendedRate))
        : null;
      // Use actual diagnostic findings as the issue description
      var issueContext = svcType==='inverter_swap'
        ? (rec.diagnostic_findings ? rec.diagnostic_findings.slice(0,250) : 'inverter degraded — operating below rated capacity')
        : (rec.diagnostic_findings ? rec.diagnostic_findings.slice(0,250) : null);
      var r = await fetch('/.netlify/functions/generate-proposal-insight', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service_type:           svcType,
          notes:                  rec.notes              || '',
          diagnostic_findings:    rec.diagnostic_findings || '',
          first_name:             rec.first_name          || '',
          system_size:            rec.system_size  || null,
          monthly_bill:           rec.monthly_bill || null,
          nem_status:             rec.nem_status   || '',
          installer:              rec.installer    || '',
          option_totals:          optionTotals,
          issue:                  issueContext,
          inverter_output_pct:    svcType==='inverter_swap' ? 25 : null,
          monthly_loss_est:       monthlyLossEst,
          expected_bill_with_fix: expectedBillWithFix,
          new_system_size_kw:     newSysKw,
          annual_kwh_with_bundle: annualKwhBundle,
        })
      });
      var d = await r.json();
      if (d.insight && ta) ta.value = d.insight;
      else if (ta) ta.value = 'Could not generate insight: ' + (d.error || 'unknown error');
    } catch(e) {
      if (ta) ta.value = 'Error: ' + e.message;
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '✨ Generate'; }
    }
  };

  window.propShowScenario = function(type, bill, sysKw) {
    var detail = document.getElementById('propSavingsDetail');
    if (!detail) return;
    bill = parseFloat(bill) || 0;
    sysKw = parseFloat(sysKw) || 0;
    if (!bill) {
      detail.style.display = 'block';
      detail.innerHTML = '<div style="font-size:0.78rem;color:#666;">Add monthly bill to customer profile to calculate savings.</div>';
      return;
    }

    // SDG&E confirmed effective rate (verified from actual bill: $3,115 / 6,877 kWh = $0.453/kWh)
    // Tier 1: 41¢/kWh | Tier 2: 52¢/kWh | Blended: ~45¢/kWh
    var blendedRate = 0.453;
    // San Diego specific yield — NREL NSRDB (residential tilted array, ~1,600 kWh/kW/yr)
    var specificYield = 1600;
    // New capacity: 10 × Tesla 420W panels
    var newPanelKw = 4.2;
    var newPanelAnnualKwh = newPanelKw * specificYield; // 6,720 kWh/yr

    // Escalation rates — verified from CPUC SB 695 reports and BLS data:
    // Conservative 5%/yr  — below CPUC official avg; floor for skeptical customers
    // Moderate     7%/yr  — CPUC SB 695 official: SDG&E avg 2016–2024 = 7%/yr
    // Impact Trend 10%/yr — CPUC 2023 SB 695 projected 10.4%/yr; recent 4-yr CAGR = 13.4%
    var configs = {

    // 20-year savings — geometric series (each year's savings grow as SDG&E rates rise)
    // S = Year1 × [(1+r)^20 − 1] / r
    var factor20 = (Math.pow(1 + cfg.r, 20) - 1) / cfg.r;

    // New panel value line
    var newPanelMo = Math.round(newPanelAnnualKwh * blendedRate / 12);

    detail.style.display = 'block';

      '</div>'+

        '<div style="background:rgba(255,255,255,0.04);border-radius:8px;padding:10px;text-align:center;">'+
          '<div style="font-size:0.63rem;color:#666;margin-bottom:3px;">Monthly</div>'+
          '<div style="font-size:1.2rem;font-weight:700;color:'+cfg.color+';">~'+fmt(monthlySaved)+'</div>'+

  window.adminCanvassEnrichAll = async function() {
    if (_bbEnrichRunning) return;
    _bbEnrichRunning = true;
    var bar = document.getElementById('bbEnrichBar');
    if (bar) bar.innerHTML = '<div style="background:rgba(74,158,255,0.07);border:1px solid rgba(74,158,255,0.2);border-radius:10px;padding:10px 14px;" id="bbEnrichProgress"><div style="font-size:0.75rem;color:#4a9eff;font-weight:700;">Counting leads to enrich&hellip;</div></div>';

    var c2 = supabase.createClient(SUPA_URL, SUPA_KEY);
    var PAGE_SIZE = 500;
    var pageOffset = 0, grandTotal = 0, found = 0, failed = 0, firstDebug = null;

    // Get total count for accurate progress bar
    var { count } = await c2.from('customers')
      .select('id', { count: 'exact', head: true })
      .eq('lead_source','orphaned_list').is('sold_type',null).is('title_owner',null).not('address','is',null);
    grandTotal = count || 0;

    function updateProgress() {
      var done = found + failed;
      var pct = grandTotal ? Math.round(done / grandTotal * 100) : 0;
      var prog = document.getElementById('bbEnrichProgress');
      if (prog) prog.innerHTML = '<div style="font-size:0.75rem;color:#4a9eff;font-weight:700;margin-bottom:6px;">Enriching&hellip; '+done+' of '+grandTotal+' &mdash; '+found+' owners found</div>'
        + '<div style="background:rgba(255,255,255,0.08);border-radius:100px;height:6px;overflow:hidden;">'
        + '<div style="background:#4a9eff;height:6px;border-radius:100px;width:'+pct+'%;transition:width 0.3s;"></div></div>'
        + '<div style="font-size:0.65rem;color:#555;margin-top:4px;">'+pct+'% &mdash; keep tab active while enriching</div>'
        + (firstDebug ? '<div style="font-size:0.6rem;color:#555;margin-top:3px;word-break:break-all;">⚠ Last miss: '+firstDebug+'</div>' : '');
    }

    // Paginate through ALL unenriched leads
    while (true) {
      if (!_bbEnrichRunning) break; // allow cancel
      var { data: leads } = await c2.from('customers')
        .select('id,address,lat,lng')
        .eq('lead_source','orphaned_list').is('sold_type',null).is('title_owner',null)
        .not('address','is',null).order('created_at',{ascending:true})
        .range(pageOffset, pageOffset + PAGE_SIZE - 1);
      leads = leads || [];
      if (!leads.length) break;

      for (var i = 0; i < leads.length; i++) {
        if (!_bbEnrichRunning) break;
        var lead = leads[i];
        try {
          var body = { address: lead.address };
          if (lead.lat) body.lat = lead.lat;
          if (lead.lng) body.lng = lead.lng;
          var resp = await fetch('/.netlify/functions/regrid-lookup', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
          });
          var data = await resp.json();
          if (data.owner) {
            found++;
            var upd = { title_owner: data.owner, apn: data.apn || null };
            if (data.assessed_value) upd.assessed_value = data.assessed_value;
            if (data.tax_delinquent != null) upd.tax_delinquent = data.tax_delinquent;
            if (data.lat != null) upd.lat = data.lat;
            if (data.lng != null) upd.lng = data.lng;
            await c2.from('customers').update(upd).eq('id', lead.id);
            var cached = adminCustomers.find(function(r){ return r.id === lead.id; });
            if (cached) Object.assign(cached, upd);
          } else {
            failed++;
            if (!firstDebug && data.debug) firstDebug = lead.address.split(',')[0] + ' → ' + data.debug;
          }
        } catch(e) { failed++; }
        updateProgress();
        await new Promise(function(r){ setTimeout(r, 350); });
      }

      pageOffset += PAGE_SIZE;
      if (leads.length < PAGE_SIZE) break; // last page
    }

    _bbEnrichRunning = false;
    var bar2 = document.getElementById('bbEnrichBar');
    if (bar2) bar2.innerHTML = '<div style="background:rgba(141,198,63,0.08);border:1px solid rgba(141,198,63,0.2);border-radius:10px;padding:10px 14px;font-size:0.75rem;color:#8DC63F;font-weight:700;">'
      + '&#10003; Free enrichment done: '+found+' owner names added &mdash; run Skip Trace to add phone &amp; email'
      + (firstDebug ? '<div style="font-size:0.65rem;color:#888;font-weight:400;margin-top:4px;">Missed: '+firstDebug+'</div>' : '')
      + '</div>';
    setTimeout(adminCanvassLoadEnrichBar, 1200);
  };

  window.adminCanvassSubmitSkipTrace = async function(missingCount) {

      if (data.status === 'pending') {
        var waitMin = data.estimated_wait_seconds ? Math.ceil(data.estimated_wait_seconds/60) : null;
        if (bar) bar.innerHTML = '<div style="background:rgba(74,158,255,0.07);border:1px solid rgba(74,158,255,0.2);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">'

          + '</div>';
        return;
      }
      var recs = data.records || [];
      var c2 = supabase.createClient(SUPA_URL, SUPA_KEY);

      // Build street → id map for address-based fallback matching
      // (Tracerfy may not pass lead_id back through the results CSV)
      var streetMap = {};
      var { data: allLeads } = await c2.from('customers')
        .select('id,address').eq('lead_source','orphaned_list').is('sold_type',null).limit(1000);
      (allLeads || []).forEach(function(l) {
        if (l.address) {
          var street = l.address.split(',')[0].trim().toLowerCase();
          streetMap[street] = l.id;
        }
      });

      var updated = 0;

      // Build street → customer ID map for address-based fallback
      // (Tracerfy advanced trace does not echo back our custom lead_id column)
      var streetMap = {};

        if (l.address) streetMap[l.address.split(',')[0].trim().toLowerCase()] = l.id;
      });

      for (var i = 0; i < recs.length; i++) {
        var r = recs[i];
        if (!r.phone && !r.email && !r.owner_name) continue;
        var resolvedId = r.lead_id;
        if (!resolvedId && r.street_address) {
          resolvedId = streetMap[r.street_address.trim().toLowerCase()];
        }
        if (!resolvedId) continue;
        var upd = {};
        if (r.owner_name) upd.title_owner = r.owner_name;

        if (r.email) upd.email = r.email;
        upd.dnc = r.dnc || false;
        var res = await c2.from('customers').update(upd).eq('id', resolvedId);
        if (!res.error) {
          updated++;
          var mem = adminCustomers.find(function(x){ return x.id === resolvedId; });
          if (mem) { if (r.owner_name) mem.title_owner = r.owner_name; if (r.phone) mem.phone = r.phone; if (r.email) mem.email = r.email; mem.dnc = upd.dnc; }
          var canv = (window.adminCanvassLeads||[]).find(function(x){ return x.id === resolvedId; });
          if (canv) { if (r.owner_name) canv.title_owner = r.owner_name; if (r.phone) canv.phone = r.phone; if (r.email) canv.email = r.email; canv.dnc = upd.dnc; }
        }

      localStorage.removeItem('bb_skip_trace_queue');
      if (bar) bar.innerHTML = '<div style="background:rgba(141,198,63,0.08);border:1px solid rgba(141,198,63,0.2);border-radius:10px;padding:10px 14px;">'
        + '<div style="font-size:0.75rem;font-weight:700;color:#8DC63F;">&#10003; Skip trace complete &mdash; '+updated+' leads updated</div>'
        + '<div style="font-size:0.68rem;color:#888;margin-top:2px;">Credits used: '+(data.credits_deducted || count)+' &mdash; reload to refresh lead list</div>'
        + '</div>';

  window.bbProcessTracerfyCsv = async function() {
    var raw = (document.getElementById('bbTracerfyRaw')||{}).value || '';
    var statusEl = document.getElementById('bbTracerfyPasteStatus');
    if (!raw.trim()) { if (statusEl) statusEl.textContent = 'Paste CSV first.'; return; }
    if (statusEl) statusEl.textContent = 'Parsing…';

    var lines = raw.trim().split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    if (lines.length < 2) { if (statusEl) statusEl.textContent = 'Need header + at least one data row.'; return; }

    // Parse CSV respecting quoted fields
    function parseCsvLine(line) {
      var result = [], cur = '', inQ = false;
      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      result.push(cur.trim());
      return result;
    }

    var headers = parseCsvLine(lines[0]).map(function(h){ return h.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''); });
    var records = [];
    for (var i = 1; i < lines.length; i++) {
      var vals = parseCsvLine(lines[i]);
      var row = {};
      headers.forEach(function(h, j){ row[h] = (vals[j]||'').trim(); });
      var leadId = row['lead_id'] || null;
      var streetAddr = (row['street_address'] || row['address'] || '').trim();
      if (!leadId && !streetAddr) continue;
      var phone = row['primary_phone'] || row['mobile_1'] || row['landline_1'] || null;
      var email = row['email_1'] || row['email'] || null;
      var firstName = row['first_name'] || row['owner_1_first_name'] || '';
      var lastName  = row['last_name']  || row['owner_1_last_name']  || '';
      var ownerName = [firstName, lastName].filter(Boolean).join(' ') || null;
      var dncRaw = row['do_not_call'] || row['dnc'] || row['primary_phone_dnc'] || row['mobile_1_dnc'] || row['phone_dnc'] || '';
      var dnc = ['true','yes','1','y'].includes(dncRaw.toLowerCase().trim());
      if (phone || email || ownerName) {
        records.push({ lead_id: leadId, street_address: streetAddr, phone: phone||null, email: email||null, owner_name: ownerName||null, dnc: dnc });
      }
    }

    if (!records.length) { if (statusEl) statusEl.textContent = 'No usable records found in CSV.'; return; }
    if (statusEl) statusEl.textContent = 'Matching ' + records.length + ' records to leads…';

    // Build street map for fallback matching
    var streetMap = {};
    adminCustomers.filter(function(x){ return x.lead_source === 'orphaned_list'; }).forEach(function(l){
      if (l.address) streetMap[l.address.split(',')[0].trim().toLowerCase()] = l.id;
    });

    var c2 = supabase.createClient(SUPA_URL, SUPA_KEY);
    var updated = 0, skipped = 0;
    for (var ri = 0; ri < records.length; ri++) {
      var r = records[ri];
      var resolvedId = r.lead_id;
      if (!resolvedId && r.street_address) resolvedId = streetMap[r.street_address.trim().toLowerCase()];
      if (!resolvedId) { skipped++; continue; }
      var upd = { dnc: r.dnc || false };
      if (r.owner_name) upd.title_owner = r.owner_name;
      if (r.phone) upd.phone = r.phone;
      if (r.email) upd.email = r.email;
      var res = await c2.from('customers').update(upd).eq('id', resolvedId);
      if (!res.error) {
        updated++;
        var mem = adminCustomers.find(function(x){ return x.id === resolvedId; });
        if (mem) { if (r.owner_name) mem.title_owner = r.owner_name; if (r.phone) mem.phone = r.phone; if (r.email) mem.email = r.email; mem.dnc = upd.dnc; }
        var canv = (window.adminCanvassLeads||[]).find(function(x){ return x.id === resolvedId; });
        if (canv) { if (r.owner_name) canv.title_owner = r.owner_name; if (r.phone) canv.phone = r.phone; if (r.email) canv.email = r.email; canv.dnc = upd.dnc; }
      }
      if (statusEl && ri % 20 === 0) statusEl.textContent = 'Updating… (' + ri + '/' + records.length + ')';
    }

    if (statusEl) statusEl.textContent = '✓ Done — ' + updated + ' leads updated, ' + skipped + ' unmatched.';
    adminCanvassLoadEnrichBar();
  };

  window.calcLeadScore = function(lead) {
    var score = 0;
    var yr = parseInt(lead.install_year) || 0;
    var age = yr > 0 ? (new Date().getFullYear() - yr) : 0;
    if (age >= 10) score += 40; else if (age >= 8) score += 30;
    else if (age >= 6) score += 20; else if (age >= 1) score += 10;
    if (lead.phone) score += 15;
    if (lead.email) score += 15;
    if (lead.title_owner) score += 10;
    if (lead.title_confirmed) score += 5;
    var inst = (lead.original_installer || '').toLowerCase();
    if (inst.includes('sunpower') || inst.includes('titan')) score += 15;
    else if (inst.includes('sullivan') || inst.includes('freedom forever') || inst.includes('pink energy')) score += 12;
    else if (inst.includes('sunnova') || inst.includes('petersen')) score += 10;
    else score += 8;
    var av = parseInt(lead.assessed_value) || 0;
    if (av >= 500000) score += 10; else if (av >= 350000) score += 7; else if (av >= 200000) score += 4;
    if (lead.tax_delinquent) score -= 10;
    return Math.max(0, Math.min(100, score));
  };

  window.adminCanvassPullAndImport = async function() {
    var checked = (window.BB_SD_INSTALLERS||[]).filter(function(ins){
      var el = document.getElementById('bbPsChk_'+ins.id);
      return el && el.checked;
    });
    if (!checked.length) { alert('Select at least one installer.'); return; }
    var prog = document.getElementById('bbPullProgress');
    var allRecords = [], allLogs = [], firstError = null;
    for (var i = 0; i < checked.length; i++) {
      var ins = checked[i];
      var runningTot = allRecords.length ? ' · +'+allRecords.length+' permits' : '';
      if (prog) prog.textContent = '('+(i+1)+'/'+checked.length+') '+ins.label+'…'+runningTot;
      try {
        var resp = await fetch('/.netlify/functions/permitstack-pull', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ installer: ins.label, names: ins.names })
        });
        if (!resp.ok) { allLogs.push(ins.label+': HTTP '+resp.status); if (prog) prog.textContent = '('+(i+1)+'/'+checked.length+') '+ins.label+' ✗'+(allRecords.length?' · +'+allRecords.length+' permits':''); continue; }
        var data; try { data = await resp.json(); } catch(e) { allLogs.push(ins.label+': parse error'); continue; }
        if (data.error && !firstError) firstError = ins.label+': '+data.error;
        if (data.log && Array.isArray(data.log)) allLogs = allLogs.concat(data.log);
        var prevLen = allRecords.length;
        if (data.records && data.records.length) allRecords = allRecords.concat(data.records);
        var newCt = allRecords.length - prevLen;
        if (prog) prog.textContent = '('+(i+1)+'/'+checked.length+') '+ins.label+' ✓ +'+newCt+' · total: '+allRecords.length+' permits';
      } catch(e) { allLogs.push(ins.label+': '+e.message); console.error('BB pull error:', e); }
    }
    if (allLogs.length) { console.group('PermitStack pull debug'); allLogs.forEach(function(l){ console.log(l); }); console.groupEnd(); }
    var _logHtml = allLogs.length
      ? '<details style="margin-top:6px;font-size:0.65rem;"><summary style="cursor:pointer;color:#555;padding:2px 0;">Debug log ('+allLogs.length+' messages)</summary>'
        + '<pre style="background:rgba(0,0,0,0.4);padding:8px;border-radius:6px;overflow-x:auto;max-height:180px;overflow-y:auto;color:#888;white-space:pre-wrap;word-break:break-all;margin-top:4px;">'+allLogs.map(function(l){return l.replace(/&/g,'&amp;').replace(/</g,'&lt;');}).join('\n')+'</pre></details>'
      : '';
    if (!allRecords.length) {
      var msg = firstError ? 'Pull error: '+firstError : 'No new SD County permits found.';
      if (prog) prog.innerHTML = msg + _logHtml;
      return;
    }
    var existingAddrs = new Set(adminCustomers.map(function(c){ return (c.address||'').toLowerCase().replace(/\s+/g,' ').trim(); }));
    var dupeCount = 0;
    var toInsert = allRecords.filter(function(r) {
      var key = (r.address||'').toLowerCase().replace(/\s+/g,' ').trim();
      if (!key) return false;
      if (existingAddrs.has(key)) { dupeCount++; return false; }
      existingAddrs.add(key);
      return true;
    });
    if (!toInsert.length) {
      if (prog) prog.textContent = 'All '+allRecords.length+' permits already imported.';
      return;
    }
    if (prog) prog.textContent = 'Importing '+toInsert.length+' new leads…';
    var sc = supabase.createClient(SUPA_URL, SUPA_KEY);
    var inserted = 0;
    var dbRecs = toInsert.map(function(r) {
      return { address: r.address, lead_category:'fixmy', step:1, lead_source:'orphaned_list',
        original_installer: r.installer||null, install_year: r.install_year?parseInt(r.install_year):null,
        system_size: r.system_size_kw?parseFloat(r.system_size_kw):null, notes: r.notes||null, black_box:true };
    });
    for (var j = 0; j < dbRecs.length; j += 100) {
      var batch = dbRecs.slice(j, j+100);
      var res = await sc.from('customers').insert(batch).select();
      if (!res.error) {
        inserted += (res.data||[]).length;
        (res.data||[]).forEach(function(rec){ adminCustomers.unshift(rec); });
      }
      if (prog) prog.textContent = 'Importing… '+(Math.min(j+100, dbRecs.length))+'/'+dbRecs.length;
    }
    var done = '&#10003; '+inserted+' new leads imported!';
    if (dupeCount) done += ' ('+dupeCount+' already existed)';
    if (prog) prog.innerHTML = done;
    window._bbInsightsCache = null;
    setTimeout(function(){ adminCanvassLoadEnrichBar(); adminCanvassLoadInsights(); }, 500);
  };

  // ── Phase 0 AI Insights + Zip Expansion Status Panel ─────────────────────
  async function adminCanvassLoadPhase0Panel() {
    var el = document.getElementById('bbPhase0Panel');
    if (!el) return;
    try {
      var c2 = supabase.createClient(SUPA_URL, SUPA_KEY);
      var { data: rows } = await c2.from('pipeline_state')
        .select('key,value').in('key', ['phase0_insights','expansion_index','last_run_at','last_run_summary']);
      rows = rows || [];
      var insightsRow = rows.find(function(r){ return r.key === 'phase0_insights'; });
      var expRow = rows.find(function(r){ return r.key === 'expansion_index'; });
      var lastRunRow = rows.find(function(r){ return r.key === 'last_run_at'; });
      var lastSumRow = rows.find(function(r){ return r.key === 'last_run_summary'; });
      var expIndex = expRow ? (parseInt(expRow.value, 10) || 0) : 0;
      var totalExpZips = 84; // EXPANSION_QUEUE.length
      var h = '';

      // ── Last pipeline run timestamp + mini-summary ────────────────────────
      if (lastRunRow && lastRunRow.value) {
        var runDate = new Date(lastRunRow.value);
        var diffMs = Date.now() - runDate.getTime();
        var diffHrs = Math.floor(diffMs / 3600000);
        var diffMins = Math.floor((diffMs % 3600000) / 60000);
        var agoStr = diffHrs >= 24 ? Math.floor(diffHrs / 24) + 'd ago'
          : diffHrs >= 1 ? diffHrs + 'h ' + diffMins + 'm ago'
          : diffMins + 'm ago';
        h += '<div style="font-size:0.65rem;color:#555;margin-bottom:4px;text-align:right;">Last pipeline run: <span style="color:#8DC63F;">' + agoStr + '</span></div>';
        // Show last run results
        if (lastSumRow && lastSumRow.value) {
          var sumParsed = null;
          try { sumParsed = JSON.parse(lastSumRow.value); } catch(e) {}
          if (sumParsed) {
            var p2Color = sumParsed.phase2_owners_added > 0 ? '#8DC63F' : '#888';
            var p3Raw = String(sumParsed.phase3_tracerfy || '');
            var p3Color = p3Raw.indexOf('failed') !== -1 || p3Raw.indexOf('error') !== -1 || p3Raw.indexOf('credits') !== -1 ? '#ff6b6b' : '#8DC63F';
            var p3Short = p3Raw.length > 60 ? p3Raw.slice(0, 57) + '…' : p3Raw;
            h += '<div style="font-size:0.63rem;color:#666;margin-bottom:6px;text-align:right;">'
              + '<span style="margin-right:8px;">P1: <span style="color:#888;">' + (sumParsed.phase1_new_permits || 0) + ' permits</span></span>'
              + '<span style="margin-right:8px;">P2: <span style="color:' + p2Color + ';">' + (sumParsed.phase2_owners_added || 0) + ' owners</span></span>'
              + '<span>P3: <span style="color:' + p3Color + ';">' + p3Short + '</span></span>'
              + '</div>';
          }
        }
      } else {
        h += '<div style="font-size:0.65rem;color:#555;margin-bottom:6px;text-align:right;">Last pipeline run: <span style="color:#888;">Never run</span></div>';
      }

      // ── Zip expansion status chip ─────────────────────────────────────────
      var sdOnly = expIndex === 0;
      var expLabel = sdOnly
        ? 'San Diego County only'
        : 'San Diego County + ' + expIndex + ' extra zips (OC' + (expIndex > 53 ? ' + Riverside' : '') + ')';
      h += '<div style="background:rgba(74,158,255,0.06);border:1px solid rgba(74,158,255,0.2);border-radius:10px;padding:10px 14px;margin-bottom:8px;">';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">';
      h += '<div style="font-size:0.7rem;font-weight:700;color:#4a9eff;">&#128205; Coverage: ' + expLabel + '</div>';
      if (expIndex < totalExpZips) {
        h += '<div style="font-size:0.63rem;color:#555;">+5 zips added tonight (' + (totalExpZips - expIndex) + ' remaining)</div>';
      } else {
        h += '<div style="font-size:0.63rem;color:#8DC63F;">Fully expanded &#10003;</div>';
      }
      h += '</div></div>';

      // ── Phase 0 AI insights card ──────────────────────────────────────────
      if (insightsRow && insightsRow.value && insightsRow.value !== '{}') {
        var rawVal = insightsRow.value.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
        var parsed = null;
        try { parsed = JSON.parse(rawVal); } catch(e) {}
        if (parsed && parsed.summary) {
          h += '<div style="background:rgba(141,198,63,0.05);border:1px solid rgba(141,198,63,0.2);border-radius:10px;padding:10px 14px;">';
          h += '<div style="font-size:0.7rem;font-weight:700;color:#8DC63F;margin-bottom:6px;">&#129302; Tonight\'s Pipeline Intelligence</div>';
          h += '<div style="font-size:0.72rem;color:#ccc;margin-bottom:5px;">' + parsed.summary + '</div>';
          if (parsed.topOpportunity) {
            h += '<div style="font-size:0.68rem;color:#888;margin-bottom:3px;"><span style="color:#ffaa00;font-weight:700;">Top opportunity:</span> ' + parsed.topOpportunity + '</div>';
          }
          if (parsed.marketingAngle) {
            h += '<div style="font-size:0.68rem;color:#888;margin-bottom:3px;"><span style="color:#4a9eff;font-weight:700;">Marketing angle:</span> ' + parsed.marketingAngle + '</div>';
          }
          if (parsed.importInsight) {
            h += '<div style="font-size:0.68rem;color:#888;margin-bottom:3px;"><span style="color:#8DC63F;font-weight:700;">Import insight:</span> ' + parsed.importInsight + '</div>';
          }
          if (parsed.missingVariants && parsed.missingVariants.length) {
            h += '<div style="font-size:0.68rem;color:#555;margin-top:4px;">Try also: ' + parsed.missingVariants.join(', ') + '</div>';
          }
          h += '</div>';
        }
      }

      el.innerHTML = h || '';
    } catch(e) {
      // Phase 0 panel is non-critical — fail silently
    }
  }

  // ── Finance View — Commission Ledger + Ops Payouts ─────────────────────────

  async function updateCandidateStatus(id, status) {
    var hc = supabase.createClient(SUPA_URL, SUPA_KEY);
    var { error } = await hc.from('candidates').update({ status: status }).eq('id', id);
    if (error) { alert('Error updating status: ' + error.message); return; }
    var rec = hiringCandidates.find(function(c){ return c.id === id; });
    if (rec) rec.status = status;
  }

  function exportCandidatesCSV() {
    if (!hiringCandidates.length) { alert('No candidates to export.'); return; }
    var cols = ['first_name','last_name','email','phone','city','zip','sales_experience','why_solar','status','source','created_at'];
    var rows = [cols.join(',')];
    hiringCandidates.forEach(function(c) {
      rows.push(cols.map(function(k){ var v = c[k]||''; return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
    });
    var blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'candidates-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  }

  function renderPhotoGrid() {
    var grid = document.getElementById('photoGrid');
    if (!grid) return;
    var photos = jobPhotos[currentJobId] || [];

    if (!photos.length) {
      grid.innerHTML = '<div class="photo-empty-state">&#128247; No photos yet</div>';
      return;
    }

    // Group by AI label
    var groups = {};
    photos.forEach(function(p) {
      var k = p.label || 'Additional Photos';
      if (!groups[k]) groups[k] = [];
      groups[k].push(p);
    });

    // Sort groups by defined category order
    var keys = PHOTO_CATEGORIES.filter(function(cat) { return groups[cat]; });
    // Add any unexpected categories at the end
    Object.keys(groups).forEach(function(k) { if (keys.indexOf(k) === -1) keys.push(k); });
    var h = '<div class="photo-summary-bar">&#128247; ' + photos.length + ' photo' + (photos.length !== 1 ? 's' : '') + ' across ' + keys.length + ' categor' + (keys.length !== 1 ? 'ies' : 'y') + '</div>';

    keys.forEach(function(label) {
      var grp = groups[label];
      h += '<div class="photo-group">' +

  window._propExtractBill = async function(id, file) {
    var btn = document.getElementById('propBillUploadBtn');
    var statusEl = document.getElementById('propBillStatus');
    if (!file) return;
    if (btn) { btn.disabled = true; btn.textContent = 'Reading bill…'; }
    var base64 = await new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function(e){ resolve(e.target.result.split(',')[1]); };
      reader.readAsDataURL(file);
    });
    var isPdf = file.type === 'application/pdf';
    var contentBlock = isPdf
      ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64 } }
      : { type: 'image', source: { type: 'base64', media_type: file.type, data: base64 } };
    try {
      var resp = await fetch('/.netlify/functions/claude-vision', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 80,
          messages: [{ role: 'user', content: [
            contentBlock,
            { type: 'text', text: 'Extract the total monthly bill amount from this utility bill. Return ONLY this JSON: {"monthly_bill": <number or null>}. monthly_bill = TOTAL AMOUNT DUE for the current billing period.' }
          ]}]
        })
      });
      var data = await resp.json();
      var text = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text.trim() : '';
      var match = text.match(/"monthly_bill"\s*:\s*([\d.]+)/);
      var extracted = match ? parseFloat(match[1]) : null;
      if (extracted && extracted > 0) {
        if (statusEl) statusEl.textContent = 'Found $' + Math.round(extracted) + '/mo — saving…';
        await _propSaveBill(id, extracted);
      } else {
        if (btn) { btn.disabled = false; btn.textContent = '📄 Upload Utility Bill'; }
        if (statusEl) statusEl.innerHTML = 'Could not read amount. <a href="#" onclick="document.getElementById(\'propBillManualFallback\').style.display=\'flex\';return false;" style="color:#ffaa00;text-decoration:none;">Enter manually ▸</a>';
      }
    } catch(e) {
      if (btn) { btn.disabled = false; btn.textContent = '📄 Upload Utility Bill'; }
      if (statusEl) statusEl.textContent = 'Upload failed — try again';
    }
  };

  async function sendProposal(id, approvalRequest) {
    var modal = document.getElementById('proposalModal');
    var sendBtn = document.getElementById('propSendBtn');
    var statusEl = document.getElementById('propSaveStatus');
    // Derive service type from first selected catalog item
    var _stPrimary = (_propBuilds[0] && _propBuilds[0].lineItems.find(function(li){ return !li.isCustom; }));
    var _stCatRow  = _stPrimary && _propCatItems.find(function(r){ return r.option_key === _stPrimary.id; });
    var serviceType = (_stCatRow && _stCatRow.service_type) || (document.getElementById('prop_service_type')||{}).value || 'battery_retrofit';
    var insight = ((document.getElementById('propInsightText')||{}).value || '').trim() || null;

    if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = 'Saving…'; }

    // Build options from _propBuilds (menu builder state)
    var options = [];
    _propBuilds.forEach(function(build, optIdx) {
      if (!build.lineItems.length || !build.price) return;
      var price = build.price;
      var primaryItem = build.lineItems.find(function(li){ return !li.isCustom; });
      var partPriceEl = document.getElementById('propPartPrice_' + optIdx);
      var partPrice = partPriceEl ? (parseFloat(partPriceEl.value) || null) : (build.partPrice || null);
      var aImgEl  = document.getElementById('propAuroraImg_'   + optIdx);
      var aPortEl = document.getElementById('propAuroraPortal_'+ optIdx);
      var deposit = build.deposit || 0;
      var effectivePrice = partPrice || price;
      var milestones = {};
      if (deposit > 0) {
        milestones.deposit = deposit;
        var remaining = Math.round((effectivePrice - deposit) * 100) / 100;
        if (serviceType === 'inverter_swap' && primaryItem && primaryItem.id === 'bundle') {
          var half = Math.round(remaining / 2 * 100) / 100;
          milestones.permit = half; milestones.inspection = half;
        } else {
          milestones.remaining = remaining;
        }
      }
      var title = build.lineItems.length === 1
        ? build.lineItems[0].name
        : build.lineItems[0].name + ' + ' + (build.lineItems.length - 1) + ' more';
      var opt = {
        id: primaryItem ? primaryItem.id : ('custom_' + optIdx),
        title: title,
        subtitle: (primaryItem && primaryItem.subtitle) || '',
        description: (primaryItem && primaryItem.description) || build.lineItems.map(function(li){ return li.name; }).join(' · '),
        price: price,
        participate: build.participate,
        participate_price: partPrice,
        milestones: milestones,
        line_items: build.lineItems.map(function(li){ return { name: li.name, price: li.price, isCustom: !!li.isCustom }; })
      };
      if (build.teslaRebate) opt.tesla_rebate = build.teslaRebate;
      if (build.sdcpRebate)  opt.sdcp_rebate  = build.sdcpRebate;
      opt.aurora_image_url  = aImgEl  ? (aImgEl.value.trim()  || null) : null;
      opt.aurora_portal_url = aPortEl ? (aPortEl.value.trim() || null) : null;
      if (build.nonExport) opt.non_export = true;
      var redlineEl = document.getElementById('propRedline_' + optIdx);
      var redline = redlineEl ? (parseFloat(redlineEl.value) || 0) : (build.redline || 0);
      if (redline > 0) {
        var effCommPrice = partPrice != null ? partPrice : price;
        opt.rep_commission   = Math.round(Math.max(0, effCommPrice - redline) * 0.40 * 100) / 100;
        opt.gross_commission = Math.round(Math.max(0, effCommPrice - redline) * 100) / 100;
        opt.redline = redline;
      }
      options.push(opt);
    });

    if (!options.length) {
      if (statusEl) { statusEl.style.color = '#ef4444'; statusEl.textContent = 'Add at least one item to build first.'; }
      if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = '&#128228; Send to Customer'; }
      return;
    }

    // Sort options descending by price — most expensive = Option 1
    options.sort(function(a, b) { return b.price - a.price; });

    // Compute savings scenarios for each option (client-side math, stored with proposal)
    var custRec = adminCustomers.find(function(x){ return x.id === id; });
    var bill = parseFloat(custRec && custRec.monthly_bill) || 0;
    if (bill > 0) {
      var _savingsCfgs = [
        { key: 'conservative', offsetPct: 0.55, r: 0.05 },
        { key: 'moderate',     offsetPct: 0.75, r: 0.07 },
        { key: 'significant',  offsetPct: 0.90, r: 0.10 }
      ];
      options.forEach(function(opt, oIdx) {
        // Non-export systems can't sell back excess — reduce effective offset by 25%
        var exportFactor = opt.non_export ? 0.75 : 1.0;
        var scen = {};
        _savingsCfgs.forEach(function(s) {
          var monthly = Math.round(bill * s.offsetPct * exportFactor);
          var annual  = monthly * 12;
          var total20 = Math.round(annual * (Math.pow(1 + s.r, 20) - 1) / s.r);
          scen[s.key] = { monthly: monthly, annual: annual, total20yr: total20 };
        });
        opt.savings = scen;
      });
    }

    var commissionEstimate = options.reduce(function(sum, o){ return sum + (o.rep_commission || 0); }, 0);
    try {
      var client = supabase.createClient(SUPA_URL, SUPA_KEY);
      var proposal = { status: 'sent', created_at: new Date().toISOString(), options: options, accepted_option: null, financing: null, loan_term: null, approvalRequired: !!approvalRequest };
      if (insight) proposal.insight = insight;
      var custUpdate = { proposal: proposal };
      if (commissionEstimate > 0) custUpdate.commission_estimate = commissionEstimate;
      var { error } = await client.from('customers').update(custUpdate).eq('id', id);
      if (error) throw error;
      var verify = await client.from('customers').select('id,proposal').eq('id', id).limit(1);
      if (verify.error) throw verify.error;
      var saved = verify.data && verify.data[0] && verify.data[0].proposal;
      if (!saved) throw new Error('Proposal column may not exist — run: ALTER TABLE customers ADD COLUMN IF NOT EXISTS proposal jsonb;');
      var idx = adminCustomers.findIndex(function(x){ return x.id===id; });
      if (idx > -1) { adminCustomers[idx].proposal = proposal; if (commissionEstimate > 0) adminCustomers[idx].commission_estimate = commissionEstimate; }
      if (approvalRequest) {
        // Notify admin via GHL webhook instead of sending to customer
        await fetch(GHL_PROPOSAL_WEBHOOK, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ type: 'proposal_approval_request', customer_name: ((custRec&&custRec.first_name)||'') + ' ' + ((custRec&&custRec.last_name)||''), customer_id: id, rep_name: (typeof person !== 'undefined' ? person.name : 'Rep'), commission_note: 'Below $1,000 minimum — requires approval' }) }).catch(function(){});
        if (statusEl) statusEl.textContent = '⚠ Submitted for admin approval — not yet sent to customer.';
        if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = '⚠ Request Admin Approval'; }
        return;
      }
      if (statusEl) { statusEl.style.color = '#8DC63F'; statusEl.textContent = '✓ Proposal saved — customer can view via their magic link.'; }
      setTimeout(function(){ if (modal && modal.parentNode) modal.remove(); }, 1800);
    } catch(e) {
      if (statusEl) { statusEl.style.color = '#ef4444'; statusEl.textContent = '✗ ' + e.message; }
      if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = '&#128228; Send to Customer'; }
    }
  }

  // ── PROPOSAL MENU BUILDER HELPERS ─────────────────────────────────────────

  function _propInitBuild() {
    return { lineItems: [], price: 0, deposit: 0, participate: false, partPrice: null, teslaRebate: 0, sdcpRebate: 0, redline: 0, auroraImg: '', auroraPortal: '', nonExport: false };
  }

  window._propAddCatItem = function(catIdx, optIdx) {
    var row = _propCatItems[catIdx];
    if (!row || optIdx === undefined || !_propBuilds[optIdx]) return;
    var build = _propBuilds[optIdx];
    if (build.lineItems.some(function(li){ return li.id === row.option_key && !li.isCustom; })) return;
    var isFirst = !build.lineItems.some(function(li){ return !li.isCustom; });
    if (isFirst) {
      build.deposit     = parseFloat(row.deposit_amount) || 0;
      build.participate = !!row.participate;
      build.partPrice   = row.default_participate_price != null ? parseFloat(row.default_participate_price) : null;
      build.teslaRebate = parseFloat(row.tesla_rebate) || 0;
      // SDCP rebate only if customer zip is in SDCP territory
      var _sdcpCust = adminCustomers ? (adminCustomers.find(function(x){ return x.id===_propPropId; })||{}) : {};
      var _sdcpZipM = (_sdcpCust.address||'').match(/\b(\d{5})\b/);
      build.sdcpRebate  = (_sdcpZipM && typeof SDCP_ZIPS!=='undefined' && SDCP_ZIPS.has(_sdcpZipM[1]))
        ? (parseFloat(row.sdcp_rebate)||0) : 0;
    }
    build.lineItems.push({ id: row.option_key, name: row.title, subtitle: row.subtitle||'', description: row.description||'', price: parseFloat(row.default_price)||0, isCustom: false });
    window._propUpdateTotal(optIdx);
    window._propRenderBuilds();
  };

  window._propRemoveItem = function(optIdx, itemIdx) {
    if (!_propBuilds[optIdx]) return;
    _propBuilds[optIdx].lineItems.splice(itemIdx, 1);
    _propRecalcRedline(optIdx);
    window._propUpdateTotal(optIdx);
    window._propRenderBuilds();
  };

  window._propItemPrice = function(optIdx, itemIdx, val) {
    if (_propBuilds[optIdx] && _propBuilds[optIdx].lineItems[itemIdx] !== undefined) {
      _propBuilds[optIdx].lineItems[itemIdx].price = parseFloat(val) || 0;
      window._propUpdateTotal(optIdx);
    }
  };

  function _propRecalcRedline(optIdx) {
    var build = _propBuilds[optIdx];
    if (!build) return;
    build.redline = build.lineItems
      .filter(function(li){ return !li.isCustom; })
      .reduce(function(s, li){ return s + (parseFloat(li.price)||0); }, 0);
    if (build.price < build.redline) build.price = build.redline;
  }

  window._propUpdateTotal = function(optIdx) {
    var build = _propBuilds[optIdx];
    if (!build) return;
    _propRecalcRedline(optIdx);
    var el = document.getElementById('propOptTotal_' + optIdx);
    if (el) el.textContent = '$' + Math.round(build.price).toLocaleString('en-US');
  };

  window._propAddCustomLine = function(optIdx) {
    var nameEl  = document.getElementById('propCustName_'  + optIdx);
    var priceEl = document.getElementById('propCustPrice_' + optIdx);
    var name  = nameEl  ? nameEl.value.trim()  : '';
    var price = priceEl ? (parseFloat(priceEl.value) || 0) : 0;
    if (!name) { if (nameEl) nameEl.focus(); return; }
    if (!_propBuilds[optIdx]) return;
    _propBuilds[optIdx].lineItems.push({ id: null, name: name, price: price, isCustom: true });
    if (nameEl)  nameEl.value  = '';
    if (priceEl) priceEl.value = '';
    window._propUpdateTotal(optIdx);
    window._propRenderBuilds();
  };

  window._propAddOption = function() {
    _propBuilds.push(_propInitBuild());
    window._propRenderBuilds();
  };

  window._propToggleAdvanced = function(optIdx) {
    _propOpenAdvanced[optIdx] = !_propOpenAdvanced[optIdx];
    _propRenderBuilds();
  };

  window._propToggleCatCard = function(catIdx, optIdx) {
    var build = _propBuilds[optIdx];
    if (!build) return;
    var item = _propCatItems[catIdx];
    var existingIdx = -1;
    build.lineItems.forEach(function(li, i){ if (li.id === item.option_key && !li.isCustom) existingIdx = i; });
    if (existingIdx >= 0) { _propRemoveItem(optIdx, existingIdx); } else { _propAddCatItem(catIdx, optIdx); }
  };

  window._propRenderBuilds = function() {
    var container = document.getElementById('propBuilderBuilds');
    if (!container) return;
    var h = '';
    var _propBuildCust = (typeof adminCustomers !== 'undefined' && adminCustomers) ? (adminCustomers.find(function(x){ return x.id===_propPropId; })||{}) : {};
    var _propBuildAddr = (_propBuildCust.address||'').replace(/'/g,"\\'");
    // Show "Load previous" button when a saved proposal exists
    if (_propExisting) {
      h += '<div style="background:rgba(255,170,0,0.06);border:1px solid rgba(255,170,0,0.25);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;">'+
        '<span style="font-size:0.72rem;color:#ffaa00;">Previous proposal available</span>'+
        '<button onclick="_propRestoreExisting()" style="font-size:0.72rem;padding:4px 12px;background:rgba(255,170,0,0.15);border:1px solid rgba(255,170,0,0.4);border-radius:6px;color:#ffaa00;cursor:pointer;font-weight:700;">&#8635; Load Previous</button>'+
      '</div>';
    }
    _propBuilds.forEach(function(build, optIdx) {
      var alpha = String.fromCharCode(65 + optIdx);
      h += '<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px;margin-bottom:10px;">';

  // Google Solar API — project panel lat/lng to pixel coords on a Static Maps image
  function _solarProject(panelLat, panelLng, cLat, cLng, zoom, imgW, imgH) {
    var scale = 256 * Math.pow(2, zoom);
    var toX = function(lng) { return (lng / 360 + 0.5) * scale; };
    var toY = function(lat) {
      var s = Math.sin(lat * Math.PI / 180);
      return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * scale;
    };
    return { x: imgW / 2 + toX(panelLng) - toX(cLng), y: imgH / 2 + toY(panelLat) - toY(cLat) };
  }

    _propRenderBuilds();

      var resp = await fetch('/.netlify/functions/google-solar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address: address })
      });
      var data = await resp.json();
      _propSolarData = (!resp.ok || data.error) ? { error: data.error || 'Solar API error' } : data;
    } catch(e) {
      _propSolarData = { error: 'Connection error — try again' };
    }
    _propRenderBuilds();
  };

  async function acceptProposal(custId, optionId, financing, loanTerm) {
    try {
      var client = supabase.createClient(SUPA_URL, SUPA_KEY);
      var resp = await client.from('customers').select('proposal,first_name,last_name,email,phone').eq('id', custId).limit(1);
      var data = resp.data && resp.data[0];
      if (!data) return;
      var prop = data.proposal ? (typeof data.proposal==='string' ? JSON.parse(data.proposal) : data.proposal) : {};
      var opt = (prop.options||[]).find(function(o){ return o.id===optionId; });
      if (!opt) return;
      prop.status = 'accepted'; prop.accepted_option = optionId; prop.financing = financing; prop.loan_term = loanTerm;
      var price = (optionId==='bundle' && (financing==='participate'||financing==='prepaid')) ? opt.participate_price : opt.price;
      await client.from('customers').update({ proposal: prop }).eq('id', custId);
      fetch(GHL_PROPOSAL_WEBHOOK, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          email: data.email||'', full_name: ((data.first_name||'')+' '+(data.last_name||'')).trim(),
          phone: data.phone||'', proposal_option: optionId, proposal_label: opt.title,
          proposal_amount: price, financing: financing||'cash', loan_term: loanTerm||null,
          milestone_deposit: opt.milestones.deposit, milestone_remaining: opt.milestones.remaining||null, milestone_permit: opt.milestones.permit||null, milestone_inspection: opt.milestones.inspection||null
        })
      }).catch(function(e){ console.warn('GHL proposal:', e); });
      var wrap = document.getElementById('proposalWrap');
      if (wrap) wrap.innerHTML =
        '<div style="background:rgba(141,198,63,0.08);border:1px solid rgba(141,198,63,0.3);border-radius:16px;padding:32px;text-align:center;">'+
          '<div style="font-size:2.5rem;margin-bottom:12px;">&#9989;</div>'+
          '<div style="font-weight:700;color:#8DC63F;font-size:1.1rem;margin-bottom:10px;">Proposal Accepted!</div>'+
          '<div style="font-size:0.83rem;color:#aaa;line-height:1.8;">Thank you for choosing <strong style="color:#fff;">'+opt.title+'</strong>.<br>'+
            'Our team will reach out within 24 hours to confirm next steps and collect your $'+parseFloat(opt.milestones.deposit).toLocaleString()+'deposit.</div>'+
        '</div>';
    } catch(e) { alert('Error: '+e.message); }
  }

  // ── DIAGNOSTIC FEE MODAL ──────────────────────────────────────────────────
  var _diagPendingUpdates = null;

  var DIAG_COMM_MAX = 800;
  function calcDiagCommission(fee) {
    var base = 250;
    var raw = fee > base ? Math.round((fee - base) * 0.40 * 100) / 100 : 0;
    return Math.min(raw, DIAG_COMM_MAX);
  }
  function diagCommIsCapped(fee) {
    var base = 250;
    return fee > base && (fee - base) * 0.40 > DIAG_COMM_MAX;
  }

  window.propCalcComm = function(i) {
    var priceEl   = document.getElementById('prop_price_'+i);
    var partEl    = document.getElementById('prop_part_'+i);
    var redlineEl = document.getElementById('propRedline_'+i);
    var grossEl   = document.getElementById('propGrossComm_'+i);
    var repEl     = document.getElementById('propRepComm_'+i);
    var commDiv   = document.getElementById('propComm_'+i);
    var warnEl    = document.getElementById('propCommWarn_'+i);
    if (!priceEl || !repEl) return;
    var purchasePrice = parseFloat(priceEl.value) || 0;
    var partPrice     = partEl ? (parseFloat(partEl.value) || null) : null;
    var redline       = redlineEl ? (parseFloat(redlineEl.value) || 0) : 0;
    var minComm       = commDiv ? (parseFloat(commDiv.dataset.minComm) || 0) : 0;
    var maxComm       = commDiv ? (parseFloat(commDiv.dataset.maxComm) || 0) : 0;
    function capComm(raw) { return maxComm > 0 ? Math.min(raw, maxComm) : raw; }
    function maxTag(raw)  { return maxComm > 0 && raw > maxComm ? ' <span style="font-size:0.65rem;color:#f59e0b;">(max)</span>' : ''; }
    var grossCash = Math.max(0, purchasePrice - redline);
    var repCashRaw = Math.round(grossCash * 0.40 * 100) / 100;
    var repCash    = capComm(repCashRaw);
    var repPart    = null;
    if (partPrice !== null && partPrice > 0) {
      var grossPart  = Math.max(0, partPrice - redline);
      var repPartRaw = Math.round(grossPart * 0.40 * 100) / 100;
      repPart = capComm(repPartRaw);
      if (grossEl) grossEl.innerHTML =
        '$'+grossCash.toFixed(2)+' <span style="font-size:0.65rem;color:#666;">(cash)</span>'+
        ' &nbsp;·&nbsp; $'+grossPart.toFixed(2)+' <span style="font-size:0.65rem;color:#666;">(finance)</span>';
      repEl.innerHTML =
        '$'+repCash.toFixed(2)+maxTag(repCashRaw)+' <span style="font-size:0.72rem;color:#888;">(cash)</span>'+
        ' &nbsp;·&nbsp; $'+repPart.toFixed(2)+maxTag(repPartRaw)+' <span style="font-size:0.72rem;color:#888;">(finance)</span>';
    } else {
      if (grossEl) grossEl.textContent = '$'+grossCash.toFixed(2);
      repEl.innerHTML = '$'+repCash.toFixed(2)+maxTag(repCashRaw);
    }
    if (warnEl && minComm > 0) {
      var lowest = repPart !== null ? Math.min(repCash, repPart) : repCash;
      warnEl.style.display = lowest < minComm ? 'flex' : 'none';
    }
  };

  async function confirmDiagFee() {
    var fee = window._diagSelectedFee || 349;
    var pending = _diagPendingUpdates;
    if (!pending) return;
    var c = adminCustomers.find(function(x){ return x.id===pending.id; });
    if (!c) return;
    var comm = calcDiagCommission(fee);

    // Generate sign token (72hr expiry)
    var signToken = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : (Math.random().toString(36).slice(2) + Date.now().toString(36));
    var signExpiry = new Date(Date.now() + 72 * 60 * 60 * 1000).toISOString();

    // Merge fee + sign token into the pending updates
    pending.updates.invoice_amount = fee;
    pending.updates.invoice_status = 'sent';
    pending.updates.sign_token = signToken;
    pending.updates.sign_token_expires_at = signExpiry;

    try {
      var client = supabase.createClient(SUPA_URL, SUPA_KEY);
      var { error } = await client.from('customers').update(pending.updates).eq('id', pending.id);
      if (error) throw error;
      var idx = adminCustomers.findIndex(function(x){ return x.id===pending.id; });
      if (idx > -1) adminCustomers[idx] = Object.assign(adminCustomers[idx], pending.updates);

      // Fire GHL Agreement webhook (for CRM contact sync)
      var payload = {
        firstName:      c.first_name||'',
        lastName:       c.last_name||'',
        full_name:      ((c.first_name||'')+' '+(c.last_name||'')).trim(),
        email:          c.email||'',
        phone:          c.phone||'',
        address1:       c.address||'',
        diagnostic_fee: fee,
        rep_name:       c.setter_name||'',
        source:         'Diagnostic Fee Set',
        signLink:       'https://fixmy.energy/sign?t=' + signToken,
        customField: {
          diagnostic_fee: fee,
          invoice_amount: fee,
          rep_commission: comm,
          rep_name:       c.setter_name||''
        }
      };
      fetch('/.netlify/functions/ghl-diag-agreement', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
        .then(function(r){ return r.json(); })
        .then(function(d){
          var ok = !!(d.success || (d.ghlStatus >= 200 && d.ghlStatus < 300));
          var smsOk = d.smsStatus >= 200 && d.smsStatus < 300;
          var smsTxt = d.smsStatus ? (smsOk ? ' · SMS ✓' : ' · SMS ✗ (' + d.smsStatus + ')') : ' · SMS not sent';
          var b = document.createElement('div');
          b.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;z-index:99999;font-size:0.8rem;font-weight:700;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,0.5);background:'+(ok?'#1e2a14':'#2a1414')+';border:1px solid '+(ok?'rgba(141,198,63,0.4)':'rgba(239,68,68,0.4)')+';color:'+(ok?'#8DC63F':'#ef4444')+';';
          b.textContent = ok ? '⚡ GHL synced' + smsTxt : '❌ GHL error: '+(d.error||JSON.stringify(d).slice(0,80));
          document.body.appendChild(b);
          setTimeout(function(){ b.remove(); }, 8000);
        })
        .catch(function(e){ console.warn('GHL diag-agreement proxy error:', e); });

      document.getElementById('diagFeeModal').remove();
      _diagPendingUpdates = null;
      closeLeadEditor();
      renderAdminView(adminView);

      // Show shareable Sign & Pay link popup
      var signLink = 'https://fixmy.energy/sign?t=' + signToken;
      var custName = ((c.first_name||'') + ' ' + (c.last_name||'')).trim();
      showSignPayLink(signLink, custName, fee);
    } catch(e) { alert('Save failed: '+e.message); }
  }

  function edSelect(label,id,val,options){ var opts=options.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]==val?' selected':'')+'>'+o[1]+'</option>'; }).join(''); return '<div><label class="ed-label">'+label+'</label><select id="'+id+'" class="ed-input">'+opts+'</select></div>'; }

  function updateMilestoneFee(n) {
    var amtEl = document.getElementById('edM'+n+'Amt');
    var methodEl = document.getElementById('edM'+n+'Method');
    var feeEl = document.getElementById('edM'+n+'Fee');
    if (!amtEl || !methodEl || !feeEl) return;
    var base = parseFloat(amtEl.value);
    if (!base || isNaN(base)) { feeEl.textContent = ''; return; }
    var rates = {card:0.03, ach:0.01, check:0};
    var rate = rates[methodEl.value] || 0.03;
    var total = (base * (1 + rate)).toFixed(2);
    var fee = (base * rate).toFixed(2);
    feeEl.textContent = rate > 0 ? 'Customer pays: $'+Number(total).toLocaleString()+' (incl. $'+Number(fee).toLocaleString()+' fee)' : 'Customer pays: $'+Number(base).toLocaleString()+' (no fee)';
  }

      '<button id="ttRemSend" style="flex:1;padding:10px;background:rgba(74,158,255,0.15);border:1px solid rgba(74,158,255,0.4);border-radius:10px;color:#4a9eff;cursor:pointer;font-size:0.8rem;font-weight:700;">&#128241; Send Now</button>'+
      '</div>'+
      '<div id="ttRemStatus" style="margin-top:10px;font-size:0.75rem;text-align:center;min-height:18px;"></div>'+

    if (!isNSSave && !isAutoSave && stepVal === 5 && (cRec.step||1) < 5) {
      (async function(){
        try {
          var c5 = supabase.createClient(SUPA_URL, SUPA_KEY);
          await c5.from('customers').update(updates).eq('id', id);
          var idx5 = adminCustomers.findIndex(function(x){ return x.id===id; });
          if (idx5>-1) adminCustomers[idx5] = Object.assign(adminCustomers[idx5], updates);
        } catch(e) { console.error('step-5 save:', e); }
        var em = document.getElementById('editLeadModal'); if (em) em.remove();
        openProposalBuilder(id);
      })();
      return;
    }
    if (isFixMySave && stepVal === 7 && (cRec.step||1) !== 7) updates.archived = true;
    if (isTTSave && (document.getElementById('edTTDisposition')||{}).value === 'dead') updates.archived = true;
    try {
      var client=supabase.createClient(SUPA_URL,SUPA_KEY);
      var { error }=await client.from('customers').update(updates).eq('id',id);
      if (error) throw error;
      var idx=adminCustomers.findIndex(function(x){return x.id===id;});
      if (idx>-1) adminCustomers[idx]=Object.assign(adminCustomers[idx],updates);
      // Update GHL appointment if diagnostic date changed and we have an existing appointment ID
      if (!isAutoSave && isFixMySave && cRec.ghl_appointment_id && diagDate && diagDate !== cRec.diagnostic_date && GHL_DIAG_CALENDAR_ID) {
        var _resDt = diagDate ? diagDate.slice(0,10) : null;
        var _resTm = diagDate ? diagDate.slice(11,16) : null;
        if (_resDt && _resTm) {
          fetch('/.netlify/functions/ghl-calendar', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ calendarId: GHL_DIAG_CALENDAR_ID, firstName: updates.first_name||cRec.first_name||'', lastName: updates.last_name||cRec.last_name||'', email: updates.email||cRec.email||'', phone: updates.phone||cRec.phone||'', address: updates.address||cRec.address||'', appointmentDate: _resDt, appointmentTime: _resTm, updateAppointmentId: cRec.ghl_appointment_id })
          }).catch(function(e){ console.warn('GHL reschedule update:', e); });
        }
      }
      // Fire GHL trigger for Top Tier step changes
      if (leadCatVal === 'top_tier' && stepVal !== (cRec.step||1)) {
        var ttTrigger = null;
        if (stepVal === 2) ttTrigger = 'top_tier_confirmed';
        else if (stepVal === 5) ttTrigger = 'top_tier_follow_up';
        else if (stepVal === 7) {
          var ttDisp = (document.getElementById('edTTDisposition')||{}).value || 'dead';
          ttTrigger = ttDisp === 'missed' ? 'top_tier_missed' : ttDisp === 'no_sign' ? 'top_tier_follow_up' : 'top_tier_dead';
        }
        if (ttTrigger) {
          fetch('/.netlify/functions/ghl-calendar', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ trigger: ttTrigger, firstName: updates.first_name||cRec.first_name, lastName: updates.last_name||cRec.last_name, email: updates.email||cRec.email, phone: updates.phone||cRec.phone, address: updates.address||cRec.address, diagnosticDate: ttTrigger === 'top_tier_missed' ? (cRec.diagnostic_date||null) : undefined })
          }).catch(function(e){ console.warn('GHL TT trigger:', e); });
        }
      }
      // Fire GHL nurture sequence when a FixMy lead moves to step 7 (Not Sold / Dead)
      if (isFixMySave && stepVal === 7 && (cRec.step||1) !== 7) {
        var nurtureFirst = updates.first_name||cRec.first_name||null;
        var nurtureLast = updates.last_name||cRec.last_name||null;
        fetch('/.netlify/functions/ghl-diag-agreement', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            firstName: nurtureFirst, lastName: nurtureLast,
            full_name: ((nurtureFirst||'') + ' ' + (nurtureLast||'')).trim() || null,
            email: updates.email||cRec.email||null,
            phone: updates.phone||cRec.phone||null,
            address1: updates.address||cRec.address||null,
            source: 'Not Sold — Nurture Enrolled',
            tags: ['not-sold-nurture','30-day-follow-up'],
            customField: { rep_name: updates.rep_id||cRec.rep_id||null }
          })
        }).catch(function(e){ console.warn('Nurture trigger:', e); });
      }
      var savedEl=document.getElementById('edSaved');
      if (isAutoSave) {
        if (savedEl) { savedEl.textContent='✓ Saved'; savedEl.style.color='#8DC63F'; savedEl.style.display='inline'; }
        setTimeout(function(){ var el=document.getElementById('edSaved'); if(el) el.style.display='none'; }, 2000);
      } else {
        if (savedEl) savedEl.style.display='inline';
        if (diagConverting) {
          setTimeout(function(){ var el=document.getElementById('edSaved'); if(el) el.style.display='none'; openDiagSchedulingModal(id, Object.assign({}, cRec, updates)); }, 1200);
        } else {
          setTimeout(function(){ var el=document.getElementById('edSaved'); if(el) el.style.display='none'; closeLeadEditor(); renderAdminView(adminView); }, 1500);
        }
      }
    } catch(e) { if (!isAutoSave) alert('Save failed: '+e.message); else console.warn('Auto-save failed:', e.message); }
  }

  async function confirmDiagSchedule(id, rec) {
    var opsVal        = (document.getElementById('dsOps')||{}).value || null;
    var dateVal       = (document.getElementById('dsDate')||{}).value || null;
    var startTimeVal  = (document.getElementById('dsArrivalStart')||{}).value || null;
    var endTimeVal    = (document.getElementById('dsArrivalEnd')||{}).value || null;
    var notesVal      = (document.getElementById('dsNotes')||{}).value.trim() || null;
    if (!dateVal) { alert('Please select a date.'); return; }
    if (!startTimeVal || !endTimeVal) { alert('Please set both arrival window start and end times.'); return; }

    // Format date as "Friday, May 23"
    var dateObj = new Date(dateVal + 'T12:00:00');
    var formattedDate = dateObj.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

    // Format times as "10:00 AM"
    function fmtTime(t) {
      var parts = t.split(':'); var h = parseInt(parts[0]); var m = parts[1];
      var ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
      return h + (m !== '00' ? ':' + m : '') + ' ' + ampm;
    }
    var arrivalWindow = fmtTime(startTimeVal) + ' – ' + fmtTime(endTimeVal);
    var diagISO = new Date(dateVal + 'T' + startTimeVal).toISOString();

    var updates = { diagnostic_date: diagISO, arrival_end: new Date(dateVal + 'T' + endTimeVal).toISOString(), arrival_window: arrivalWindow, step: 3 };
    if (opsVal) updates.assigned_ops = opsVal;
    try {
      var client = supabase.createClient(SUPA_URL, SUPA_KEY);
      var { error } = await client.from('customers').update(updates).eq('id', id);
      if (error) throw error;
      var idx = adminCustomers.findIndex(function(x){ return x.id === id; });
      if (idx > -1) adminCustomers[idx] = Object.assign(adminCustomers[idx], updates);
      // Fire customer notification webhook
      if (GHL_DIAG_SCHEDULE_WEBHOOK) {
        fetch(GHL_DIAG_SCHEDULE_WEBHOOK, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ trigger: 'diag_scheduled', firstName: rec.first_name||'', lastName: rec.last_name||'', email: rec.email||'', phone: rec.phone||'', address: rec.address||'', appointmentDate: formattedDate, arrivalWindow: arrivalWindow, diagnosticDate: diagISO, opsPartner: opsVal||'', notes: notesVal||'' })
        }).catch(function(e){ console.warn('Diag schedule webhook:', e); });
      }
      // Book appointment in GHL Diagnostic Calendar (enables Appointment Status trigger + smart reminders)
      if (GHL_DIAG_CALENDAR_ID) {
        try {
          var ghlCalResp = await fetch('/.netlify/functions/ghl-calendar', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              calendarId: GHL_DIAG_CALENDAR_ID,
              firstName: rec.first_name||'', lastName: rec.last_name||'',
              email: rec.email||'', phone: rec.phone||'', address: rec.address||'',
              appointmentDate: dateVal, appointmentTime: startTimeVal,
              appointmentEndTime: endTimeVal
            })
          });
          var ghlCalData = await ghlCalResp.json();
          if (ghlCalData && ghlCalData.appointmentId) {
            await client.from('customers').update({ ghl_appointment_id: ghlCalData.appointmentId }).eq('id', id);
            var _apptIdx = adminCustomers.findIndex(function(x){ return x.id === id; });
            if (_apptIdx > -1) adminCustomers[_apptIdx].ghl_appointment_id = ghlCalData.appointmentId;
          }
        } catch(e) { console.warn('GHL diag calendar booking:', e); }
      }
      // Admin notification: always fire with GHL_TT_WEBHOOK as fallback (notify Dennis via GHL)
      var adminWebhook = window.GHL_ADMIN_WEBHOOK || GHL_TT_WEBHOOK || null;
      if (adminWebhook) {
        fetch(adminWebhook, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ trigger: 'admin_diag_scheduled', firstName: rec.first_name||'', lastName: rec.last_name||'', address: rec.address||'', diagnosticDate: diagISO, opsPartner: opsVal||'', notes: notesVal||'' })
        }).catch(function(e){ console.warn('Admin diag webhook:', e); });
      }
      document.getElementById('diagSchedModal').remove();
      closeLeadEditor();
      renderAdminView(adminView);
    } catch(e) { alert('Schedule save failed: '+e.message); }
  }

    var input = document.getElementById('nlAddr');

    nlPlacesInit = true;
    var ac = new google.maps.places.Autocomplete(input,{types:['address'],componentRestrictions:{country:'us'}});
    ac.addListener('place_changed',function(){
      var place=ac.getPlace(); if(!place.geometry) return;
      var fa=place.formatted_address||input.value;
      // Extract postal_code from address_components — formatted_address often omits it
      if(place.address_components){
        var pc=(place.address_components.find(function(c){return c.types.indexOf('postal_code')>=0;})||{}).short_name;
        if(pc && fa.indexOf(pc)===-1) fa=fa.replace(/,\s*USA\s*$/i,', '+pc+', USA');
      }
      input.value=fa;
      var lat=place.geometry.location.lat(); var lng=place.geometry.location.lng();
      loadNlSatellite(fa); loadNlSolar(lat,lng); checkTitleOwner(fa,lat,lng);
    });

  async function checkTitleOwner(address, lat, lng) {
    var wrap = document.getElementById('nlTitleWrap');
    var body = document.getElementById('nlTitleBody');
    if (!wrap || !body || !address) return;
    wrap.style.display = 'block';
    body.innerHTML = '<span style="font-size:0.75rem;color:#888;">Checking parcel data…</span>';
    document.getElementById('nlTitleOwner').value = '';
    document.getElementById('nlTitleApn').value   = '';
    document.getElementById('nlTitleConfirmed').value = '';
    var owner = null, apn = null, sourceLabel = '', debugInfo = null;
    var sourceLabels = { regrid_latlon: 'Regrid', regrid_search: 'Regrid', regrid_typeahead: 'Regrid', sandag: 'SANDAG Parcels', sandag_south: 'SANDAG Parcels', sd_city: 'SD City GIS', sd_county: 'SD County GIS' };
    try {
      var payload = { address: address };
      if (lat != null && lng != null) { payload.lat = lat; payload.lng = lng; }
      var rgResp = await fetch('/.netlify/functions/regrid-lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (rgResp.ok) {
        var rgData = await rgResp.json();
        if (rgData.owner) {
          owner       = rgData.owner;
          apn         = rgData.apn || null;
          sourceLabel = sourceLabels[rgData.source] || 'Parcel Data';
        }
        debugInfo = rgData.debug || null;
      }
    } catch(e) {
      body.innerHTML = '<span style="font-size:0.75rem;color:#ef4444;">Lookup error: ' + (e.message||'unknown') + '</span>';
      return;
    }
    if (owner) {
      document.getElementById('nlTitleOwner').value = owner;
      document.getElementById('nlTitleApn').value   = apn || '';
      body.innerHTML =
        '<div style="font-size:0.82rem;font-weight:700;color:#F3EDE3;margin-bottom:6px;">' + owner + '</div>' +
        (apn ? '<div style="font-size:0.68rem;color:#666;margin-bottom:8px;">APN: ' + apn +

        '</div>';
    } else {
      body.innerHTML = '<span style="font-size:0.75rem;color:#666;">No parcel record found — verify manually with <a href="https://landglide.com" target="_blank" style="color:#4a9eff;">LandGlide</a>.</span>'+(debugInfo?'<div style="margin-top:6px;font-size:0.62rem;color:#444;word-break:break-all;">'+debugInfo+'</div>':'');

  // ── Notes activity log helpers ───────────────────────────────────────────────────────────────
  function _parseNotes(raw) {
    if (!raw) return [];
    if (raw.trim().charAt(0) === '[') { try { return JSON.parse(raw); } catch(e) {} }
    return [{ ts: null, by: 'Legacy', text: raw }];
  }
  function _appendNote(existingRaw, by, text) {
    var entries = _parseNotes(existingRaw);
    entries.push({ ts: new Date().toISOString(), by: by, text: text });
    return JSON.stringify(entries);
  }
  function _renderNotesLog(entries) {
    if (!entries || !entries.length) return '<div style="font-size:0.8rem;color:#555;padding:12px 14px;">No notes yet.</div>';
    return entries.slice().reverse().map(function(e) {
      var dateStr = e.ts ? new Date(e.ts).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}) : 'Prior to log';
      var by = e.by || 'Unknown';
      var isAdmin = by.toLowerCase().indexOf('admin') > -1;
      var isSetter = by.toLowerCase().indexOf('setter') > -1;
      var badgeColor = isAdmin ? '#4a9eff' : isSetter ? '#8DC63F' : '#aaa';
      var borderColor = isAdmin ? 'rgba(74,158,255,0.25)' : isSetter ? 'rgba(141,198,63,0.25)' : 'rgba(255,255,255,0.1)';
      return '<div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.07);border-left:3px solid '+borderColor+';">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">'+
          '<span style="font-size:0.72rem;font-weight:700;color:'+badgeColor+';">'+by+'</span>'+
          '<span style="color:#444;font-size:0.68rem;">'+dateStr+'</span>'+
        '</div>'+
        '<div style="color:#e0e0e0;font-size:0.82rem;line-height:1.65;white-space:pre-wrap;">'+e.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/ \| /g,'\n')+'</div>'+
      '</div>';
    }).join('');
  }
  async function addEditorNote() {
    var idEl = document.getElementById('edId');
    var inputEl = document.getElementById('edNoteInput');
    var logDiv = document.getElementById('edNotesLog');
    if (!idEl || !inputEl) return;
    var text = inputEl.value.trim();
    if (!text) return;
    var id = idEl.value;
    var rec = adminCustomers.find(function(x){ return x.id===id; });
    var newNotes = _appendNote(rec ? rec.notes : null, 'Admin', text);
    try {
      var client = supabase.createClient(SUPA_URL, SUPA_KEY);
      var { error } = await client.from('customers').update({ notes: newNotes }).eq('id', id);
      if (error) throw error;
      if (rec) rec.notes = newNotes;
      inputEl.value = '';
      if (logDiv) logDiv.innerHTML = _renderNotesLog(_parseNotes(newNotes));
    } catch(e) { alert('Failed to save note: '+e.message); }
  }

  function edResendInvoice(id) {
    var c = adminCustomers.find(function(x){ return x.id === id; });

    // sign_token may be stale in memory — do a fresh DB fetch if needed
    if (!c.sign_token && !c.invoice_url) {

        var tok = res.data && res.data.sign_token;
        if (tok) {
          c.sign_token = tok;
          var idx = adminCustomers.findIndex(function(x){ return x.id === id; });
          if (idx > -1) adminCustomers[idx].sign_token = tok;
          edResendInvoice(id);

          alert('No invoice URL on file — add one in the Invoice section below first.');

      });

    }
    // Sign & Pay lead — copy the sign link instead of invoice_url
    if (c.sign_token) {

  async function loadUploadStatus(custId){
    if(!custId) return;
    try{
      var client=supabase.createClient(SUPA_URL,SUPA_KEY);
      // Check both uploads table and job_photos for status
      var resp=await client.from('job_photos')
        .select('label,quality_flag,quality_note')
        .eq('customer_id',String(custId))
        .eq('uploaded_by','customer');
      if(resp.data && resp.data.length){
        // Map labels back to upload card types
        var labelToType={'Utility Bill':'bill','Main Panel':'panel','Inverter':'inverter'};
        resp.data.forEach(function(p){
          var type=labelToType[p.label];
          if(!type) return;
          var el=document.getElementById('ust-'+type);
          if(!el) return;
          if(p.quality_flag==='good'){
            el.textContent='✓ Uploaded';
            el.className='upload-status ok';
          } else if(p.quality_flag==='needs_retake'){
            el.innerHTML='⚠ Needs Retake<br><span style="font-size:0.65rem;font-weight:400;">'+p.quality_note+'</span>';
            el.style.cssText='background:rgba(255,170,0,0.12);color:#ffaa00;border-radius:6px;padding:6px 10px;line-height:1.5;display:inline-block;font-size:0.72rem;font-weight:600;';
          } else {
            el.textContent='✓ Uploaded';
            el.className='upload-status ok';
          }
        });
      }
    }catch(e){ console.warn('loadUploadStatus error:', e); }
  }

  async function handleUpload(type,input){
    if(!input.files||!input.files[0]||!currentUser) return;
    var el=document.getElementById('ust-'+type);
    if(el){el.textContent='Uploading...';el.className='upload-status';}
    try{
      var client=supabase.createClient(SUPA_URL,SUPA_KEY);
      var file=input.files[0];
      var safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      var custId=String(currentUser.id||'anon');

      // Map upload type to Quoya category
      var categoryMap = {
        'bill':     'Utility Bill',
        'inverter': 'Inverter',
        'serial':   'Inverter',
        'panel':    'Main Panel'
      };
      var category = categoryMap[type] || 'Additional Photos';

      // 1 — Upload to job_photos storage bucket
      var path='jobs/'+custId+'/customer_'+type+'_'+Date.now()+'_'+safeName;
      var {data,error}=await client.storage.from('job_photos').upload(path,file,{upsert:true});
      if(error){if(el) el.textContent='Error: '+(error.message||'Upload failed');return;}

      // 2 — Get public URL
      var publicUrl=client.storage.from('job_photos').getPublicUrl(path).data.publicUrl;

      // 3 — Run Quoya AI label + quality check
      if(el){el.textContent='Quoya reviewing...';el.className='upload-status';}
      var aiResult = await quoyaAssessPhoto(file, category);

      // 4 — Write to job_photos table (visible to all roles)
      await client.from('job_photos').insert({
        job_id:       custId,
        customer_id:  custId,
        url:          publicUrl,
        path:         path,
        label:        aiResult.label,
        uploaded_by:  'customer',
        quality_flag: aiResult.flag,
        quality_note: aiResult.note
      });

      // Notify assigned rep via SMS (fire-and-forget)
      var _custName = ((currentUser.first_name||'')+' '+(currentUser.last_name||'')).trim() || 'A customer';
      fetch('/.netlify/functions/notify-photo-upload', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ customerId: custId, customerName: _custName })
      }).catch(function(){});

      // Advance lead disposition to "Photos Uploaded" (step 2) on first upload
      if ((parseInt(currentUser.step)||1) < 2) {
        fetch(SUPA_URL + '/rest/v1/customers?id=eq.' + custId, {
          method: 'PATCH',
          headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
          body: JSON.stringify({ step: 2 })
        }).catch(function(){});
        currentUser.step = 2;
      }


      // 6 — Show result with quality feedback
      if(el){
        if(aiResult.flag === 'good'){
          el.textContent='✓ Uploaded';
          el.className='upload-status ok';
        } else {
          el.innerHTML='⚠ Needs Retake<br><span style="font-size:0.65rem;color:#ffaa00;font-weight:400;">'+aiResult.note+'</span>';
          el.className='upload-status';
          el.style.background='rgba(255,170,0,0.12)';
          el.style.color='#ffaa00';
          el.style.borderRadius='6px';
          el.style.padding='6px 10px';
          el.style.lineHeight='1.5';
        }
      }

    }catch(e){if(el) el.textContent='Failed: '+(e.message||'Unknown error');}
  }

  async function loadSolarData(address){
    if(!address||address==='--') return;
    var wrap=null; for(var t=0;t<10;t++){wrap=document.getElementById('solarWrap');if(wrap) break;await new Promise(function(r){setTimeout(r,200);});}
    if(!wrap) return;
    wrap.innerHTML='<div class="card" style="margin-top:16px;"><strong>&#9728;&#65039; Rooftop Solar Intelligence</strong><p style="color:#aaa;font-size:0.75rem;margin-top:8px;">Analyzing rooftop...</p></div>';
    try{
      var geo=await fetch('https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(address)+'&key='+GKEY);
      var gd=await geo.json(); if(gd.status!=='OK'){wrap.innerHTML='';return;}
      var loc=gd.results[0].geometry.location;
      var sat='https://maps.googleapis.com/maps/api/staticmap?center='+encodeURIComponent(address)+'&zoom=19&size=600x200&maptype=satellite&key='+GKEY;
      var sr=await fetch('https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude='+loc.lat+'&location.longitude='+loc.lng+'&requiredQuality=LOW&key='+GKEY);
      var s=sr.status===200?(await sr.json()).solarPotential:null;
      var stats='';
