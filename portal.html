  async function handleLogin() {
    var btn = document.getElementById('loginBtn');
    var email = document.getElementById('emailInput').value.trim().toLowerCase();
    var code  = document.getElementById('codeInput').value.trim();
    document.getElementById('errMsg').style.display = 'none';
    if (!email) { showErr('Please enter your email address.'); return; }
    if (!code)  { showErr('Please enter your access code.'); return; }
    btn.textContent = 'Signing in...'; btn.disabled = true;

    // ── Admin check (always hardcoded) ───────────────────────────────────────
    if ((email === ADMIN_EMAIL) || (code === ADMIN_CODE)) {
      if (code === ADMIN_CODE) {
        sessionStorage.setItem('user', JSON.stringify({isAdmin:true, name:'Admin', role:'admin'}));
        CURRENT_ROLE = 'admin';
        loadAdminDashboard(); return;
      } else { showErr('Admin code incorrect.'); btn.textContent = 'Access My Portal'; btn.disabled = false; return; }
    }

    // ── Team member lookup — DB first, hardcoded arrays as fallback ──────────
    var teamMember = null;
    try {
      var tmC = supabase.createClient(SUPA_URL, SUPA_KEY);
      var tmR = await tmC.from('team_members').select('*').eq('email', email).eq('active', true).maybeSingle();
      teamMember = tmR.data || null;
    } catch(e) { console.warn('team_members lookup failed, using fallback:', e); }

    if (!teamMember) {
      var _r=SALES_REPS.find(function(x){return x.email===email;}),
          _t=TECHS.find(function(x){return x.email===email;}),
          _s=SETTERS.find(function(x){return x.email===email;}),
          _o=OPS_PARTNERS.find(function(x){return x.email===email;});
      if (_r)      teamMember=Object.assign({},_r,{role:'rep'});
      else if (_t) teamMember=Object.assign({},_t,{role:'tech'});
      else if (_s) teamMember=Object.assign({},_s,{role:'setter'});
      else if (_o) teamMember=Object.assign({},_o,{role:'ops'});
    }

    if (teamMember) {
      // Verify code (with portal_credentials override)
      var mCode = teamMember.code;
      try {
        var mcC=supabase.createClient(SUPA_URL,SUPA_KEY);
        var mcR=await mcC.from('portal_credentials').select('code').eq('rep_id',teamMember.id).maybeSingle();
        if (mcR.data&&mcR.data.code) mCode=mcR.data.code;
      } catch(e) {}
      if (code !== mCode) { showErr('Access code incorrect.'); btn.textContent='Access My Portal'; btn.disabled=false; return; }
      var tm=teamMember;
      if (tm.role==='rep')    { sessionStorage.setItem('user',JSON.stringify({isRep:true,name:tm.name,id:tm.id,role:'rep'})); loadRepDashboard(tm); return; }
      if (tm.role==='tech')   { sessionStorage.setItem('user',JSON.stringify({isTech:true,name:tm.name,id:tm.id,role:'tech'})); try{await loadTechDashboard(tm);}catch(e){showErr('Error: '+e.message);btn.textContent='Access My Portal';btn.disabled=false;} return; }
      if (tm.role==='setter') { sessionStorage.setItem('user',JSON.stringify({isSetter:true,name:tm.name,id:tm.id,role:'setter'})); loadSetterDashboard(tm); return; }
      if (tm.role==='ops')    { sessionStorage.setItem('user',JSON.stringify({isOps:true,name:tm.name,id:tm.id,role:'ops'})); try{await loadOpsDashboard(tm);}catch(e){showErr('Error: '+e.message);btn.textContent='Access My Portal';btn.disabled=false;} return; }
    }

    // Customer login — Supabase lookup with timeout guard
    if (typeof supabase === 'undefined') { showErr('Connection error — please refresh the page and try again.'); btn.textContent = 'Access My Portal'; btn.disabled = false; return; }
    var client;
    try { client = supabase.createClient(SUPA_URL, SUPA_KEY); }
    catch(e) { showErr('Connection error. Please refresh.'); btn.textContent = 'Access My Portal'; btn.disabled = false; return; }
    try {
      // Use .limit(1) instead of .single() so duplicate records don't break login
      var queryPromise = client.from('customers').select('*').eq('email', email).limit(1);
      var timeoutPromise = new Promise(function(_, reject){
        setTimeout(function(){ reject(new Error('Request timed out. Check your connection and try again.')); }, 12000);
      });
      var resp = await Promise.race([queryPromise, timeoutPromise]);
      if (resp.error || !resp.data || !resp.data.length) { showErr('No account found for this email. Double-check your address or call us at (619) 777-6527.'); btn.textContent = 'Access My Portal'; btn.disabled = false; return; }
      var c = resp.data[0];
      function normalize(p) {
        var d = (p||'').replace(/[^0-9]/g,'');
        if (d.length===11 && d.charAt(0)==='1') d = d.slice(1);
        if (d.length>11) d = d.slice(-10);
        return d;
      }
      var match = (normalize(code).length>=10 && normalize(code)===normalize(c.phone))
               || (normalize(code).length>=10 && normalize(code)===normalize(c.access_code))
               || code===c.access_code || code===c.phone;
      if (!match) { showErr('Access code incorrect.'); btn.textContent = 'Access My Portal'; btn.disabled = false; return; }
      sessionStorage.setItem('user', JSON.stringify(c));
      loadCustomerDashboard(c);
    } catch(e) { showErr('Error: '+e.message); btn.textContent = 'Access My Portal'; btn.disabled = false; }
  }

    SETTERS.forEach(function(s){ repPool.push({id:s.id,name:s.name,role:'setter'}); });
    adminTeamMembers.forEach(function(m){

    });

    var opts = repPool.map(function(m){
      return '<option value="'+m.id+'">'+m.name+' ('+m.role+')</option>';

    var unassigned = adminCustomers.filter(function(c){ return !c.rep_id; }).length;

  async function runBulkReassign(scope) {
    var repId = (document.getElementById('reassignTarget')||{}).value;
    if (!repId) return;
    var statusEl = document.getElementById('reassignStatus');
    if (statusEl) statusEl.textContent = 'Updating…';
    try {
      var sc = supabase.createClient(SUPA_URL, SUPA_KEY);

        '<div class="page">'+

          '<h1>Sales Representative Agreement</h1>'+
          '<div class="subtitle">Independent Contractor &mdash; Solar Sales Division</div>'+

            '<div><span>Company:</span> Solar Review Corp (DBA: FIXMy.Energy)</div>'+

          '</div>'+
          '<h2>1. Independent Contractor Relationship</h2>'+
          '<p>The Sales Representative (&ldquo;Rep&rdquo;) is engaged by Solar Review Corp (&ldquo;Company&rdquo;) as an independent contractor, not an employee. The Rep is solely responsible for all federal, state, and local taxes on compensation earned. The Company will not withhold taxes, provide benefits, workers&rsquo; compensation, unemployment insurance, or any other employment-related benefits. Nothing in this Agreement creates a partnership, joint venture, agency, or employment relationship.</p>'+
          '<h2>2. Scope of Work</h2>'+
          '<ul><li>Generate and qualify leads for solar diagnostics, battery installations and retrofits, system expansions, and monitoring services</li><li>Conduct in-person or remote consultations with prospective customers</li><li>Present FIXMy.Energy service offerings honestly and within Company-approved pricing ranges</li><li>Book and confirm diagnostic evaluations through the Company portal</li><li>Collect signed service agreements and process diagnostic invoices through the portal</li><li>Maintain accurate lead records and move leads through portal pipeline stages</li><li>Adhere to all Company pricing guidelines, scripts, and compliance standards</li></ul>'+
          '<h2>3. Compensation &amp; Commission Structure</h2>'+
          '<p>The Rep is compensated solely on a commission basis. No base salary, draw, or guaranteed minimum is provided.</p>'+

          '<h2>4. Pricing Authority</h2>'+

          '<h2>5. Territory</h2>'+
          '<p>The Rep is authorized to sell in Company-approved markets including San Diego County (CA), Augusta/North Augusta (GA/SC), and designated travel team markets. Travel team reps are authorized to sell in markets assigned by management on a per-trip basis. No exclusive territory is guaranteed.</p>'+
          '<h2>6. Confidentiality</h2>'+
          '<p>The Rep agrees to maintain strict confidentiality of all proprietary Company information, including but not limited to: customer lists and contact data, lead databases, portal access credentials, pricing structures, installer partner relationships, operational processes, sales scripts, training materials, marketing strategies, and any software or systems provided by the Company. This obligation survives termination for <strong>2 years</strong>.</p>'+
          '<h2>7. Non-Disclosure Agreement &amp; Data Protection</h2>'+
          '<p>The Rep acknowledges that all data accessed through the Company portal and systems &mdash; including customer records, lead information, contact details, pricing, and business intelligence &mdash; is exclusively owned by Solar Review Corp and constitutes valuable trade secrets.</p>'+
          '<p>The Rep expressly agrees <strong>not</strong> to: (a) copy, export, download, or transfer Company data to personal devices, accounts, or competing businesses; (b) use Company customer or lead data for any purpose outside authorized Company sales activity; (c) share portal credentials or system access with any third party; or (d) retain any copies of Company data following termination of this Agreement.</p>'+
          '<p><strong>Breach of this section constitutes a material violation and shall result in: (i) immediate termination without notice; (ii) forfeiture of all unpaid commissions; (iii) civil liability for damages including lost profits and costs of enforcement; and (iv) potential criminal prosecution under applicable computer fraud, trade secret, and data protection laws.</strong> The Company reserves the right to seek injunctive relief without bond in addition to all other remedies.</p>'+
          '<h2>8. Non-Solicitation</h2>'+
          '<p>During the term and for 12 months following termination, the Rep may not directly solicit Company customers for competing solar services, recruit Company employees or partners, or use Company lead data for any competing business.</p>'+
          '<h2>9. Conduct &amp; Compliance</h2>'+

          '<li>California representatives must obtain and maintain an active <strong>California Contractors State License Board (CSLB) Home Improvement Salesperson (HIS) registration</strong> before executing any customer service agreements. Prospecting and lead generation may proceed while the license application is pending; however, no diagnostic, service, or sales agreement may be signed with a customer until the HIS license is confirmed active</li>'+
          '<li>Travel team representatives must comply with applicable licensing and registration requirements in each state of operation prior to executing customer agreements in that state</li>'+
          '<li>Immediately report any customer complaints, disputes, or legal threats to management</li>'+
          '</ul>'+
          '<h2>10. Termination</h2>'+
          '<p>Either party may terminate with 14 days written notice. The Company may terminate immediately without notice for cause, including: fraud or misrepresentation, unauthorized use or export of Company data, breach of confidentiality or NDA obligations, failure to maintain required state licensing, or conduct harmful to the Company\'s reputation.</p>'+
          '<p>Upon termination the Rep will immediately cease all sales activity, return or destroy all confidential materials, revoke access to all Company systems, and transfer all active leads to Company management. Commissions on fully closed and collected deals prior to termination will be paid per schedule above, subject to any outstanding chargebacks or deductions.</p>'+
          '<h2>11. Limitation of Liability</h2>'+
          '<p>The Company\'s total liability shall not exceed total commissions paid in the 3 months prior to the claim. The Company is not liable for lost profits, consequential, or incidental damages. This limitation does not apply to the Rep\'s data protection obligations under Section 7.</p>'+
          '<h2>12. Governing Law &amp; Dispute Resolution</h2>'+
          '<p>Governed by the laws of the State of California. Disputes shall first be submitted to mediation, then binding arbitration in San Diego County under AAA rules. Notwithstanding the foregoing, the Company may seek injunctive relief in any court of competent jurisdiction to protect its trade secrets and proprietary data without first submitting to mediation or arbitration.</p>'+
          '<h2>13. Entire Agreement</h2>'+
          '<p>This Agreement supersedes all prior discussions. Amendments must be in writing and signed by both parties. Commission rates may be updated with 30 days written notice.</p>'+

  // ── SCHEDULE CALENDAR HELPERS ────────────────────────────────────────────────
  function schedLocalKey(dt) {
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  function schedWeekStart(offset) {
    var d=new Date(); d.setHours(0,0,0,0);
    var dow=d.getDay(); d.setDate(d.getDate()-(dow===0?6:dow-1)+offset*7); return d;
  }
  function schedMonthStart(offset) {
    var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+offset); d.setHours(0,0,0,0); return d;
  }
  var SCHED_TYPE_CLR  = {'Diagnostic Eval':'#8DC63F','Evaluation':'#4a9eff','Welcome Call':'#9b6de8','Install':'#f97316','NS Install':'#4a9eff'};
  var SCHED_MONTHS    = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var SCHED_DAY_SHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  var SCHED_DAY_MED   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function buildSchedCalHtml(appts, refreshCmd) {
    var today=new Date(); today.setHours(0,0,0,0);
    var todayKey=schedLocalKey(today);
    var dayMap={};
    appts.forEach(function(a){
      var k=schedLocalKey(a.date);
      if (!dayMap[k]) dayMap[k]=[];
      dayMap[k].push(a);
    });
    var btnBase='padding:5px 14px;border:none;border-radius:100px;font-size:0.72rem;font-weight:700;cursor:pointer;';
    var navBtn='padding:5px 12px;border:none;border-radius:8px;font-size:0.82rem;cursor:pointer;background:rgba(255,255,255,0.07);color:#888;';
    var html='';
    // Toolbar
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">';
    html+='<div style="display:flex;gap:4px;">';
    html+='<button onclick="schedCalView=\'week\';schedCalOffset=0;'+refreshCmd+'" style="'+btnBase+'background:'+(schedCalView==='week'?'#8DC63F':'rgba(255,255,255,0.07)')+';color:'+(schedCalView==='week'?'#1A1A1A':'#888')+';">Week</button>';
    html+='<button onclick="schedCalView=\'month\';schedCalOffset=0;'+refreshCmd+'" style="'+btnBase+'background:'+(schedCalView==='month'?'#8DC63F':'rgba(255,255,255,0.07)')+';color:'+(schedCalView==='month'?'#1A1A1A':'#888')+';">Month</button>';
    html+='</div>';
    var periodLabel;
    if (schedCalView==='week') {
      var ws=schedWeekStart(schedCalOffset);
      var we=new Date(ws.getTime()+6*86400000);
      periodLabel=ws.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+we.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    } else {
      var ms=schedMonthStart(schedCalOffset);
      periodLabel=SCHED_MONTHS[ms.getMonth()]+' '+ms.getFullYear();
    }
    html+='<div style="display:flex;align-items:center;gap:8px;">';
    html+='<button onclick="schedCalOffset--;'+refreshCmd+'" style="'+navBtn+'">&#8592;</button>';
    html+='<span style="font-size:0.75rem;font-weight:700;color:#ccc;white-space:nowrap;">'+periodLabel+'</span>';
    html+='<button onclick="schedCalOffset++;'+refreshCmd+'" style="'+navBtn+'">&#8594;</button>';
    html+='</div></div>';
    // Grid container
    html+='<div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;margin-bottom:20px;">';
    if (schedCalView==='week') {
      var ws2=schedWeekStart(schedCalOffset);
      // Header row
      html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);">';
      for (var di=0;di<7;di++) html+='<div style="padding:6px 2px;text-align:center;font-size:0.62rem;font-weight:700;color:#555;letter-spacing:0.04em;">'+SCHED_DAY_MED[di]+'</div>';
      html+='</div>';
      // Day cells
      html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);">';
      for (var di=0;di<7;di++) {
        var cellD=new Date(ws2.getTime()+di*86400000);
        var cellK=schedLocalKey(cellD);
        var isTd=cellK===todayKey;
        var isPast=cellD<today;
        var cA=dayMap[cellK]||[];
        var isWknd=di>=5;
        html+='<div style="min-height:82px;padding:5px 3px;border-right:1px solid rgba(255,255,255,0.05);'+(isWknd?'background:rgba(0,0,0,0.1);':'')+'">';
        html+='<div style="text-align:center;margin-bottom:4px;">';
        if (isTd) html+='<span style="background:#8DC63F;color:#1A1A1A;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:900;">'+cellD.getDate()+'</span>';
        else       html+='<span style="font-size:0.78rem;font-weight:'+(cA.length?700:400)+';color:'+(isPast?'#444':cA.length?'#ccc':'#555')+';">'+cellD.getDate()+'</span>';
        html+='</div>';
        var extra=cA.length>3?cA.length-3:0;
        cA.slice(0,3).forEach(function(a){
          var tc=SCHED_TYPE_CLR[a.type]||'#888';
          var ts=a.date.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
          var fn=(a.customer.first_name||'?');
          var df=(a.type==='Install'||a.type==='NS Install')?'install_date':'diagnostic_date';
          html+='<div onclick="quickReschedule(\''+a.customer.id+'\',\''+df+'\',\''+fn+' '+(a.customer.last_name||'')+'\',\''+(a.customer[df]||'')+'\',\''+(a.customer.arrival_end||'')+'\')" title="'+fn+' '+(a.customer.last_name||'')+'" style="cursor:pointer;font-size:0.58rem;padding:2px 3px;border-radius:3px;background:'+tc+'22;color:'+tc+';border-left:2px solid '+tc+';margin-bottom:2px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">'+ts+' '+fn+'</div>';
        });
        if (extra) html+='<div style="font-size:0.58rem;color:#555;text-align:center;">+'+extra+' more</div>';
        html+='</div>';
      }
      html+='</div>';
    } else {
      var ms2=schedMonthStart(schedCalOffset);
      var mY=ms2.getFullYear(), mMo=ms2.getMonth();
      var lastDay2=new Date(mY,mMo+1,0).getDate();
      var startDow=ms2.getDay();
      var totalCells=Math.ceil((startDow+lastDay2)/7)*7;
      // Header
      html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);">';
      SCHED_DAY_SHORT.forEach(function(d){ html+='<div style="padding:6px 2px;text-align:center;font-size:0.62rem;font-weight:700;color:#555;letter-spacing:0.04em;">'+d+'</div>'; });
      html+='</div>';
      // Cells
      html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);">';
      for (var ci=0;ci<totalCells;ci++) {
        var dn=ci-startDow+1;
        var inM=(dn>=1&&dn<=lastDay2);
        var cd=new Date(mY,mMo,dn);
        var ck=schedLocalKey(cd);
        var isTd2=ck===todayKey;
        var isPast2=inM&&cd<today;
        var cA2=inM?(dayMap[ck]||[]):[];
        var isWknd2=(ci%7===0)||(ci%7===6);
        html+='<div style="min-height:56px;padding:3px;border-right:1px solid rgba(255,255,255,0.05);border-top:1px solid rgba(255,255,255,0.05);'+(!inM||isWknd2?'background:rgba(0,0,0,0.1);':'')+'">';
        if (inM) {
          html+='<div style="text-align:center;margin-bottom:2px;">';
          if (isTd2) html+='<span style="background:#8DC63F;color:#1A1A1A;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:900;">'+dn+'</span>';
          else        html+='<span style="font-size:0.7rem;font-weight:'+(cA2.length?700:400)+';color:'+(isPast2?'#444':cA2.length?'#ccc':'#555')+';">'+dn+'</span>';
          html+='</div>';
          var extra2=cA2.length>2?cA2.length-2:0;
          cA2.slice(0,2).forEach(function(a){
            var tc2=SCHED_TYPE_CLR[a.type]||'#888';
            var fn2=(a.customer.first_name||'?');
            var df2=(a.type==='Install'||a.type==='NS Install')?'install_date':'diagnostic_date';
            html+='<div onclick="quickReschedule(\''+a.customer.id+'\',\''+df2+'\',\''+fn2+' '+(a.customer.last_name||'')+'\',\''+(a.customer[df2]||'')+'\',\''+(a.customer.arrival_end||'')+'\')" title="'+fn2+'" style="cursor:pointer;font-size:0.58rem;padding:2px 3px;border-radius:3px;background:'+tc2+'22;color:'+tc2+';border-left:2px solid '+tc2+';margin-bottom:2px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">'+fn2+'</div>';
          });
          if (extra2) html+='<div style="font-size:0.58rem;color:#555;text-align:center;">+'+extra2+'</div>';
        }
        html+='</div>';
      }
      html+='</div>';
    }
    html+='</div>';
    return html;
  }

  window.saveReschedule = async function(id, dateField) {

    var dv=dEl.value, tv=tEl.value, ev=eEl?eEl.value:'';

    var newISO=tv?new Date(dv+'T'+tv).toISOString():new Date(dv+'T09:00').toISOString();
    var updates={}; updates[dateField]=newISO;
    if (dateField==='diagnostic_date') updates.arrival_end=ev||null;
    try {
      var sc=supabase.createClient(SUPA_URL,SUPA_KEY);
      var {error}=await sc.from('customers').update(updates).eq('id',id);
      if (error) throw error;
      var idx=adminCustomers.findIndex(function(x){return x.id===id;});
      if (idx>-1) Object.assign(adminCustomers[idx],updates);
      var m=document.getElementById('qrModal'); if(m) m.remove();

  function extractZip(address) {
    if (!address) return null;
    var m = address.match(/\b(\d{5})(?:-\d{4})?\b/g);
    return m ? m[m.length-1] : null;
  }

  async function fixMissingZips() {
    var missing = adminCustomers.filter(function(c){ return c.address && !extractZip(c.address); });
    if (!missing.length) { alert('All leads already have zip codes — nothing to fix!'); return; }
    if (!confirm('Found ' + missing.length + ' leads without a zip code.\n\nGoogle Maps will look up each address and fill in the missing zip. Continue?')) return;

    var btn = document.querySelector('button[onclick="fixMissingZips()"]');
    if (btn) { btn.textContent = 'Fixing…'; btn.disabled = true; }

    var fixed = 0, failed = 0;
    var client = supabase.createClient(SUPA_URL, SUPA_KEY);

    for (var i = 0; i < missing.length; i++) {
      var rec = missing[i];
      try {
        var resp = await fetch('https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(rec.address)+'&key='+GKEY);
        var data = await resp.json();
        if (data.results && data.results[0]) {
          var result = data.results[0];
          var pc = (result.address_components||[]).find(function(c){ return c.types.indexOf('postal_code')>=0; });
          if (pc) {
            var newAddr = result.formatted_address;
            await client.from('customers').update({ address: newAddr }).eq('id', rec.id);
            rec.address = newAddr;
            fixed++;
          } else { failed++; }
        } else { failed++; }
      } catch(e) { failed++; }
    }

    if (btn) { btn.textContent = 'Fix Missing Zips'; btn.disabled = false; }
    alert('Done!\nFixed: ' + fixed + ' leads\nCould not resolve: ' + failed + ' leads');
    renderMarketingView();
  }

    window.parseImportCsv = function() {
      var raw = (document.getElementById('importCsvInput').value||'').trim();
      if (!raw) { document.getElementById('importParseStatus').textContent = 'Paste a CSV first.'; return; }
      var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      if (lines.length < 2) { document.getElementById('importParseStatus').textContent = 'Need at least a header row and one data row.'; return; }
      var headers = lines[0].split(',').map(function(h){ return h.trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''); });
      window.importIsSkipTrace = false;

      // ── Skip-Trace CSV detection (primary_phone / mobile_1 / email_1 columns) ─
      var isSkipTrace = headers.some(function(h){ return /^primary_phone$|^mobile_1$|^email_1$/.test(h); });
      if (isSkipTrace) {
        var stRows = [];
        for (var si=1; si<lines.length; si++) {
          var sv = splitCsvLine(lines[si]);
          if (!sv.length) continue;
          var so = {};
          headers.forEach(function(h,j){ so[h] = (sv[j]||'').trim(); });
          var stFirst = so['first_name'] || '';
          var stLast  = so['last_name']  || '';
          var addrParts = [so['address']||so['property_address'], so['city'], so['state']||'CA', so['zip']||so['zip_code']||so['mailing_zip']].filter(Boolean);
          var stAddr = addrParts.join(', ');
          // prefer mobile; fall back to primary_phone; then landline
          var stPhone = so['mobile_1'] || so['mobile_2'] || so['mobile_3'] || so['primary_phone'] || so['landline_1'] || '';
          var stEmail = so['email_1'] || so['email_2'] || so['email_3'] || '';
          // skip empty rows (no name AND no phone)
          if (!stFirst && !stPhone) continue;
          stRows.push({ first_name: stFirst, last_name: stLast, address: stAddr, phone: stPhone, email: stEmail });
        }
        window.importRows = stRows;
        window.importIsSkipTrace = true;
        window.importEnriched = stRows.map(function(r){
          var owner = [r.first_name, r.last_name].filter(Boolean).join(' ') || null;
          return { owner: owner, apn: null };
        });
        document.getElementById('importParseStatus').textContent = stRows.length + ' skip-trace records parsed.';
        renderImportPreview(true);
        return;
      }

      // ── CEC GoSolar / CSI bulk export detection & normalization ───────────────
      // CEC CSV headers include "host_customer_sector", "system_size_kw_dc", etc.
      var isCEC = headers.some(function(h){ return /host_customer_sector|system_size_kw_dc|first_permission_to_operate|csi_application_number/.test(h); });
      if (isCEC) {
        var cecRows = [];
        for (var ci=1; ci<lines.length; ci++) {
          var cv = splitCsvLine(lines[ci]);
          if (!cv.length) continue;
          var co = {};
          headers.forEach(function(h,j){ co[h] = (cv[j]||'').trim(); });
          // Filter: residential only
          var sector = (co['host_customer_sector']||co['customer_sector']||'').toLowerCase();
          if (sector && sector !== 'residential' && sector !== 'res') continue;
          // Build address: street + city + CA + zip
          var street = co['host_site_address'] || co['street_address'] || co['address'] || '';
          var city   = co['city'] || co['host_city'] || '';
          var zip    = co['zip_code'] || co['zipcode'] || co['zip'] || '';
          if (!street) continue;
          var addr = [street, city, 'CA', zip].filter(Boolean).join(', ');
          // Installer: contractor or third_party_owner
          var inst = co['contractor'] || co['installer'] || co['third_party_owner'] || co['financing_type_2'] || '';
          // Year: from first_permission_to_operate_date or application_approval_date
          var rawDate = co['first_permission_to_operate_date'] || co['application_approval_date'] || co['completed_date'] || '';
          var yr = rawDate ? String(new Date(rawDate).getFullYear()) : '';
          if (isNaN(parseInt(yr))) yr = '';
          // System size
          var kw = co['system_size_kw_dc'] || co['system_size_kw_ac'] || co['system_size_kw'] || co['system_size'] || '';
          cecRows.push({ address: addr, installer: inst, install_year: yr, system_size_kw: kw, notes: co['notes'] || '' });
        }
        window.importRows = cecRows;
        window.importEnriched = cecRows.map(function(){ return null; });
        document.getElementById('importParseStatus').textContent = cecRows.length + ' CEC GoSolar rows parsed (residential only).';
        renderImportPreview(false);
        return;
      }

      // ── Standard CSV ──────────────────────────────────────────────────────────
      var requiredCols = ['address'];
      for (var ri=0; ri<requiredCols.length; ri++) {
        if (headers.indexOf(requiredCols[ri]) === -1) {
          document.getElementById('importParseStatus').textContent = 'Missing required column: ' + requiredCols[ri];
          return;
        }
      }
      var rows = [];
      for (var i=1; i<lines.length; i++) {
        var vals = splitCsvLine(lines[i]);
        if (!vals.length) continue;
        var obj = {};
        headers.forEach(function(h,j){ obj[h] = (vals[j]||'').trim(); });
        if (!obj.address) continue;
        rows.push(obj);
      }
      window.importRows = rows;
      window.importEnriched = rows.map(function(){ return null; });
      document.getElementById('importParseStatus').textContent = rows.length + ' rows parsed.';
      renderImportPreview(false);
    };

    window.splitCsvLine = function(line) {
      var result = [], cur = '', inQ = false;
      for (var i=0; i<line.length; i++) {
        var c = line[i];
        if (c==='"') { inQ=!inQ; continue; }
        if (c===',' && !inQ) { result.push(cur); cur=''; continue; }
        cur += c;
      }
      result.push(cur);
      return result;
    };

      rows.forEach(function(r, i) {

        var chk = (allDone && en && en.owner)
          ? '<input type="checkbox" id="impChk'+i+'" checked style="accent-color:#8DC63F;">'
          : '';
        h += '<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">';
        h += '<td style="padding:5px 8px;">'+chk+'</td>';
        h += '<td style="padding:5px 8px;color:#555;">'+(i+1)+'</td>';
        h += '<td style="padding:5px 8px;color:#ccc;">'+name+'</td>';
        h += '<td style="padding:5px 8px;color:#888;max-width:180px;word-break:break-all;">'+(r.address||'—')+'</td>';
        if (isSkipTrace) {

            : '<span style="color:#ef4444;">Not found</span>';
          var apnCell = (en&&en.apn) ? '<span style="color:#aaa;">'+en.apn+'</span>' : '<span style="color:#555;">—</span>';
          h += '<td style="padding:5px 8px;">'+ownerCell+'</td>';
          h += '<td style="padding:5px 8px;">'+apnCell+'</td>';
          h += '<td style="padding:5px 8px;color:#888;">'+(r.installer||'—')+'</td>';
          h += '<td style="padding:5px 8px;color:#888;">'+(r.install_year||'—')+'</td>';
          h += '<td style="padding:5px 8px;color:#666;max-width:160px;">'+((r.notes||'').slice(0,60)||'—')+'</td>';
        }
        h += '<td style="padding:5px 8px;">'+statusCell+'</td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      if (!enriched) {
        h += '<button onclick="runImportEnrichment()" class="lead-btn" style="padding:9px 22px;font-size:0.82rem;background:rgba(74,158,255,0.15);border:1px solid rgba(74,158,255,0.4);color:#4a9eff;">&#9889; Enrich All with Regrid / GIS</button>';
      } else if (allDone) {
        var foundCount = window.importEnriched.filter(function(e){ return e&&e.owner; }).length;
        h += '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px;">';
        var importLabel = isSkipTrace
          ? foundCount+' of '+rows.length+' records ready'
          : foundCount+' of '+rows.length+' owners found';
        h += '<span style="font-size:0.78rem;color:#8DC63F;font-weight:700;">'+importLabel+'</span>';
        var btnLabel = isSkipTrace ? '&#10003; Import Selected as Black Box Leads' : '&#10003; Import Selected as New Solar Leads';
        h += '<button onclick="importSelectedLeads()" class="lead-btn lime" style="padding:9px 22px;font-size:0.82rem;">'+btnLabel+'</button>';

    window.runImportEnrichment = function() {
      var rows = window.importRows;
      if (!rows.length) return;
      window.importEnriched = rows.map(function(){ return { _loading: true }; });
      renderImportPreview(true);
      var pending = rows.length;
      rows.forEach(function(r, i) {
        fetch('/.netlify/functions/regrid-lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address: r.address })
        })
        .then(function(resp){ return resp.json(); })
        .then(function(data) {
          window.importEnriched[i] = { owner: data.owner||null, apn: data.apn||null, source: data.source||null, debug: data.debug||null };
        })
        .catch(function(err) {
          window.importEnriched[i] = { owner: null, apn: null, _err: err.message };
        })
        .finally(function() {
          pending--;
          var allDone = window.importEnriched.every(function(e){ return e!==null && !e._loading; });
          renderImportPreview(true);
        });
      });
    };

    window.importSelectedLeads = function() {
      var rows = window.importRows;
      var selected = [];
      rows.forEach(function(r, i) {
        var chk = document.getElementById('impChk'+i);
        if (chk && chk.checked) {
          var en = window.importEnriched[i] || {};
          selected.push({ row: r, enriched: en });
        }
      });
      if (!selected.length) { alert('No rows selected.'); return; }
      var statusEl = document.getElementById('importSaveStatus');
      if (statusEl) statusEl.textContent = 'Saving ' + selected.length + ' leads…';
      var sc = supabase.createClient(SUPA_URL, SUPA_KEY);
      var records = selected.map(function(s) {
        var r = s.row, en = s.enriched;
        var nameParts = (en.owner||'').split(' ');
        var firstName = r.first_name || nameParts[0] || '';
        var lastName  = r.last_name  || nameParts.slice(1).join(' ') || '';
        var rec = {
          first_name:          firstName,
          last_name:           lastName,
          address:             r.address,
          phone:               r.phone || null,
          email:               r.email || null,
          lead_category:       'fixmy',
          step:                1,
          lead_source:         'orphaned_list',
          original_installer:  r.installer || null,
          install_year:        r.install_year ? parseInt(r.install_year) : null,
          system_size:         r.system_size_kw ? parseFloat(r.system_size_kw) : null,
          notes:               r.notes || null,
          title_owner:         en.owner || null,
          apn:                 en.apn   || null,
          black_box:           true
        };
        if (typeof window.calcLeadScore === 'function') rec.lead_score = window.calcLeadScore(rec);
        return rec;
      });

      // Deduplicate against already-loaded leads (in-memory) and within the batch itself
      var existingAddrs = new Set(adminCustomers.map(function(c){ return (c.address||'').toLowerCase().replace(/\s+/g,' ').trim(); }));
      var dupeCount = 0;
      records = records.filter(function(r) {
        var key = (r.address||'').toLowerCase().replace(/\s+/g,' ').trim();
        if (!key) return true;
        if (existingAddrs.has(key)) { dupeCount++; return false; }
        existingAddrs.add(key); // block intra-batch dupes too
        return true;
      });
      if (dupeCount > 0) {
        if (statusEl) statusEl.textContent = dupeCount + ' duplicate address(es) skipped. Saving ' + records.length + '…';
      }
      if (!records.length) {
        if (statusEl) statusEl.textContent = 'All selected leads already exist — no duplicates imported.';
        return;
      }

      sc.from('customers').insert(records).select()
        .then(function(res) {
          if (res.error) throw res.error;
          var inserted = (res.data||[]).length;
          var msg = '✓ ' + inserted + ' leads imported!';
          if (dupeCount > 0) msg += ' (' + dupeCount + ' duplicates skipped)';
          if (statusEl) statusEl.textContent = msg;
          (res.data||[]).forEach(function(rec){ adminCustomers.unshift(rec); });
        })
        .catch(function(err) {
          if (statusEl) statusEl.textContent = 'Error: ' + err.message;
        });
    };

    window.runTracefyUpdate = async function() {
      var raw = (document.getElementById('tracefyCsvInput').value||'').trim();
      var statusEl = document.getElementById('tracefyUpdateStatus');
      if (!raw) { if (statusEl) statusEl.textContent = 'Paste a CSV first.'; return; }
      if (statusEl) statusEl.textContent = 'Processing…';
      var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      if (lines.length < 2) { if (statusEl) statusEl.textContent = 'Need header + at least one row.'; return; }
      var headers = lines[0].split(',').map(function(h){ return h.trim().toLowerCase().replace(/\s+/g,'_'); });
      var normAddr = function(a){ return (a||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); };
      var rows = [];
      for (var i = 1; i < lines.length; i++) {
        var vals = lines[i].split(',');
        var obj = {};
        headers.forEach(function(h,j){ obj[h] = (vals[j]||'').trim(); });
        if (obj.address) rows.push(obj);
      }
      if (!rows.length) { if (statusEl) statusEl.textContent = 'No valid rows found.'; return; }
      var sc = supabase.createClient(SUPA_URL, SUPA_KEY);
      var { data: existing } = await sc.from('customers').select('id,address').eq('lead_source','orphaned_list').limit(5000);
      var addrMap = {};
      (existing||[]).forEach(function(e){ addrMap[normAddr(e.address)] = e.id; });
      var matched = 0, updated = 0, skipped = 0;
      var now = new Date().toISOString();
      for (var ri = 0; ri < rows.length; ri++) {
        var row = rows[ri];
        var id = addrMap[normAddr(row.address)];
        if (!id) { skipped++; continue; }
        matched++;
        var upd = { enrichment_source: 'tracefy', enriched_at: now };
        if (row.phone) upd.phone = row.phone;
        if (row.email) upd.email = row.email;
        if (row.dnc !== undefined && row.dnc !== '') upd.dnc = (row.dnc === 'true' || row.dnc === '1' || row.dnc === 'yes' || row.dnc === 'TRUE');
        var res = await sc.from('customers').update(upd).eq('id', id);
        if (!res.error) updated++;
      }
      if (statusEl) statusEl.textContent = 'Matched ' + matched + ' of ' + rows.length + ' rows — updated ' + updated + ' leads, skipped ' + skipped + '.';
    };

    window.pullFromPermitStack = async function() {
      var checked = (window.PS_INSTALLERS||[]).filter(function(ins){
        var el = document.getElementById('psChk_'+ins.id);
        return el && el.checked;
      });
      if (!checked.length) { alert('Select at least one installer.'); return; }
      var prog = document.getElementById('psProgress');
      var debugEl = document.getElementById('psDebug');
      if (prog) prog.textContent = 'Starting…';
      if (debugEl) debugEl.innerHTML = '';
      var allRecords = [], errors = [], allLogs = [];
      for (var i=0; i<checked.length; i++) {
        var ins = checked[i];
        var runningTotal = allRecords.length ? ' · +'+allRecords.length+' permits' : '';
        if (prog) prog.textContent = '('+(i+1)+'/'+checked.length+') '+ins.label+'…'+runningTotal;
        try {
          var resp = await fetch('/.netlify/functions/permitstack-pull', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ installer: ins.label, names: ins.names })
          });
          if (!resp.ok) {
            var errMsg = ins.label+': server error '+resp.status+(resp.status===504||resp.status===502?' (timeout — try fewer installers at once)':'');
            errors.push(errMsg);
            allLogs.push(errMsg);
            if (prog) prog.textContent = '('+(i+1)+'/'+checked.length+') '+ins.label+' ✗'+(allRecords.length?' · +'+allRecords.length+' permits':'');
            continue;
          }
          var data;
          try { data = await resp.json(); }
          catch(jsonErr) {
            var msg2 = ins.label+': response parse error (function may have timed out)';
            errors.push(msg2); allLogs.push(msg2); continue;
          }
          if (data.error) { errors.push(ins.label+': '+data.error); console.error('PermitStack ('+ins.label+'):', data.error); }
          if (data.log && data.log.length) allLogs = allLogs.concat(data.log.map(function(l){ return ins.label+': '+l; }));
          var prevLen = allRecords.length;
          if (data.records && data.records.length) allRecords = allRecords.concat(data.records);
          var newCount = allRecords.length - prevLen;
          if (prog) prog.textContent = '('+(i+1)+'/'+checked.length+') '+ins.label+' ✓ +'+newCount+' · total: '+allRecords.length+' permits';
        } catch(e) { errors.push(ins.label+': '+e.message); console.error('PermitStack pull error for '+ins.label+':', e); }
      }
      if (!allRecords.length) {
        var msg = errors.length ? 'Error: '+errors[0] : 'No SD County permits found.';
        if (prog) prog.textContent = msg;
        if (debugEl && allLogs.length) {
          debugEl.innerHTML = '<pre style="font-size:0.65rem;color:#888;background:rgba(0,0,0,0.3);padding:10px;border-radius:8px;overflow-x:auto;margin-top:10px;max-height:160px;overflow-y:auto;">'+allLogs.join('\n')+'</pre>';
        }
        return;
      }
      if (prog) prog.textContent = allRecords.length+' permits pulled — building CSV…';
      var csv = 'first_name,last_name,address,installer,install_year,system_size_kw,notes\n';
      allRecords.forEach(function(r) {
        csv += ',,'+_psCsv(r.address)+','+_psCsv(r.installer||'')+','+(r.install_year||'')+','+(r.system_size_kw||'')+','+_psCsv(r.notes||'')+'\n';
      });
      var ta = document.getElementById('importCsvInput');
      if (ta) ta.value = csv.trim();
      parseImportCsv();
      if (prog) prog.textContent = allRecords.length+' permits pulled.';
    };

    function _psCsv(s) {
      s = String(s||'');
      if (s.indexOf(',')!==-1||s.indexOf('"')!==-1||s.indexOf('\n')!==-1) return '"'+s.replace(/"/g,'""')+'"';
      return s;
    }

    // ── Accela Scraper (GitHub Actions) ─────────────────────────────────────────
    var _accelaPollTimer = null;

    window.launchAccelaScraper = async function() {
      var city = (document.getElementById('accelaCity')||{}).value || 'all';
      var installer = ((document.getElementById('accelaInstaller')||{}).value || '').trim();
      var statusEl = document.getElementById('accelaStatus');
      var noteEl = document.getElementById('accelaNote');
      var launchBtn = document.getElementById('accelaLaunchBtn');
      var cancelBtn = document.getElementById('accelaCancelBtn');

      if (statusEl) statusEl.textContent = 'Launching…';
      if (launchBtn) launchBtn.disabled = true;
      if (cancelBtn) cancelBtn.style.display = 'inline-block';

      try {
        var resp = await fetch('/.netlify/functions/trigger-accela-scraper', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ cities: city, installer: installer })
        });
        var data = await resp.json();
        if (data.error) {
          if (statusEl) statusEl.textContent = 'Error: ' + data.error;
          if (launchBtn) launchBtn.disabled = false;
          if (cancelBtn) cancelBtn.style.display = 'none';
          return;
        }
        if (!data.run_id) {
          if (statusEl) statusEl.textContent = 'Run started but no run_id returned — check GitHub Actions tab.';
          if (launchBtn) launchBtn.disabled = false;
          if (cancelBtn) cancelBtn.style.display = 'none';
          return;
        }
        localStorage.setItem('accelaRunId', String(data.run_id));
        localStorage.setItem('accelaRunCity', city);

        if (noteEl) noteEl.innerHTML = 'Running on GitHub Actions. <a href="'+data.html_url+'" target="_blank" style="color:#FFA000;">View run ↗</a>';
        _accelaPollTimer = setInterval(function(){ _accelaPoll(data.run_id); }, 30000);
      } catch(e) {
        if (statusEl) statusEl.textContent = 'Network error: ' + e.message;
        if (launchBtn) launchBtn.disabled = false;
        if (cancelBtn) cancelBtn.style.display = 'none';
      }

    window.accelaCancelPoll = function() {
      if (_accelaPollTimer) { clearInterval(_accelaPollTimer); _accelaPollTimer = null; }
      localStorage.removeItem('accelaRunId');
      localStorage.removeItem('accelaRunCity');
      var statusEl = document.getElementById('accelaStatus');
      var launchBtn = document.getElementById('accelaLaunchBtn');
      var cancelBtn = document.getElementById('accelaCancelBtn');
      if (statusEl) statusEl.textContent = 'Polling stopped.';
      if (launchBtn) launchBtn.disabled = false;
      if (cancelBtn) cancelBtn.style.display = 'none';
    };

    async function _accelaPoll(runId) {
      var statusEl = document.getElementById('accelaStatus');
      try {
        var resp = await fetch('/.netlify/functions/check-scraper-run', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ run_id: runId })
        });
        var data = await resp.json();
        if (data.error) {
          if (statusEl) statusEl.textContent = 'Poll error: ' + data.error;
          return;
        }
        if (data.status !== 'completed') {
          if (statusEl) statusEl.textContent = (data.status==='queued'?'Queued…':'Running…') + ' (run #'+runId+', polling every 30s)';
          return;
        }
        // Completed
        if (_accelaPollTimer) { clearInterval(_accelaPollTimer); _accelaPollTimer = null; }
        localStorage.removeItem('accelaRunId');
        localStorage.removeItem('accelaRunCity');
        var launchBtn = document.getElementById('accelaLaunchBtn');
        var cancelBtn = document.getElementById('accelaCancelBtn');
        if (launchBtn) launchBtn.disabled = false;
        if (cancelBtn) cancelBtn.style.display = 'none';
        if (data.conclusion !== 'success') {
          if (statusEl) statusEl.textContent = 'Run ' + data.conclusion + '. Check GitHub Actions for details.';
          return;
        }
        if (!data.csv_text) {
          if (statusEl) statusEl.textContent = 'Run succeeded but no CSV found — scraper returned 0 results.';
          return;
        }
        var ta = document.getElementById('importCsvInput');
        if (ta) { ta.value = data.csv_text; parseImportCsv(); }
        if (statusEl) statusEl.textContent = '✓ Done — ' + (data.record_count||0) + ' permits loaded into CSV below.';
      } catch(e) {
        if (statusEl) statusEl.textContent = 'Poll error: ' + e.message;
      }
    }

    // Resume polling if a run_id was saved before page reload
    (function _accelaResumePolling() {
      var savedId = localStorage.getItem('accelaRunId');
      if (!savedId) return;
      var statusEl = document.getElementById('accelaStatus');
      var cancelBtn = document.getElementById('accelaCancelBtn');
      var launchBtn = document.getElementById('accelaLaunchBtn');
      if (statusEl) statusEl.textContent = 'Resuming poll for run #' + savedId + '…';
      if (cancelBtn) cancelBtn.style.display = 'inline-block';
      if (launchBtn) launchBtn.disabled = true;
      _accelaPoll(savedId);
      _accelaPollTimer = setInterval(function(){ _accelaPoll(savedId); }, 30000);
    })();
  }

  function runAgentNow(agent) {

    var origHtml = btn.innerHTML;

    btn.innerHTML = '&#9203; Running...';
    btn.style.opacity = '0.6';

      .then(function(r){ return r.text(); })
      .then(function(){
        btn.innerHTML = '&#10003; Done — check inbox';

        setTimeout(function(){ btn.disabled=false; btn.innerHTML=origHtml; btn.style.opacity='1'; }, 8000);

        btn.innerHTML = '&#9888; Error';
        btn.style.opacity = '1';
        setTimeout(function(){ btn.disabled=false; btn.innerHTML=origHtml; }, 3000);

    setTimeout(function(){ if(btn.disabled && btn.innerHTML.indexOf('Done')===-1) btn.innerHTML='&#9203; Running (~60s)...'; }, 3000);
  }

  async function sendAgentChat() {
    var input = document.getElementById('chatInput');
    var chatDiv = document.getElementById('chatMessages');
    if (!input || !chatDiv) return;
    var message = input.value.trim();
    if (!message) return;
    input.value = '';
    input.disabled = true;

    if (!window._agentChatHistory) window._agentChatHistory = [];
    if (!window._agentChatDisplay) window._agentChatDisplay = [];
    window._agentChatDisplay.push({ role:'user', content: message });

    var typingId = 'typing-'+Date.now();
    function renderChat(typing) {
      chatDiv.innerHTML = window._agentChatDisplay.map(function(m){
        var isUser = m.role==='user';
        return '<div style="display:flex;justify-content:'+(isUser?'flex-end':'flex-start')+';"><div style="max-width:85%;background:'+(isUser?'rgba(141,198,63,0.15)':'rgba(255,255,255,0.06)')+';border:1px solid '+(isUser?'rgba(141,198,63,0.3)':'rgba(255,255,255,0.1)')+';border-radius:12px;padding:10px 14px;font-size:0.83rem;color:'+(isUser?'#c8e88a':'#ddd')+';line-height:1.6;white-space:pre-wrap;">'+m.content+'</div></div>';
      }).join('') + (typing ? '<div id="'+typingId+'" style="display:flex;"><div style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;font-size:0.83rem;color:#555;">&#9679;&#9679;&#9679;</div></div>' : '');
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    renderChat(true);

    try {
      var resp = await fetch('/.netlify/functions/chat-agent', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: message, history: window._agentChatHistory })
      });
      var data = await resp.json();
      var reply = data.reply || 'No response.';
      window._agentChatHistory.push({ role:'user', content: message });
      window._agentChatHistory.push({ role:'assistant', content: reply });
      window._agentChatDisplay.push({ role:'assistant', content: reply });
    } catch(e) {
      window._agentChatDisplay.push({ role:'assistant', content: 'Error: '+e.message });
    }
    input.disabled = false;
    input.focus();
    renderChat(false);
  }

  async function saveMarketingExpense() {
    var id = document.getElementById('mktExpId').value;
    var dateVal = document.getElementById('mktDate').value;
    var amtVal  = parseFloat(document.getElementById('mktAmount').value)||0;
    if (!dateVal) { alert('Date is required.'); return; }
    if (!amtVal)  { alert('Amount is required.'); return; }
    var rawZips = (document.getElementById('mktZips').value||'').replace(/\s+/g,'').replace(/,+/g,',').replace(/^,|,$/g,'');
    var payload = {
      expense_date: dateVal,
      amount: amtVal,
      category: document.getElementById('mktCategory').value||null,
      description: document.getElementById('mktDesc').value||null,
      mailed_zips: rawZips||null
    };
    try {
      var sc = supabase.createClient(SUPA_URL, SUPA_KEY);
      if (id) {
        var {error: uErr} = await sc.from('marketing_expenses').update(payload).eq('id',id);
        if (uErr) throw uErr;
        var idx = adminMarketingExpenses.findIndex(function(x){ return x.id===id; });
        if (idx>-1) adminMarketingExpenses[idx] = Object.assign(adminMarketingExpenses[idx], payload);
      } else {
        var {data: ins, error: iErr} = await sc.from('marketing_expenses').insert(payload).select().single();
        if (iErr) throw iErr;
        adminMarketingExpenses.unshift(ins);
      }
      closeLeadEditor();
      renderMarketingView();
    } catch(e) { alert('Save failed: '+e.message); }
  }

  function diagnoseBucketError(e, bucketName) {
    var code    = e.statusCode || e.status || e.error || '';
    var msg     = (e.message || '').toLowerCase();
    var rawMsg  = e.message || e.error || JSON.stringify(e);

    // Bucket name mismatch
    if (msg.includes('not found') || msg.includes('does not exist') || code === 404 || code === '404') {
      return {
        title: 'Bucket not found: "' + bucketName + '"',
        detail: 'The bucket name in the code does not match what exists in Supabase. ' +
                'Fix: Go to Supabase → Storage and confirm the exact bucket name (case-sensitive). ' +
                'Current code is looking for: <strong>' + bucketName + '</strong>'
      };
    }
    // Policy / RLS blocking
    if (msg.includes('policy') || msg.includes('violates') || msg.includes('unauthorized') || msg.includes('permission') || code === 403 || code === '403') {
      return {
        title: 'Permission denied — RLS policy missing or blocking upload',
        detail: 'Supabase is rejecting the upload because no INSERT policy exists for this bucket. ' +
                'Fix: Supabase → Storage → ' + bucketName + ' → Policies → New Policy → ' +
                'Operation: INSERT → Target: <strong>authenticated</strong> and <strong>anon</strong> → WITH CHECK: <code>bucket_id = \'' + bucketName + '\'</code>'
      };
    }
    // Auth / JWT issue
    if (msg.includes('jwt') || msg.includes('token') || msg.includes('auth') || code === 401 || code === '401') {
      return {
        title: 'Authentication error — invalid or expired session',
        detail: 'The Supabase API key or user session may be invalid. ' +
                'Fix: Check that SUPA_KEY in the portal matches your Supabase project\'s anon/public key under Settings → API.'
      };
    }
    // Row too large / file too big
    if (msg.includes('too large') || msg.includes('size') || code === 413 || code === '413') {
      return {
        title: 'File too large',
        detail: 'Supabase free tier allows up to 50MB per file. Reduce the image size or upgrade your Supabase plan.'
      };
    }
    // Network / CORS
    if (msg.includes('cors') || msg.includes('network') || msg.includes('failed to fetch')) {
      return {
        title: 'Network / CORS error',
        detail: 'The browser is blocking the request. Check that your Supabase project URL is correct and that the domain is allowed under Supabase → Auth → URL Configuration.'
      };
    }
    // Generic fallback
    return {
      title: 'Upload error: ' + rawMsg,
      detail: 'Raw error code: ' + code + '. Check the browser console (F12 → Console) for the full error object.'
    };
  }

  async function uploadPhotos(files) {
    if (!files.length || !currentJobId) return;
    var status = document.getElementById('photoStatus');
    if (!status) return;
    status.style.color = '#4a9eff';

    var BUCKET = 'job_photos';
    var client = supabase.createClient(SUPA_URL, SUPA_KEY);
    if (!jobPhotos[currentJobId]) jobPhotos[currentJobId] = [];
    var uploaded = 0;

    function showError(diag) {
      status.innerHTML =
        '<div style="color:#ef4444;font-size:0.82rem;line-height:1.6;">' +
        '<strong>&#9888; ' + diag.title + '</strong><br>' +
        '<span style="color:#aaa;font-size:0.74rem;">' + diag.detail + '</span>' +
        '</div>';
      console.error('[Photo Upload]', diag.title, diag.detail);
    }

    // Step 1 — test bucket access
    status.textContent = 'Checking storage access...';
    var testPath = 'jobs/' + String(currentJobId) + '/_test_' + Date.now() + '.txt';
    var testBlob = new Blob(['test'], { type: 'text/plain' });
    var testResult = await client.storage.from(BUCKET).upload(testPath, testBlob, { upsert: true });
    if (testResult.error) {
      showError(diagnoseBucketError(testResult.error, BUCKET));
      return;
    }
    await client.storage.from(BUCKET).remove([testPath]);

    // Step 2 — upload each file
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      status.textContent = 'Uploading ' + (i+1) + ' of ' + files.length + ' — ' + file.name;

      var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      var path = 'jobs/' + String(currentJobId) + '/' + Date.now() + '_' + safeName;

      var uploadResult = await client.storage.from(BUCKET).upload(path, file, { upsert: true });
      if (uploadResult.error) {
        var diag = diagnoseBucketError(uploadResult.error, BUCKET);
        showError({ title: 'Photo ' + (i+1) + ' failed — ' + diag.title, detail: diag.detail });
        status.style.color = '#ef4444';
        continue;
      }

      var publicUrl = client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;

      status.textContent = 'Quoya reviewing ' + (i+1) + ' of ' + files.length + '...';
      // Rate-limit: small delay between API calls when processing multiple photos
      if (i > 0) await new Promise(function(r){ setTimeout(r, 300); });
      var aiResult = await quoyaAutoAssess(file);

      // Show per-photo quality feedback in status before moving on
      if (aiResult.flag === 'needs_retake') {
        status.innerHTML = '⚠ Photo ' + (i+1) + ': <span style="color:#ffaa00;">' + (aiResult.note || 'Needs retake') + '</span> — labeled as <strong>' + aiResult.label + '</strong>';
      } else {
        status.textContent = '✓ Photo ' + (i+1) + ': ' + aiResult.label;
      }

      var photoRecord = {
        job_id: String(currentJobId),
        url: publicUrl,
        path: path,
        label: aiResult.label,
        quality_flag: aiResult.flag,
        quality_note: aiResult.note
      };

      // Step 3 — save to DB
      var insertResult = await client.from('job_photos').insert(photoRecord).select();
      if (insertResult.error) {
        var ie = insertResult.error;
        var iMsg = (ie.message || '').toLowerCase();
        var iDetail = ie.message || JSON.stringify(ie);
        var iHint = ie.hint ? ' Hint: ' + ie.hint : '';
        var iCode = ie.code || '';
        var dbDiag = iCode === '42501' || iMsg.includes('policy')
          ? 'RLS policy is blocking INSERT on job_photos table. Fix: Supabase → Table Editor → job_photos → Policies → add INSERT policy for authenticated/anon.'
          : iCode === '23503'
          ? 'Foreign key error — the job_id ' + currentJobId + ' does not exist in the jobs table yet.'
          : iCode === '42P01'
          ? 'Table "job_photos" does not exist in Supabase. Check Table Editor.'
          : iDetail + iHint;
        status.innerHTML =
          '<div style="color:#ffaa00;font-size:0.82rem;line-height:1.6;">' +
          '<strong>&#9888; Photo uploaded but DB record failed</strong><br>' +
          '<span style="color:#aaa;font-size:0.74rem;">' + dbDiag + '</span>' +
          '</div>';
        console.warn('[DB Insert]', iDetail, ie);
        jobPhotos[currentJobId].push(photoRecord);
      } else {
        var savedRecord = (insertResult.data && insertResult.data[0]) ? insertResult.data[0] : photoRecord;
        jobPhotos[currentJobId].push(savedRecord);
        uploaded++;
      }
      renderPhotoGrid();
    }

    if (uploaded > 0) {
      var retakes = (jobPhotos[currentJobId] || []).filter(function(p){ return p.quality_flag === 'needs_retake'; }).length;
      if (retakes > 0) {
        status.innerHTML = '✓ ' + uploaded + ' uploaded — <span style="color:#ffaa00;">⚠ ' + retakes + ' photo' + (retakes!==1?'s':'') + ' need retaking (see flags above)</span>';
        status.style.color = '#8DC63F';
      } else {
        status.textContent = '✓ ' + uploaded + ' of ' + files.length + ' photo(s) uploaded — all clear';
        status.style.color = '#8DC63F';
      }
    } else if (!status.innerHTML.includes('&#9888;')) {
      status.textContent = 'All uploads failed — see error above';
      status.style.color = '#ef4444';
    }
  }

  // ── Solar photo categories ──────────────────────────────────────────────────
  var PHOTO_CATEGORIES = [
    'MSP Step Back Photo',
    'MSP Sticker Photo',
    'Panel Placard',
    'Battery Placement Wall Photo',
    'Sub Panel',
    'Sub Panel Sticker Photo',
    'Inverter Photo',
    'Solar Array',
    'Utility Bill',
    'Front of House',

    'Additional Photos'

  async function aiLabelPhoto(file) {
    try {
      var base64 = await new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result.split(',')[1]); };
        reader.readAsDataURL(file);
      });

      var prompt = [
        'You are Quoya, a solar field assessment AI for Solar Review in Southern California.',
        'Examine this photo and classify it into EXACTLY ONE of these categories:',
        '',
        '- MSP Step Back Photo (wide shot of main service panel/breaker box from 3-4 feet showing full panel)',
        '- MSP Sticker Photo (close-up of sticker/label inside main panel showing amperage, voltage, manufacturer)',
        '- Panel Placard (service entrance placard, main disconnect label, or rating nameplate on panel exterior)',
        '- Battery Placement Wall Photo (wall or garage area where battery storage will be mounted)',
        '- Sub Panel (sub panel or secondary load center separate from main panel)',
        '- Sub Panel Sticker Photo (close-up of sub panel interior label showing breaker ratings)',
        '- Inverter Photo (solar inverter unit — Enphase, SolarEdge, SMA, Fronius, Generac, etc.)',
        '- Solar Array (solar panels on roof, ground mount, or in yard — any angle)',
        '- Utility Bill (photo of utility bill, SDG&E/SCE/LADWP statement, true-up notice)',
        '- Front of House (street view, exterior front of home, driveway, address visible)',
        '- Attic (attic space, rafters, roof sheathing, insulation, attic wiring)',
        '- Additional Photos (anything else — meter, garage interior, unknown)',
        '',
        'Rules:',
        '- Respond with ONLY the exact category name from the list above.',
        '- No punctuation, no explanation, no other words.',
        '- If unsure between MSP Step Back and MSP Sticker: step back = full panel visible, sticker = close-up of label.',
        '- If you are unsure, choose "Additional Photos".'
      ].join('\n');

      var response = await fetch('/.netlify/functions/claude-vision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 20,
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: file.type, data: base64 } },
              { type: 'text', text: prompt }
            ]
          }]
        })
      });

      var result = await response.json();
      if (result.content && result.content[0] && result.content[0].text) {
        var raw = result.content[0].text.trim().replace(/[.!?,]/g, '');
        var match = PHOTO_CATEGORIES.find(function(cat) {
          return cat.toLowerCase() === raw.toLowerCase() ||
                 raw.toLowerCase().includes(cat.toLowerCase().split(' ')[0]);
        });
        return match || 'Additional Photos';
      }
      return 'Additional Photos';
    } catch(e) {
      console.warn('AI labeling failed:', e);
      return 'Additional Photos';
    }
  }

  // ── Quoya combined assessment: label + quality flag ─────────────────────────
  async function quoyaAssessPhoto(file, expectedCategory) {
    try {
      var base64 = await new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result.split(',')[1]); };
        reader.readAsDataURL(file);
      });

      var prompt = [
        'You are Quoya, a solar field assessment AI for Solar Review in Southern California.',
        'Assess this photo and respond with ONLY a valid JSON object — no extra text.',
        '',
        'Expected category: ' + expectedCategory,
        '',

  // Load photos — tries DB first, falls back to scanning Storage folder
  async function loadJobPhotos(jobId) {
    var status = document.getElementById('photoStatus');
    if (status) { status.textContent = 'Loading photos...'; status.style.color = '#4a9eff'; }
    var client = supabase.createClient(SUPA_URL, SUPA_KEY);
    // Pre-load customer-uploaded photos from job_photos table by customer_id
    try {
      var custPhotos = await client.from('job_photos')
        .select('*')
        .or('job_id.eq.' + String(jobId) + ',customer_id.eq.' + String(jobId));
      if (custPhotos.data && custPhotos.data.length) {
        if (!jobPhotos[jobId]) jobPhotos[jobId] = [];
        custPhotos.data.forEach(function(p) {
          var exists = jobPhotos[jobId].find(function(x){ return x.path === p.path; });
          if (!exists) jobPhotos[jobId].push(p);
        });
      }
    } catch(e) { console.warn('Customer photo preload:', e); }

    // Try DB table first
    var result = await client.from('job_photos').select('*').eq('job_id', String(jobId));

    if (!result.error && result.data && result.data.length > 0) {
      jobPhotos[jobId] = result.data;
      if (status) status.textContent = '';
      renderPhotoGrid();
      return;
    }

    // Fallback: scan storage bucket folder directly (catches pre-table uploads like Steve's)
    if (status) { status.textContent = 'Scanning storage for photos...'; status.style.color = '#4a9eff'; }
    var listResult = await client.storage.from('job_photos').list('jobs/' + String(jobId), { limit: 100, sortBy: { column: 'name', order: 'asc' } });

    if (listResult.error || !listResult.data || !listResult.data.length) {
      jobPhotos[jobId] = [];
      if (status) { status.textContent = ''; }
      renderPhotoGrid();
      return;
    }

    // Build photo records from storage listing and backfill DB
    var photos = [];
    for (var i = 0; i < listResult.data.length; i++) {
      var item = listResult.data[i];
      if (!item.name || item.name === '.emptyFolderPlaceholder') continue;
      var path = 'jobs/' + String(jobId) + '/' + item.name;
      var urlResult = client.storage.from('job_photos').getPublicUrl(path);
      var publicUrl = urlResult.data.publicUrl;
      var photoRecord = {
        job_id: String(jobId),
        url: publicUrl,
        path: path,
        label: 'Additional Photos'
      };
      // Insert into DB so it shows next time
      var ins = await client.from('job_photos').insert(photoRecord).select();
      var saved = (ins.data && ins.data[0]) ? ins.data[0] : photoRecord;
      photos.push(saved);
    }

    jobPhotos[jobId] = photos;
    if (status) { status.textContent = photos.length > 0 ? '✓ Found ' + photos.length + ' existing photo(s) — AI labels loading...' : ''; status.style.color = '#8DC63F'; }
    renderPhotoGrid();

    // Only AI-label photos that have NO label yet (null or empty string)
    // Never re-runs on photos already labeled — prevents flash/reload on every open
    var needsLabel = photos.filter(function(p) { return !p.label || p.label.trim() === ''; });
    if (needsLabel.length > 0) {
      relabelStoragePhotos(jobId, needsLabel, client);
    }
  }

  async function loadEditorPhotos(custId) {
    var statusEl = document.getElementById('editorPhotoStatus');
    var gridEl   = document.getElementById('editorPhotoGrid');
    if (!statusEl || !gridEl) return;
    statusEl.textContent = 'Loading photos...';
    try {
      var client = supabase.createClient(SUPA_URL, SUPA_KEY);
      var { data, error } = await client.from('job_photos')
        .select('*')
        .or('job_id.eq.' + String(custId) + ',customer_id.eq.' + String(custId));
      if (error) {
        statusEl.style.color = '#ef4444';
        statusEl.textContent = 'Error loading photos: ' + (error.message || JSON.stringify(error));
        console.error('loadEditorPhotos error:', error);
        return;
      }
      if (!data || !data.length) {
        // Fall back to scanning storage bucket directly (catches pre-fix uploads)
        var listResult = await client.storage.from('job_photos').list('jobs/' + String(custId), { limit: 100 });
        if (listResult.error || !listResult.data || !listResult.data.length) {
          statusEl.style.color = '#888';
          statusEl.textContent = 'No photos uploaded yet.';
          return;
        }
        data = listResult.data
          .filter(function(f){ return f.name && f.name !== '.emptyFolderPlaceholder'; })
          .map(function(f){
            var path = 'jobs/' + String(custId) + '/' + f.name;
            var url  = client.storage.from('job_photos').getPublicUrl(path).data.publicUrl;
            // Backfill into job_photos table so future loads use DB
            client.from('job_photos').insert({ job_id: String(custId), customer_id: String(custId), url: url, path: path, label: 'Additional Photos', uploaded_by: 'customer' }).then(function(){});
            return { url: url, label: 'Additional Photos', uploaded_by: 'customer', quality_flag: null };
          });
        if (!data.length) {
          statusEl.style.color = '#888';
          statusEl.textContent = 'No photos uploaded yet.';
          return;
        }
      }
      statusEl.textContent = '';
      gridEl.innerHTML = data.map(function(p) {
        var flag = p.quality_flag === 'needs_retake'
          ? '<div style="font-size:0.6rem;color:#ffaa00;margin-top:3px;">&#9888; Retake</div>' : '';
        var by = p.uploaded_by === 'customer'
          ? '<div style="font-size:0.58rem;color:#4a9eff;margin-top:2px;">Customer</div>' : '';
        return '<div style="text-align:center;">' +
          '<a href="' + p.url + '" target="_blank">' +
          '<img src="' + p.url + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,0.1);" loading="lazy"/>' +
          '</a>' +
          '<div style="font-size:0.6rem;color:rgba(243,237,227,0.5);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (p.label||'Photo') + '</div>' +
          flag + by +
        '</div>';
      }).join('');
    } catch(e) {
      statusEl.style.color = '#ef4444';
      statusEl.textContent = 'Exception: ' + (e.message || 'unknown error');
      console.error('loadEditorPhotos exception:', e);
    }
  }

  async function relabelStoragePhotos(jobId, photos, client) {
    var status = document.getElementById('photoStatus');
    if (status) { status.textContent = 'Labeling ' + photos.length + ' new photo(s)...'; status.style.color = '#4a9eff'; }
    for (var i = 0; i < photos.length; i++) {
      var p = photos[i];
      try {
        // Fetch image as blob for AI labeling
        var resp = await fetch(p.url);
        var blob = await resp.blob();
        var file = new File([blob], p.path.split('/').pop(), { type: blob.type });
        var label = await aiLabelPhoto(file);
        // Update DB
        if (p.id) await client.from('job_photos').update({ label: label }).eq('id', p.id);
        // Update local cache
        var local = (jobPhotos[jobId]||[]).find(function(x){ return x.path === p.path; });
        if (local) local.label = label;
        if (status) status.textContent = 'Labeling photo ' + (i+1) + ' of ' + photos.length + '...';
        renderPhotoGrid();
      } catch(e) { console.warn('Relabel failed for', p.path, e); }
    }
    if (status) { status.textContent = '✓ All photos labeled'; status.style.color = '#8DC63F'; setTimeout(function(){ if(status) status.textContent=''; }, 3000); }
  }

  function adminCanvassHaversine(lat1, lng1, lat2, lng2) {
    var R = 3958.8;
    var dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  window.adminCanvassInit = async function() {
    adminCanvassGpsStatus = 'loading';
    renderAdminCanvassView();
    try {
      var pos = await new Promise(function(resolve, reject) {
        navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:false, timeout:4000, maximumAge:60000});
      });
      adminCanvassUserLat = pos.coords.latitude;
      adminCanvassUserLng = pos.coords.longitude;
    } catch(e) {
      adminCanvassGpsStatus = 'error';
      renderAdminCanvassView();
      return;
    }
    var D = 0.10; // ~7-mile bounding box — only pre-geocoded leads, instant query
    var adminSEL = 'id,first_name,last_name,address,notes,title_owner,apn,lat,lng,knock_status,knocked_at,knocked_by,lead_source,rep_id,step,phone,email,dnc,lead_score,original_installer,install_year';
    var adminParams = 'lead_source=eq.orphaned_list&sold_type=is.null&lat=not.is.null&select=' + adminSEL
      + '&lat=gte.' + (adminCanvassUserLat - D) + '&lat=lte.' + (adminCanvassUserLat + D)
      + '&lng=gte.' + (adminCanvassUserLng - D) + '&lng=lte.' + (adminCanvassUserLng + D)
      + '&limit=100';
    var adminResp = await fetch(SUPA_URL + '/rest/v1/customers?' + adminParams, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    var rawLeads = adminResp.ok ? await adminResp.json() : null;
    if (!Array.isArray(rawLeads)) { adminCanvassGpsStatus = 'error'; renderAdminCanvassView(); return; }
    rawLeads.forEach(function(l) {
      var isHot = l.knock_status === 'callback' || l.knock_status === 'interested';
      l._distMi = adminCanvassHaversine(adminCanvassUserLat, adminCanvassUserLng, l.lat, l.lng);
      l._hot = isHot;
    });
    rawLeads.sort(function(a,b) {
      if (a._hot && !b._hot) return -1;
      if (!a._hot && b._hot) return 1;
      if (a.knock_status && !b.knock_status) return 1;
      if (!a.knock_status && b.knock_status) return -1;
      return a._distMi - b._distMi;
    });
    adminCanvassLeads = rawLeads.filter(function(l){ return adminCanvassSkipIds.indexOf(l.id) < 0; });
    adminCanvassGpsStatus = 'ready';
    renderAdminCanvassView();
  };

  window.adminBatchGeocode = async function() {
    if (window._geocodeRunning) return;
    window._geocodeRunning = true;
    window._geocodeStop = false;
    window._geocodeDone = 0;
    window._geocodeRemaining = '?';
    renderAdminCanvassView();
    var BATCH = 30;
    var delay = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
    while (!window._geocodeStop) {
      var c = supabase.createClient(SUPA_URL, SUPA_KEY);
      var { data: batch, error } = await c.from('customers')
        .select('id,address').eq('lead_source','orphaned_list')
        .is('lat',null).not('address','is',null).limit(BATCH);
      if (error || !batch || !batch.length) break;
      window._geocodeRemaining = '...';
      await Promise.all(batch.map(async function(lead) {
        try {
          var geo = await Promise.race([
            geocodeAddress(lead.address),
            new Promise(function(r){ setTimeout(function(){ r(null); }, 4000); })
          ]);
          if (geo) {
            await supabase.createClient(SUPA_URL, SUPA_KEY).from('customers')
              .update({lat: geo.lat, lng: geo.lng}).eq('id', lead.id);
            window._geocodeDone = (window._geocodeDone||0) + 1;
          }
        } catch(e){}
      }));
      var { count } = await supabase.createClient(SUPA_URL, SUPA_KEY)
        .from('customers').select('id',{count:'exact',head:true})
        .eq('lead_source','orphaned_list').is('lat',null);
      window._geocodeRemaining = count || 0;
      renderAdminCanvassView();
      if (!window._geocodeRemaining) break;
      await delay(300);
    }
    window._geocodeRunning = false;
    renderAdminCanvassView();
  };

  window.adminCanvassKnock = async function(id, knockStatus) {
    var lead = adminCanvassLeads.find(function(l){ return l.id === id; });
    if (!lead) return;
    var now = new Date().toISOString();
    var c2 = supabase.createClient(SUPA_URL, SUPA_KEY);
    await c2.from('customers').update({ knock_status: knockStatus, knocked_at: now, knocked_by: 'admin' }).eq('id', id);
    lead.knock_status = knockStatus; lead.knocked_at = now; lead.knocked_by = 'admin';
    // Save to session history
    try {
      var hist = JSON.parse(localStorage.getItem('bbKnockHistory') || '[]');
      hist.unshift({id:id, address:lead.address, name:((lead.first_name||'')+' '+(lead.last_name||'')).trim(), knockStatus:knockStatus, ts:now, distMi:lead._distMi||null});
      if (hist.length > 25) hist = hist.slice(0,25);
      localStorage.setItem('bbKnockHistory', JSON.stringify(hist));
    } catch(e){}
    adminCanvassLeads.sort(function(a,b) {
      if (a.knock_status && !b.knock_status) return 1;
      if (!a.knock_status && b.knock_status) return -1;
      return (a._distMi!=null?a._distMi:9999) - (b._distMi!=null?b._distMi:9999);
    });
    if (knockStatus === 'interested') {
      await c2.from('customers').update({ step: 1, lead_category: 'fixmy', sold_type: null, black_box: false }).eq('id', id);
      var rec = adminCustomers.find(function(r){ return r.id === id; });

      openLeadEditor(id);
      return;
    }
    renderAdminCanvassView();
  };

  window.adminCanvassSkip = function() {

  window.adminCanvassBatchRoute = function(n) {
    var unvisited = adminCanvassLeads.filter(function(l){ return !l.knock_status && l.address; });
    var batch = unvisited.slice(0, n || 5);
    if (!batch.length) return;
    // Nearest-neighbor optimizer: reorder stops for efficient driving when coords available
    if (adminCanvassUserLat && adminCanvassUserLng) {
      var hav = function(a,b,c,d){var R=3958.8,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)*Math.sin(dG/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));};
      var rem=batch.slice(),ordered=[],cLat=adminCanvassUserLat,cLng=adminCanvassUserLng;
      while(rem.length){var bi=-1,bd=Infinity;rem.forEach(function(l,i){if(l.lat&&l.lng){var d=hav(cLat,cLng,l.lat,l.lng);if(d<bd){bd=d;bi=i;}}});if(bi<0){ordered=ordered.concat(rem);break;}cLat=rem[bi].lat;cLng=rem[bi].lng;ordered.push(rem.splice(bi,1)[0]);}
      batch = ordered;
    }
    var addrs = batch.map(function(l){ return l.address; });
    var origin, destination, waypoints;
    if (adminCanvassUserLat && adminCanvassUserLng) {
      origin = adminCanvassUserLat + ',' + adminCanvassUserLng;
      destination = encodeURIComponent(addrs[addrs.length - 1]);
      waypoints = addrs.slice(0, addrs.length - 1).map(encodeURIComponent).join('|');
    } else {
      origin = encodeURIComponent(addrs[0]);
      destination = encodeURIComponent(addrs[addrs.length - 1]);
      waypoints = addrs.slice(1, addrs.length - 1).map(encodeURIComponent).join('|');
    }
    var url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving'
      + '&origin=' + origin
      + '&destination=' + destination
      + (waypoints ? '&waypoints=' + waypoints : '');
    window.open(url, '_blank');
  };
