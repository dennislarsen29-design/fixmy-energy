  // ── AUTO LOGIN ─────────────────────────────────────────────────────────────
  window.addEventListener('load', async function() {
    // Magic link URL params take priority — skip session restore if present
    var _initParams = new URLSearchParams(location.search);
    if (_initParams.get('email') && _initParams.get('code')) {
      // Fall through to magic link handler below
    } else {
    // Restore rep/tech session
    var saved = sessionStorage.getItem('user');
    if (saved) {
      try {
        var u = JSON.parse(saved);
        if (u.isAdmin || u.role === 'admin') {
          currentUser = {isAdmin:true, email:ADMIN_EMAIL};
          CURRENT_ROLE = 'admin';
          loadAdminDashboard(); return;
        }
        if (u.isOps || u.role === 'ops') {
          var o = OPS_PARTNERS.find(function(x){ return x.id===u.id; }) || u;
          loadOpsDashboard(o); return;
        }
        if (u.isTech || u.role === 'tech') {
          var t = TECHS.find(function(x){ return x.id===u.id; }) || u;
          loadTechDashboard(t); return;
        }
        if (u.isRep || u.role === 'rep') {
          var r = SALES_REPS.find(function(x){ return x.id===u.id; }) || u;
          loadRepDashboard(r); return;
        }
        if (u.isSetter || u.role === 'setter') {
          var s = SETTERS.find(function(x){ return x.id===u.id; }) || u;
          loadSetterDashboard(s); return;
        }
        // Customer — re-fetch fresh data from DB so updates (invoice, step, etc.) are current
        currentUser = u;
        try {
          var rc = supabase.createClient(SUPA_URL, SUPA_KEY);
          var fr = await rc.from('customers').select('*').eq('id', u.id).limit(1);
          if (!fr.error && fr.data && fr.data.length) {
            var freshUser = fr.data[0];
            sessionStorage.setItem('user', JSON.stringify(freshUser));
            loadCustomerDashboard(freshUser);
          } else {
            loadCustomerDashboard(u);
          }
        } catch(e) { loadCustomerDashboard(u); }
        return;
      } catch(e) { sessionStorage.clear(); }
    }
    } // end else (no magic link params)
    var p=new URLSearchParams(location.search); var ue=p.get('email'),uc=p.get('code');
    if(ue&&uc){
      // Check for ops partner magic link first (codes are alphanumeric, not phone numbers)
      var _opsEmail = decodeURIComponent(ue).toLowerCase().trim();
      var _opsCode  = decodeURIComponent(uc).trim();
      var _opsMatch = OPS_PARTNERS.find(function(o){ return o.email===_opsEmail && o.code===_opsCode; });
      if(_opsMatch){
        sessionStorage.setItem('user', JSON.stringify({isOps:true, name:_opsMatch.name, id:_opsMatch.id, role:'ops'}));
        history.replaceState(null,'',location.pathname); // clean URL
        loadOpsDashboard(_opsMatch);
        return;
      }

      // Magic link auto-login for customers
      var cleanEmail = decodeURIComponent(ue).toLowerCase().trim();
      var rawUc = uc.trim();
      var cleanUc = rawUc.replace(/[^0-9]/g,'');
      if(cleanUc.length===11&&cleanUc.charAt(0)==='1') cleanUc=cleanUc.slice(1);
      if(cleanUc.length>11) cleanUc=cleanUc.slice(-10);

      // Show loading state on login box
      var lb = document.getElementById('loginBox');
      if(lb) lb.innerHTML = '<div style="text-align:center;padding:32px 20px;">' +
        '<div style="font-size:1.4rem;margin-bottom:12px;">☀️</div>' +
        '<div style="font-weight:700;font-size:1rem;margin-bottom:6px;">Solar<span style="color:#8DC63F">.</span>Review</div>' +
        '<p style="color:#aaa;font-size:0.8rem;margin-bottom:20px;">Loading your portal...</p>' +
        '<div id="mlStatus" style="font-size:0.75rem;color:#666;"></div>' +
        '</div>';

      function mlStatus(msg) {
        var el = document.getElementById('mlStatus');
        if(el) el.textContent = msg;
      }

      async function magicLinkLogin() {
        try {
          mlStatus('Connecting...');

          var client;
          try { client = supabase.createClient(SUPA_URL, SUPA_KEY); }
          catch(e) { client = null; }
          if (!client || typeof client.from !== 'function') {
            showMagicLinkError('Could not connect to Solar Review servers.',
              'Check your internet connection and try again. If the issue continues, call us at (619) 777-6527.');
            return;
          }

          // Check ops partners first (their codes contain letters — bypass digit-only validation)
          var opsMatch = OPS_PARTNERS.find(function(o){ return o.email.toLowerCase() === cleanEmail; });
          if (opsMatch) {
            if (rawUc.toLowerCase() === opsMatch.code.toLowerCase()) {
              mlStatus('');
              sessionStorage.setItem('user', JSON.stringify({isOps:true, name:opsMatch.name, id:opsMatch.id, role:'ops'}));
              loadOpsDashboard(opsMatch);
            } else {
              showMagicLinkError('Access code incorrect.', 'Check your link or contact admin.');
            }
            return;
          }

          // Check team_members (tech/rep/setter) before customer lookup
          var tmResp = await client.from('team_members').select('*').eq('email', cleanEmail).eq('active', true).limit(1);
          if (!tmResp.error && tmResp.data && tmResp.data.length) {
            var tm = tmResp.data[0];
            if (rawUc.trim() === tm.code) {
              if (sessionStorage.getItem('showWelcome_' + cleanEmail)) {
                sessionStorage.setItem('showWelcome_' + tm.id, '1');
                sessionStorage.removeItem('showWelcome_' + cleanEmail);
              }
              sessionStorage.setItem('user', JSON.stringify(Object.assign({}, tm, { isTech: tm.role==='tech', isRep: tm.role==='rep', isSetter: tm.role==='setter' })));
              history.replaceState(null, '', location.pathname);
              if (tm.role === 'setter') { loadSetterDashboard(tm); }
              else if (tm.role === 'rep') { loadRepDashboard(tm); }
              else { loadTechDashboard(tm); }
              return;
            } else {
              showMagicLinkError('Access code incorrect.', 'Check your welcome email for the correct code or contact info@fixmy.energy.');
              return;
            }
          }

          // Validate inputs
          if(!cleanEmail || !cleanEmail.includes('@')) {
            showMagicLinkError('Invalid link — email address missing or malformed.',
              'Try opening the link from your original email again, or contact Solar Review at (619) 777-6527.');
            return;
          }
          if(!cleanUc || cleanUc.length < 10) {
            showMagicLinkError('Invalid link — access code missing or too short.',
              'Try opening the link from your original email again, or contact Solar Review at (619) 777-6527.');
            return;
          }

          mlStatus('Looking up your account...');

          function normalize(ph) {
            var d=(ph||'').replace(/[^0-9]/g,'');
            if(d.length===11&&d.charAt(0)==='1') d=d.slice(1);
            if(d.length>11) d=d.slice(-10);
            return d;
          }

          // Use .limit(1) instead of .single() so duplicate records don't break magic-link login
          var resp = await client.from('customers').select('*').eq('email', cleanEmail).limit(1);

          var c = null;
          if(!resp.error && resp.data && resp.data.length) {
            c = resp.data[0];
          } else {
            // Email not found — fallback: look up by normalized access_code (handles phone-only records)
            var normCode = normalize(cleanUc);
            if(normCode) {
              var codeResp = await client.from('customers').select('*').eq('access_code', normCode).limit(1);
              if(!codeResp.error && codeResp.data && codeResp.data.length) {
                c = codeResp.data[0];
                // Backfill email on the record so future logins work by email
                if(cleanEmail && !c.email) {
                  client.from('customers').update({email: cleanEmail}).eq('id', c.id).then(function(){});
                }
              }
            }
          }

          if(!c) {
            showMagicLinkError(
              'We couldn\'t find an account for ' + cleanEmail + '.',
              'This link may have been sent to a different email address. Check your inbox for a Solar Review message, or call us at (619) 777-6527.'
            );
            return;
          }

          // Code mismatch
          var match = normalize(cleanUc)===normalize(c.phone)
                   || cleanUc===c.access_code
                   || normalize(cleanUc)===normalize(c.access_code)
                   || (c.email && c.email === cleanEmail); // if we matched by email above, code already verified implicitly
          if(!match) {
            showMagicLinkError(
              'Your access link has expired or is no longer valid.',
              'This can happen if you\'ve requested a new link or your phone number changed. Call us at (619) 777-6527 or reply to your Solar Review email to get a fresh link.'
            );
            return;
          }

          // Success
          mlStatus('');
          sessionStorage.setItem('user', JSON.stringify(c));
          if (new URLSearchParams(location.search).get('reset_tour') === '1') {
            localStorage.removeItem('portalOnboard_' + c.id);
          }
          loadCustomerDashboard(c);

        } catch(e) {
          showMagicLinkError(
            'Something went wrong loading your portal.',
            'Error: ' + (e.message||'Unknown error') + '. Please call us at (619) 777-6527 or try again in a moment.'
          );
        }
      }

      function showMagicLinkError(title, detail) {
        var lb = document.getElementById('loginBox');
        if(lb) lb.innerHTML =
          '<div style="padding:28px 24px;">' +
            '<div style="font-size:1.2rem;font-weight:700;margin-bottom:4px;">Solar<span style="color:#8DC63F">.</span>Review</div>' +
            '<div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:10px;padding:16px;margin:16px 0;">' +
              '<div style="font-weight:700;color:#ef4444;font-size:0.85rem;margin-bottom:6px;">⚠ ' + title + '</div>' +
              '<div style="font-size:0.78rem;color:#aaa;line-height:1.6;">' + detail + '</div>' +
            '</div>' +
            '<div style="font-size:0.75rem;color:#666;margin-bottom:16px;">Or sign in manually:</div>' +
            '<label style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:#888;display:block;margin-bottom:6px;">Email Address</label>' +
            '<input type="email" id="emailInput" value="' + cleanEmail + '" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:13px 14px;color:#F3EDE3;font-size:0.9rem;margin-bottom:12px;outline:none;box-sizing:border-box;"/>' +
            '<label style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:#888;display:block;margin-bottom:6px;">Access Code</label>' +
            '<input type="password" id="codeInput" placeholder="Your 10-digit phone number" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:13px 14px;color:#F3EDE3;font-size:0.9rem;margin-bottom:16px;outline:none;box-sizing:border-box;"/>' +
            '<button id="loginBtn" onclick="handleLogin()" style="width:100%;background:#8DC63F;color:#1A1A1A;border:none;border-radius:100px;padding:15px;font-size:0.9rem;font-weight:700;cursor:pointer;">Try Again</button>' +
            '<div class="err" id="errMsg" style="display:none;"></div>' +
            '<div style="text-align:center;margin-top:16px;"><a href="tel:6197776527" style="color:#8DC63F;font-size:0.78rem;font-weight:600;">📞 Call Solar Review (619) 777-6527</a></div>' +
          '</div>';
      }

      magicLinkLogin();
      return;
    }
    // session restore handled above
  });
</script>

  // ── UNIFIED SALES / TECH DASHBOARD ────────────────────────────────────────
  async function loadSalesDashboard(person, config) {
    config = config || {};

    // Agreement gate — Supabase is authoritative; localStorage used as offline fallback
    var agreementSigned = !!person.agreementSigned;
    // If rep just signed this session, trust it immediately (avoids Supabase re-check race)
    var justSigned = false;
    try { justSigned = !!sessionStorage.getItem('repAgreementJustSigned_' + person.id); } catch(e) {}
    if (justSigned) {
      agreementSigned = true;
    } else {
      try {
        var agc = supabase.createClient(SUPA_URL, SUPA_KEY);
        var agr = await agc.from('rep_agreements').select('id').eq('rep_id', person.id).maybeSingle();
        if (agr.data) {
          agreementSigned = true;
          try { localStorage.setItem('repAgreement_' + person.id, 'supabase'); } catch(e) {}
        } else if (!agr.error) {
          // Supabase returned no record — check for a local signed record before clearing
          var localRec = null;
          try { localRec = localStorage.getItem('repAgreement_' + person.id); } catch(e) {}
          if (localRec && localRec !== 'supabase') {
            // Local signed record exists but not in Supabase — let them through and re-sync
            agreementSigned = true;
            var rParts = localRec.split('|');
            var rTs = rParts[0], rName = rParts.slice(1).join('|');
            if (rName) {
              agc.from('rep_agreements').insert({rep_id:person.id, rep_name:person.name, rep_legal_name:rName, signed_at:rTs, source:'resync'}).then(function(res){
                if (!res.error) { try { localStorage.setItem('repAgreement_'+person.id,'supabase'); } catch(ex){} }
              });
            }
          } else {
            // Truly no record (admin reset or never signed) — clear cache
            agreementSigned = false;
            try { localStorage.removeItem('repAgreement_' + person.id); } catch(e) {}
          }
        } else {
          // Supabase unreachable — fall back to localStorage so rep isn't locked out offline
          try { if (localStorage.getItem('repAgreement_' + person.id)) agreementSigned = true; } catch(e) {}
        }
      } catch(e) {
        try { if (localStorage.getItem('repAgreement_' + person.id)) agreementSigned = true; } catch(e2) {}
      }
    }

    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('userName').textContent = person.name + ' \xB7 ' + (agreementSigned ? roleLabel : 'Agreement Review');
    var _ssb = document.getElementById('subSheetBtn'); if (_ssb) _ssb.style.display = 'inline-flex';

    if (!agreementSigned) {

        var repName = (document.getElementById('agName') ? document.getElementById('agName').value : '').trim();
        var checked = !!(document.getElementById('agCheck') && document.getElementById('agCheck').checked);
        if (!repName) { alert('Please type your full legal name to sign.'); return; }
        if (!checked) { alert('Please check the box confirming you have read and agree to the terms.'); return; }
        var ts = new Date().toISOString();
        try { localStorage.setItem('repAgreement_' + person.id, ts + '|' + repName); } catch(e) {}
        try { sessionStorage.setItem('repAgreementJustSigned_' + person.id, '1'); } catch(e) {} // bypass re-check this session
        try {
          fetch(GHL_WEBHOOK, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({firstName:person.name,lastName:repName,source:'Rep Agreement Signed',
              tags:['rep-agreement-signed'],customField:{rep_id:person.id,rep_legal_name:repName,signed_at:ts}})
          });
        } catch(e){}
        try {
          var agClient = supabase.createClient(SUPA_URL, SUPA_KEY);
          var agPayload = {rep_id:person.id, rep_name:person.name, rep_legal_name:repName, signed_at:ts, source:'self-signed'};

            } else {

            try { localStorage.setItem('repAgreement_' + person.id, 'supabase'); } catch(ex) {}

        var streak = parseInt(localStorage.getItem('fieldKnockStreak_'+pid) || '0');
        if (lastDate !== today) {
          var yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
          streak = (lastDate === yesterday) ? streak + 1 : 1;
        }
        count++;
        localStorage.setItem('fieldKnockDate_'+pid, today);
        localStorage.setItem('fieldKnockCount_'+pid, String(count));
        localStorage.setItem('fieldKnockStreak_'+pid, String(streak));

        var cat = document.getElementById('seLeadCat').value || 'fixmy';

        var updates = {

          last_name: document.getElementById('seLast').value || null,

          monthly_bill: billRaw ? parseFloat(billRaw) : null,
          notes: document.getElementById('seNotes').value || null,
          lead_source: (document.getElementById('seLeadSource')||{}).value || null,
        };
        var c2 = supabase.createClient(SUPA_URL, SUPA_KEY);
        var res = await c2.from('customers').update(updates).eq('id', id);
        if (res.error) { alert('Save failed: ' + res.error.message); return; }

    var canvassLeads = [];

    var canvassErrMsg = '';
    var canvassGpsFailed = false; // true = GPS denied/timeout, false = network/query error
    var canvassSkipIds = [];
    var _canvassLoadProgress = '';
    var _canvassWatchId = null; // live GPS watch handle

    // Restore leads from local cache (< 60 min old) to survive re-login / page reloads

          canvassGpsStatus = 'ready';
        }
      } catch(e) {}
    })();

    function canvassHaversine(lat1, lng1, lat2, lng2) {
      var R = 3958.8; // miles
      var dLat = (lat2-lat1) * Math.PI/180;
      var dLng = (lng2-lng1) * Math.PI/180;
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    window.canvassInit = async function() {
      canvassGpsStatus = 'gps';
      canvassGpsFailed = false;
      renderSales();
      var gpsLat = null, gpsLng = null;
      try {
        var pos = await Promise.race([
          new Promise(function(resolve, reject) {
            navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:false, timeout:10000, maximumAge:60000});
          }),
          new Promise(function(_, reject) {
            setTimeout(function(){ reject(new Error('GPS timeout')); }, 10500);
          })
        ]);
        gpsLat = pos.coords.latitude;
        gpsLng = pos.coords.longitude;
      } catch(e) {
        canvassGpsFailed = true; // GPS denied or timed out — proceed without, no error shown
      }
      try {
        await _canvassLoadLeads(gpsLat, gpsLng);
      } catch(e2) {
        canvassErrMsg = (e2 && e2.message ? e2.name + ': ' + e2.message : String(e2)) +
          (e2 && e2.stack ? '\n' + e2.stack.split('\n').slice(0,3).join('\n') : '');
        canvassGpsStatus = 'error';
        renderSales();
      }
    };

    async function _canvassLoadLeads(userLat, userLng) {
      canvassGpsStatus = 'loading';
      canvassUserLat = userLat;
      canvassUserLng = userLng;
      renderSales();

      var SEL = 'id,first_name,last_name,address,notes,title_owner,apn,lat,lng,knock_status,knocked_at,knocked_by,lead_source,rep_id,step,phone,email,dnc,lead_score,original_installer,install_year';
      var client = supabase.createClient(SUPA_URL, SUPA_KEY);

      var query = client.from('customers').select(SEL)
        .eq('lead_source', 'orphaned_list')
        .is('sold_type', null);

      if (userLat && userLng) {
        var D = 0.10; // ~7-mile bounding box
        query = query
          .not('lat', 'is', null)
          .gte('lat', userLat - D).lte('lat', userLat + D)
          .gte('lng', userLng - D).lte('lng', userLng + D);
      } else {
        query = query.order('lead_score', { ascending: false });
      }
      query = query.limit(80);

      var result = await query;
      if (result.error) {
        canvassErrMsg = 'Supabase: ' + result.error.message +
          (result.error.details ? ' | ' + result.error.details : '') +
          (result.error.hint   ? ' | hint: ' + result.error.hint : '') +
          ' (code: ' + (result.error.code || '?') + ')';
        canvassGpsStatus = 'error';
        renderSales();
        return;
      }
      if (!Array.isArray(result.data)) {
        canvassErrMsg = 'Unexpected response type: ' + typeof result.data + '. Check Supabase RLS and anon key.';
        canvassGpsStatus = 'error';
        renderSales();
        return;
      }
      var leads = result.data.slice();

      if (userLat && userLng) {
        leads.forEach(function(l) {
          l._distMi = canvassHaversine(userLat, userLng, l.lat, l.lng);
          l._hot = l.knock_status === 'callback' || l.knock_status === 'interested';
        });
        leads.sort(function(a, b) {
          if (a._hot && !b._hot) return -1;
          if (!a._hot && b._hot) return 1;
          if (a.knock_status && !b.knock_status) return 1;
          if (!a.knock_status && b.knock_status) return -1;
          return a._distMi - b._distMi;
        });
      }

      // If GPS filter returned nothing, reload without geo constraint
      if (userLat && userLng && leads.length === 0) {
        var fb = await client.from('customers').select(SEL)
          .eq('lead_source', 'orphaned_list')
          .is('sold_type', null)
          .not('lat', 'is', null)
          .order('lead_score', { ascending: false, nullsFirst: false })
          .limit(80);
        leads = Array.isArray(fb.data) ? fb.data : [];
      }

      canvassLeads = leads.filter(function(l){ return canvassSkipIds.indexOf(l.id) < 0; });
      canvassGpsStatus = 'ready';
      try { localStorage.setItem('bbLeadsCache', JSON.stringify({ts: Date.now(), leads: canvassLeads, lat: canvassUserLat, lng: canvassUserLng, skipIds: canvassSkipIds})); } catch(e) {}
      renderSales();

      // Start live GPS watch so route re-sorts as user walks — clears previous watch first
      if (_canvassWatchId !== null) { try { navigator.geolocation.clearWatch(_canvassWatchId); } catch(e){} _canvassWatchId = null; }
      if (navigator.geolocation) {
        _canvassWatchId = navigator.geolocation.watchPosition(function(pos) {
          canvassUserLat = pos.coords.latitude;
          canvassUserLng = pos.coords.longitude;
          canvassLeads.forEach(function(l) {
            if (l.lat && l.lng) l._distMi = canvassHaversine(canvassUserLat, canvassUserLng, l.lat, l.lng);
          });
          canvassLeads.sort(function(a, b) {
            if (a._hot && !b._hot) return -1;
            if (!a._hot && b._hot) return 1;
            if (a.knock_status && !b.knock_status) return 1;
            if (!a.knock_status && b.knock_status) return -1;
            return (a._distMi || 999) - (b._distMi || 999);
          });
          renderSales();
        }, null, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
      }
    }

    window.canvassKnock = async function(id, knockStatus) {

    window.canvassBatchRoute = function(n) {
      var unvisited = canvassLeads.filter(function(l){ return !l.knock_status && l.address; });
      var batch = unvisited.slice(0, n || 5);
      if (!batch.length) return;
      // Nearest-neighbor optimizer: reorder stops for efficient driving when coords available
      if (canvassUserLat && canvassUserLng) {
        var hav = function(a,b,c,d){var R=3958.8,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)*Math.sin(dG/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));};
        var rem=batch.slice(),ordered=[],cLat=canvassUserLat,cLng=canvassUserLng;
        while(rem.length){var bi=-1,bd=Infinity;rem.forEach(function(l,i){if(l.lat&&l.lng){var d=hav(cLat,cLng,l.lat,l.lng);if(d<bd){bd=d;bi=i;}}});if(bi<0){ordered=ordered.concat(rem);break;}cLat=rem[bi].lat;cLng=rem[bi].lng;ordered.push(rem.splice(bi,1)[0]);}
        batch = ordered;
      }
      var addrs = batch.map(function(l){ return l.address; });
      var origin, destination, waypoints;
      if (canvassUserLat && canvassUserLng) {
        origin = canvassUserLat + ',' + canvassUserLng;
        destination = encodeURIComponent(addrs[addrs.length - 1]);
        waypoints = addrs.slice(0, addrs.length - 1).map(encodeURIComponent).join('|');
      } else {
        origin = encodeURIComponent(addrs[0]);
        destination = encodeURIComponent(addrs[addrs.length - 1]);
        waypoints = addrs.slice(1, addrs.length - 1).map(encodeURIComponent).join('|');
      }
      var url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving'
        + '&origin=' + origin
        + '&destination=' + destination
        + (waypoints ? '&waypoints=' + waypoints : '');
      window.open(url, '_blank');
    };

      var m = document.getElementById('repChatModal'); if (m) m.style.display = 'none';
    };
    window._renderRepChat = function() {
      var hist = document.getElementById('repChatHistory'); if (!hist) return;
      if (!window._repChatHistory.length) {
        hist.innerHTML = '<div style="text-align:center;color:#555;font-size:0.8rem;padding:20px 0;">Ask me anything — door scripts, objections, pricing, SDCP, battery pitch&hellip;</div>';
        return;
      }
      hist.innerHTML = window._repChatHistory.map(function(m){
        var isUser = m.role === 'user';
        return '<div style="display:flex;justify-content:'+(isUser?'flex-end':'flex-start')+';">'+
          '<div style="max-width:82%;padding:9px 13px;border-radius:'+(isUser?'16px 16px 4px 16px':'16px 16px 16px 4px')+';background:'+(isUser?'#8DC63F':'rgba(255,255,255,0.07)')+';color:'+(isUser?'#1A1A1A':'#ddd')+';font-size:0.82rem;line-height:1.45;white-space:pre-wrap;">'+m.content+'</div></div>';
      }).join('');
      hist.scrollTop = hist.scrollHeight;
    };
    window.repChatQuick = function(msg) {
      var inp = document.getElementById('repChatInput'); if (inp) inp.value = msg;
      window.sendRepChat();
    };
    window.sendRepChat = async function() {
      var inp = document.getElementById('repChatInput'); if (!inp) return;
      var msg = inp.value.trim(); if (!msg) return;
      inp.value = '';
      window._repChatHistory.push({ role: 'user', content: msg });
      window._renderRepChat();
      // typing indicator
      var hist = document.getElementById('repChatHistory');
      if (hist) { var typing = document.createElement('div'); typing.id='rcTyping'; typing.style='color:#555;font-size:0.75rem;padding:4px 0;'; typing.textContent='⚡ Thinking…'; hist.appendChild(typing); hist.scrollTop=hist.scrollHeight; }
      try {
        var resp = await fetch('/.netlify/functions/rep-assistant', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ message: msg, history: window._repChatHistory.slice(0,-1), repName: person.name||'Rep', repRole: config.setterMode?'setter':'tech' })
        });
        var data = await resp.json();
        var reply = data.reply || data.error || 'Something went wrong — try again.';
        window._repChatHistory.push({ role: 'assistant', content: reply });
      } catch(e) {
        window._repChatHistory.push({ role: 'assistant', content: 'Connection error — check your signal and try again.' });
      }
      var t = document.getElementById('rcTyping'); if (t) t.remove();
      window._renderRepChat();
    };

    // Auto-open lead capture form (Ronda/setter primary view — only if agreement signed)
    if (config.autoOpenForm && agreementSigned) {
      setTimeout(function() {
        if (typeof openNewLead === 'function') openNewLead(person.id, person.name, true);
      }, 150);
    }
  }

  async function loadRepDashboard(rep) {
    return loadSalesDashboard(rep, {roleLabel: 'Setter', showFieldJobs: false, setterMode: true, autoOpenForm: true});
  }

  // Rep commission = (Revenue - Costs) × 40%, matching the rep agreement formula
  function calcRepCommission(lead) {
    var amt = parseFloat(lead.invoice_amount) || 0;
    if (!amt && lead.step >= 8) amt = 500;
    if (lead.install_type === 'battery') {
      return Math.max(0, Math.round((amt - 14500) * 0.40));
    }
    var base = parseFloat(lead.project_costs) || 250;
    return Math.max(0, Math.round((amt - base) * 0.40));
  }

      document.getElementById('dashBody').innerHTML = h;
      // Immediately repopulate solar panel from cache (survives each re-render)
      if (activeJobId && opsSolarCache[activeJobId]) {
        var _sw = document.getElementById('opssolar_' + activeJobId);
        if (_sw) _sw.innerHTML = opsSolarCache[activeJobId];
      }
      if (activeJobId) {
        currentJobId = activeJobId;
        var _opsActiveJob = jobs.find(function(j){ return j.id === activeJobId; });
        loadJobPhotos(activeJobId).then(renderOps);
        // Trigger first solar load if not yet cached
        if (_opsActiveJob && _opsActiveJob.address && !opsSolarCache[activeJobId]) {
          setTimeout(function() { loadOpsSolarPanel(_opsActiveJob.address, activeJobId); }, 250);
        }
      }
    }

    window.opsSetView = function(v) {
      opsView = v;
      sessionStorage.setItem('opsView_' + ops.id, v);
      renderOps();
    };
    window.opsToggleJob = function(jid) {
      activeJobId = (activeJobId === jid) ? null : jid;
      if (activeJobId) { currentJobId = activeJobId; loadJobPhotos(activeJobId).then(renderOps); }
      else renderOps();
    };
    window.setOpsJob   = function(jid) { currentJobId = jid; activeJobId = jid; };
    window.opsHandlePhotoSelect = function(event, jid) {
      currentJobId = jid; activeJobId = jid;
      uploadPhotos(Array.from(event.target.files)).then(renderOps);
    };
    window.handleOpsDrop = function(event, jid) {
      event.preventDefault();
      currentJobId = jid; activeJobId = jid;
      uploadPhotos(Array.from(event.dataTransfer.files).filter(function(f){ return f.type.startsWith('image/'); })).then(renderOps);
    };
    window.opsArchiveJob = async function(jid) {
      if (!confirm('Archive this job? It will be removed from your jobs list.')) return;
      var client2 = supabase.createClient(SUPA_URL, SUPA_KEY);
      var res = await client2.from('customers').update({ archived: true }).eq('id', jid);
      if (res.error) { alert('Archive failed: ' + res.error.message); return; }
      jobs = jobs.filter(function(j) { return j.id !== jid; });
      renderOps();
    };
    window.opsToggleCheck = function(jid, key) {
      var checkKey = 'job_' + jid;
      if (!checklistState[checkKey]) checklistState[checkKey] = {};
      checklistState[checkKey][key] = !checklistState[checkKey][key];
      sessionStorage.setItem('checklist_ops_' + ops.id, JSON.stringify(checklistState));
      renderOps();
    };
    window.saveOpsNotes = async function(jid) {
      var ta = document.querySelector('[data-notes-jid="' + jid + '"]');
      var notes = ta ? ta.value : '';
      var c2 = supabase.createClient(SUPA_URL, SUPA_KEY);
      await c2.from('customers').update({assessment_notes: notes}).eq('id', jid);
      var btn = document.querySelector('[data-notes-jid="' + jid + '"]').nextElementSibling;
      if (btn) { btn.textContent = '✓ Saved'; setTimeout(function(){ btn.textContent = '💾 Save Notes'; }, 2000); }
    };

    async function loadOpsSolarPanel(address, jid) {
      // If cached, re-inject immediately (DOM was rebuilt by renderOps)
      if (opsSolarCache[jid]) {
        var w = document.getElementById('opssolar_' + jid);
        if (w) w.innerHTML = opsSolarCache[jid];
        return;
      }
      try {
        var geo = await fetch('https://maps.googleapis.com/maps/api/geocode/json?address=' + encodeURIComponent(address) + '&key=' + GKEY);
        var gd = await geo.json();
        if (gd.status !== 'OK') { var we = document.getElementById('opssolar_' + jid); if (we) we.innerHTML = ''; return; }
        var loc = gd.results[0].geometry.location;
        var sat = 'https://maps.googleapis.com/maps/api/staticmap?center=' + encodeURIComponent(address) + '&zoom=19&size=700x220&maptype=satellite&key=' + GKEY;
        var sr = await fetch('https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude=' + loc.lat + '&location.longitude=' + loc.lng + '&requiredQuality=LOW&key=' + GKEY);
        var s = sr.status === 200 ? (await sr.json()).solarPotential : null;
        var stats = '';
        if (s) {
          var maxKw = s.maxArrayPanelsCount ? (s.maxArrayPanelsCount * 0.4).toFixed(1) : '--';
          var sunHrs = s.maxSunshineHoursPerYear ? Math.round(s.maxSunshineHoursPerYear) : '--';
          function osStat(v,l){ return '<div style="text-align:center;background:rgba(0,0,0,0.05);border-radius:8px;padding:8px 4px;"><div style="font-size:0.9rem;font-weight:700;color:#3d6b12;">'+v+'</div><div style="font-size:0.6rem;color:#666;margin-top:2px;">'+l+'</div></div>'; }
          stats = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;">' +
            osStat(s.maxArrayPanelsCount||'--','Max Panels') + osStat(maxKw+' kW','Max Capacity') + osStat(sunHrs+' hrs','Peak Sun/Yr') + '</div>';
        }
        var html = '<div style="background:#eeeee8;border:1px solid rgba(0,0,0,0.09);border-radius:10px;padding:12px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
          '<span style="font-size:0.72rem;font-weight:700;color:#3d6b12;">🛰 Rooftop Solar Intelligence</span>' +
          '<span style="font-size:0.6rem;color:#888;">Google Solar API</span></div>' +
          '<img src="' + sat + '" style="width:100%;border-radius:8px;max-height:160px;object-fit:cover;" onerror="this.style.display=\'none\'"/>' +
          stats + '</div>';
        opsSolarCache[jid] = html;
        var wf = document.getElementById('opssolar_' + jid);
        if (wf) wf.innerHTML = html;
      } catch(e) {
        var wErr = document.getElementById('opssolar_' + jid);
        if (wErr) wErr.innerHTML = '';
      }
    }

    renderOps();
  }

</script>
</body>
</html>
