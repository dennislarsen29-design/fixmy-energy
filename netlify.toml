[build]
  functions = "netlify/functions"

# Force every HTML page to revalidate with the server on load instead of a browser
# serving a stale disk-cached copy indefinitely (2026-09-02, per Dennis — Cosmic,
# Ronda, and Cristina all had to manually clear Safari history to see new portal.html
# deploys land). No [[headers]] block existed anywhere in this file, so Safari's own
# caching heuristics were deciding how long to hold a page with nothing telling it
# otherwise. no-cache does NOT mean "don't cache" — it still allows a fast conditional
# reload (a 304 when nothing changed), it just guarantees the browser checks with the
# server every time instead of assuming its old copy is still good.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ⚠️ Real gap found 2026-09-06: the rule above only matches a request path that
# literally ends in ".html" — but /portal (the URL every admin/tech/rep actually
# uses, not /portal.html) has no [[redirects]] entry at all; Netlify serves it via
# its own automatic pretty-URL alias, which does NOT go through the header-matching
# path above. So the exact page this fix was built for was never actually covered —
# Dennis reported a fresh deploy still not showing up after "Refresh Now", which
# traced back to this. Same applies to every other pretty-URL page in this file
# (book, sign, thank-you, etc.) — listed explicitly here rather than guessing at a
# single wildcard pattern that might also catch static assets that should stay
# cacheable.
# ⚠️ 2026-09-18: /portal (and its .html path) upgraded no-cache → no-store. Reps/ops
# were STILL landing on stale copies even after the 2026-09-06 header fix — iOS Safari
# doesn't reliably revalidate on reload, and people were clearing website history daily
# to see updates. no-store means the browser never keeps a copy at all, so every open
# fetches the live deploy (~a few hundred KB compressed — accepted cost for an internal
# tool that changes multiple times a day). Marketing pages stay on the cheaper no-cache.
[[headers]]
  for = "/portal"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/portal.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sign"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/book"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/booked"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/thank-you"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/ghl-journey.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/business-model.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# ⚠️ Real root cause found 2026-09-24, from live evidence not just theory: Dennis's own
# rep_agreements rows showed a "self-signed" row from 2026-09-23 carrying agreement_version
# '2026-09-06-axia-qcell' — a version string that was already TWO WEEKS STALE by then
# (REP_AGREEMENT_VERSION had moved on to '2026-09-19-monitoring-removed' and then
# '2026-09-21-cashloan-redline' before that date). The only way a fresh sign-in can write
# an old version string is if the JS actually executing in the browser was itself old — so
# despite the Sept 2/6/18 fixes above, his device was STILL running week-old portal.html.
#
# Found why: a separate, legacy `_headers` file at the repo root ALSO defined Cache-Control
# for `/portal.html` and `/*.html` — a second, independent header source Netlify has to
# reconcile against these `[[headers]]` blocks. It was never updated when the `/portal`
# (no extension) rule above was added on 2026-09-06, so it had zero coverage for the one
# URL every rep/tech/admin actually uses, and Netlify explicitly warns against maintaining
# both a `_headers` file and netlify.toml `[[headers]]` blocks for overlapping paths —
# precedence/merge behavior between the two isn't something to rely on. Deleted `_headers`
# entirely and folded its two unique rules (ghl-journey.html / business-model.html
# X-Robots-Tag) into this file, so there is now exactly ONE source of truth for every
# header on this site, with /portal explicitly covered.
[functions."permitstack-pull"]
  timeout = 26

[functions."eval-bill-analysis"]
  timeout = 26  # single-document Claude call (photo or PDF) fired live from the Eval
                # Wizard the moment a rep uploads the bill — default sync limit risks
                # cutting off a slow PDF fetch + vision/document read mid-flight.

# Scheduled functions run as background functions (up to 15 min).
# Times are UTC — San Diego is UTC-7 (PDT) / UTC-8 (PST).
# 14:00 UTC ≈ 7am PDT | 15:00 UTC ≈ 8am PDT | 16:00 UTC ≈ 9am PDT

[functions."marketing-agent"]
  schedule = "0 14 * * 1"  # Every Monday ~7am PT

[functions."bizdev-agent"]
  schedule = "0 14 * * 2"  # Every Tuesday ~7am PT

[functions."bb-auto-pipeline-background"]
  schedule = "0 9 * * *"  # Every day 9am UTC = 2am PDT

[functions."bb-enrich-only-background"]
  schedule = "0 11 * * *"  # Every day 11am UTC = 4am PDT — enrich-only pass to flush owner/skip-trace backlog (after the 2am full run)

[functions."ig-insights"]
  schedule = "0 16 * * *"  # Every day ~9am PT — Instagram stats sync (no-op until IG_ACCESS_TOKEN is set)

[functions."seo-insights"]
  timeout = 26  # A manual GET to the function URL is a plain HTTP call, NOT a scheduled
                # invocation — it does not inherit the 15-min background-function budget
                # the nightly schedule gets, only the default synchronous limit. This
                # function makes 6-7 sequential Google/Supabase round trips even after
                # parallelizing the two GA4 calls; the default ceiling was silently too
                # low for manual testing, which is why the fix above alone didn't help.
  schedule = "40 13 * * *"  # Every day ~6:40am PT — Search Console + GA4 pull (no-op until GSC_SERVICE_ACCOUNT is set)

[functions."seo-agent"]
  schedule = "0 15 * * 4"  # Every Thursday ~8am PT — weekly AI SEO analysis into the Agent Inbox

[functions."roadmap-agent"]
  schedule = "0 15 * * 5"  # Every Friday ~8am PT — AI growth strategist adds new roadmap tasks + files a summary

[functions."coaching-agent"]
  schedule = "0 15 * * 1"  # Every Monday ~8am PT — weekly 1:1s sales-coach analysis from AI call/knock notes

[functions."agent-report-digest"]
  schedule = "30 16 * * *"  # Every day ~9:30am PT — email Dennis a digest of all new AI agent reports (no-op when there's nothing new)

[functions."shift-autoclose"]
  schedule = "*/15 * * * *"  # Every 15 min — closes shifts a rep never clocked out of, stamped at their last real activity

[functions."quoya-sync-background"]
  schedule = "0 10 * * *"  # Every day ~3am PT — nightly Quoya photo categorization sweep (decoupled from upload, see lib/quoya.js)

[functions."ghl-payments-reconcile-background"]
  schedule = "20 10 * * *"  # Every day ~3:20am PT — sweep GHL transactions into the payments ledger (35-day window)

[functions."plaid-sync"]
  schedule = "30 11 * * *"  # Every day ~4:30am PT — Plaid bank/card transaction sync (no-op until PLAID_* env vars set)

[functions."finance-agent"]
  schedule = "0 12 * * *"  # Every day ~5am PT — nightly AI financial advisor (runs after the payments sweep + Plaid sync)

[functions."personal-plaid-sync"]
  schedule = "45 11 * * *"  # Every day ~4:45am PT — personal bank/card + Schwab holdings sync (no-op until PLAID_* env vars set)

[functions."personal-finance-agent"]
  schedule = "15 12 * * *"  # Every day ~5:15am PT — personal AI Financial Coach (runs after the personal Plaid sync)

[functions."outage-sync"]
  schedule = "*/20 * * * *"  # Every 20 min — live SDG&E outage snapshot for Black Box Focus ZIP targeting (outages are transient, needs to stay fresh)

