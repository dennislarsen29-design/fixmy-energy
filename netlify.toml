[functions."pr-research-agent-background"]
  schedule = "0 17 * * 2"  # Every Tuesday ~10am PT — PR researcher queues new editorial outlets + public contacts for review (never emails anyone)

[functions."pr-link-check"]
  schedule = "15 11 * * *"  # Nightly ~4:15am PT — re-reads each logged article to confirm our backlink is still live
  timeout = 26

[functions."listings-check"]
  schedule = "25 11 * * *"  # Nightly ~4:25am PT — re-reads each live business listing to confirm our name + phone are still on it (never submits anything)
  timeout = 26

[functions."listings-api"]
  timeout = 26  # "Check listings now" reads up to 25 directory pages

[functions."pr-pitch-draft"]
  timeout = 26  # one Claude call, fired live from the Agents tab

# Content engine (2026-11-23): Quoya drafts 1 blog + 3 short posts every Monday; Dennis approves in
# Agents -> Content; content-publish posts approved items when due (blog -> commit to main, posts -> GHL).
[functions."content-agent-background"]
  schedule = "10 13 * * 1"  # Mondays ~5-6am PT — draft the week's content (nothing is posted until approved)

[functions."content-publish"]
  schedule = "5,35 * * * *"  # every 30 min — publish approved items whose time has come
  timeout = 26

[functions."content-api"]
  timeout = 26  # "Publish now" commits the blog / posts to GHL live from the portal

[functions."business-review-agent-background"]
  schedule = "0 14 * * 1"  # Mondays ~6-7am PT — one weekly business review (replaces marketing, bizdev and crm-dev agents)

[[redirects]]
  from = "/blog/sunworks-solcius-out-of-business"
  to = "/blog/sunworks-solcius-out-of-business.html"
  status = 200
