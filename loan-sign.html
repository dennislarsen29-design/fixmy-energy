<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Loan Agreement — Sign</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f4f5f7; color:#1a1a1a; line-height:1.55; }
  .wrap { max-width:620px; margin:0 auto; padding:24px 18px 60px; }
  .card { background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:14px; padding:22px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .sub { color:#666; font-size:0.85rem; margin-bottom:18px; }
  .row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(0,0,0,0.06); font-size:0.9rem; }
  .row:last-child { border-bottom:none; }
  .row b { font-weight:700; }
  .terms { font-size:0.82rem; color:#444; background:#fafafa; border:1px solid rgba(0,0,0,0.06); border-radius:10px; padding:14px; margin:14px 0; }
  label { font-size:0.78rem; font-weight:700; color:#555; display:block; margin:14px 0 6px; }
  input[type=text] { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid rgba(0,0,0,0.2); border-radius:10px; font-size:1rem; font-family:'Georgia',serif; }
  button { width:100%; margin-top:16px; padding:14px; background:#1a7f37; color:#fff; border:none; border-radius:100px; font-size:1rem; font-weight:700; cursor:pointer; }
  button:disabled { opacity:0.5; }
  .msg { text-align:center; padding:14px; font-size:0.9rem; }
  .ok { color:#1a7f37; } .err { color:#c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="main"><div class="msg">Loading agreement…</div></div>
</div>
<script>
  var API = '/.netlify/functions/loan-api';
  function money(n){ return '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function token(){ var m = location.search.match(/[?&]t=([^&]+)/); return m ? decodeURIComponent(m[1]) : ''; }
  var t = token();

  // We render the terms from the seeded numbers (7% / $20,000 / 36 mo) — the sign action
  // is validated server-side by the token. The lender/borrower/amounts are fixed on file.
  var terms = { lender:'Cody & Casey Larsen', borrower:'Dennis Larsen', principal:20000, apr:7, term:36, monthly:617.55 };

  function render(){
    if (!t) { document.getElementById('main').innerHTML = '<div class="msg err">Invalid link.</div>'; return; }
    var totalPaid = terms.monthly * terms.term;
    document.getElementById('main').innerHTML =
      '<h1>Personal Loan Agreement</h1>'+
      '<div class="sub">Please review and sign to accept the terms of this loan.</div>'+
      '<div class="row"><span>Lender</span><b>'+terms.lender+'</b></div>'+
      '<div class="row"><span>Borrower</span><b>'+terms.borrower+'</b></div>'+
      '<div class="row"><span>Principal</span><b>'+money(terms.principal)+'</b></div>'+
      '<div class="row"><span>Interest rate (APR)</span><b>'+terms.apr+'%</b></div>'+
      '<div class="row"><span>Term</span><b>'+terms.term+' months</b></div>'+
      '<div class="row"><span>Monthly payment</span><b>'+money(terms.monthly)+'</b></div>'+
      '<div class="row"><span>Total of payments</span><b>'+money(totalPaid)+'</b></div>'+
      '<div class="terms">'+
        'The Borrower ('+terms.borrower+') agrees to repay the Lender ('+terms.lender+') the principal sum of '+money(terms.principal)+
        ' with interest at '+terms.apr+'% per annum, in '+terms.term+' equal monthly installments of approximately '+money(terms.monthly)+
        ', beginning the month following execution of this agreement. The Borrower may prepay any amount at any time without penalty; '+
        'prepayments reduce the outstanding principal and shorten the payoff. This is a good-faith agreement between family members.'+
      '</div>'+
      '<label>Type your full legal name to sign</label>'+
      '<input type="text" id="sig" placeholder="'+terms.borrower+'" autocomplete="name"/>'+
      '<button id="signBtn" onclick="doSign()">Sign &amp; Accept — '+money(terms.principal)+' @ '+terms.apr+'%</button>'+
      '<div id="status" class="msg"></div>';
  }

  window.doSign = function(){
    var sig = (document.getElementById('sig').value||'').trim();
    var st = document.getElementById('status');
    if (sig.length < 3) { st.className='msg err'; st.textContent='Please type your full name to sign.'; return; }
    var btn = document.getElementById('signBtn'); btn.disabled = true; btn.textContent = 'Signing…';
    fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'sign', sign_token:t, signature:sig }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok || d.alreadySigned) {
          document.getElementById('main').innerHTML = '<h1>✓ Signed</h1><div class="msg ok">Thank you, '+sig+'. Your loan agreement is now active. Cody & Casey can track the balance and your payments.</div>';
        } else { st.className='msg err'; st.textContent = d.error || 'Could not sign — try again.'; btn.disabled=false; btn.textContent='Sign & Accept'; }
      })
      .catch(function(e){ st.className='msg err'; st.textContent='Error: '+e.message; btn.disabled=false; btn.textContent='Sign & Accept'; });
  };
  render();
</script>
</body>
</html>
